{tag:"pratiques",q:"Combien de pratiques ITIL 4 existe-t-il et comment sont-elles regroupées ?",
opts:["34 pratiques en 3 groupes : pratiques générales de gestion, pratiques de gestion des services et pratiques de gestion technique","26 pratiques réparties en 2 groupes : générales et techniques","40 pratiques sans catégorisation officielle","18 pratiques essentielles couvertes par la certification Foundation"],
ans:0,why:"ITIL 4 définit <strong>34 pratiques</strong> en 3 groupes : <strong>14 pratiques générales de gestion</strong> — <strong>17 pratiques de gestion des services</strong> — <strong>3 pratiques de gestion technique</strong>.",
whynot:["","Il y a 34 pratiques, pas 26, et 3 groupes, pas 2.","ITIL 4 définit exactement 34 pratiques avec une catégorisation officielle.","18 pratiques n'est pas le chiffre officiel."]},

{tag:"pratiques",q:"Quel est l'objectif principal de la pratique de gestion des incidents ?",
opts:["Minimiser l'impact négatif des incidents en rétablissant le fonctionnement normal du service aussi rapidement que possible","Identifier les causes profondes des incidents et mettre en œuvre des solutions permanentes","Gérer le cycle de vie complet de toutes les demandes de changement impactant les services","Assurer la continuité des services IT en maintenant des plans de reprise après sinistre à jour"],
ans:0,why:"La <strong>gestion des incidents</strong> vise à <strong>minimiser l'impact négatif</strong> en rétablissant le fonctionnement normal du service aussi rapidement que possible. Elle ne cherche pas la cause profonde — c'est le rôle de la gestion des problèmes.",
whynot:["","Identifier les causes profondes est le rôle de la gestion des problèmes.","Gérer les changements est le rôle de l'activation du changement.","La continuité des services relève de la pratique ITSCM."]},

{tag:"pratiques",q:"Comment les incidents doivent-ils être gérés selon ITIL 4 ?",
opts:["Chaque incident doit être géré conformément à des cibles convenues, réalistes et documentées","Chaque incident doit être résolu immédiatement, quelle que soit sa complexité","Chaque incident doit avoir sa cause profonde déterminée avant d'être clôturé","Chaque incident doit être résolu en moins du temps cible, sans exception"],
ans:0,why:"Selon ITIL 4, <strong>chaque incident doit être géré conformément à des cibles convenues, réalistes et documentées</strong>. Les cibles sont définies en accord avec le client et doivent être atteignables.",
whynot:["","La résolution immédiate n'est pas toujours possible — des cibles réalistes sont définies.","La cause profonde est identifiée par la gestion des problèmes, pas obligatoirement avant la clôture d'un incident.","Des exceptions peuvent être justifiées — l'important est de respecter les cibles convenues."]},

{tag:"pratiques",q:"Quelle pratique gère les demandes routinières comme la réinitialisation d'un mot de passe ?",
opts:["La gestion des demandes de service, car c'est une demande prédéfinie faisant partie normale de la prestation","La gestion des incidents, car l'incapacité à se connecter constitue une interruption de service","L'activation du changement, car la réinitialisation modifie une configuration du système","La gestion des problèmes, car des réinitialisations répétées peuvent indiquer une cause profonde"],
ans:0,why:"La <strong>gestion des demandes de service</strong> traite les demandes prédéfinies initiées par les utilisateurs qui font partie normale de la prestation — faible risque, processus connu et approuvé.",
whynot:["","Un mot de passe oublié est une situation prédéfinie normale, pas une interruption non planifiée.","L'activation du changement s'applique aux changements pouvant impacter les services, pas aux demandes routinières.","La gestion des problèmes analyse les causes d'incidents, pas les demandes routinières."]},

{tag:"pratiques",q:"Les demandes de service doivent-elles être automatisées selon ITIL 4 ?",
opts:["Oui, dans la mesure du possible, les demandes de service doivent être automatisées au maximum","Non, chaque demande étant unique, l'automatisation n'est pas recommandée","Oui, toutes les demandes de service doivent être entièrement automatisées sans exception","Seulement si elles déclenchent d'autres processus comme l'activation du changement"],
ans:0,why:"Selon ITIL 4, les demandes de service <strong>doivent être automatisées dans la mesure du possible</strong>. L'automatisation réduit les délais et améliore la satisfaction des utilisateurs pour ces demandes répétitives et prévisibles.",
whynot:["","L'automatisation est au contraire fortement recommandée pour les demandes de service standardisées.","Toutes les automatiser sans exception peut ne pas être possible.","L'automatisation n'est pas conditionnée au déclenchement d'autres processus."]},

{tag:"pratiques",q:"Quel est l'objectif de la pratique d'activation du changement ?",
opts:["Maximiser le nombre de changements réussis en s'assurant que les risques sont évalués, les changements autorisés et le planning géré","Déployer rapidement tous les changements demandés par les utilisateurs","Éliminer complètement tous les risques associés aux changements IT","Automatiser intégralement le déploiement des changements en production"],
ans:0,why:"L'<strong>activation du changement</strong> vise à <strong>maximiser le nombre de changements réussis</strong> en évaluant correctement les risques, en autorisant les changements et en gérant le planning pour éviter les conflits.",
whynot:["","Déployer rapidement sans évaluation des risques est contraire à l'objectif.","Éliminer tous les risques est impossible — l'objectif est de les évaluer et les gérer.","L'automatisation peut aider, mais n'est pas l'objectif principal de la pratique."]},

{tag:"pratiques",q:"Quelle pratique a un objectif qui inclut de s'assurer que les risques ont été correctement évalués ?",
opts:["L'activation du changement (Change enablement)","La gestion de la configuration des services","La gestion des problèmes","La gestion des niveaux de service"],
ans:0,why:"L'<strong>activation du changement</strong> vise à maximiser le nombre de changements réussis en s'assurant que les <strong>risques ont été correctement évalués</strong>, que les changements sont autorisés et que le planning est géré.",
whynot:["","La gestion de la configuration maintient la CMDB — l'évaluation des risques de changement n'est pas son objectif principal.","La gestion des problèmes identifie les causes d'incidents — pas l'évaluation des risques de changement.","La gestion des niveaux de service fixe des objectifs de performance."]},

{tag:"pratiques",q:"Quels sont les trois types de changements dans ITIL 4 ?",
opts:["Standard, normal et d'urgence","Urgent, planifié et non planifié","Mineur, majeur et critique","Approuvé, en attente et refusé"],
ans:0,why:"Les 3 types de changements : <strong>Standard</strong> (pré-autorisé, faible risque, bien documenté) — <strong>Normal</strong> (doit être évalué, autorisé et planifié) — <strong>Urgence</strong> (implémenté aussi vite que possible, processus accéléré).",
whynot:["","Urgent/planifié/non planifié ne sont pas les catégories officielles ITIL 4.","Mineur/majeur/critique sont des niveaux de priorité ou d'impact, pas des types de changements.","Approuvé/en attente/refusé sont des états d'un changement, pas des types."]},

{tag:"pratiques",q:"Qu'est-ce qu'un changement standard ?",
opts:["Un changement pré-autorisé, à faible risque, bien documenté, pouvant être implémenté sans autorisation supplémentaire","Un changement qui doit être évalué, autorisé et planifié par une autorité de changement","Un changement qui doit être implémenté aussi vite que possible pour résoudre une urgence","Un changement planifié sur plusieurs semaines avec des phases de test obligatoires"],
ans:0,why:"Un changement <strong>standard</strong> est à faible risque, entièrement documenté et <strong>pré-autorisé</strong>. Il peut être implémenté sans autorisation supplémentaire à chaque occurrence. Ex : ajout d'une imprimante réseau, création d'un compte utilisateur.",
whynot:["","Un changement qui doit être évalué et autorisé est un changement normal.","Un changement à implémenter en urgence est un changement d'urgence.","Une planification sur plusieurs semaines décrit plutôt un changement normal complexe."]},

{tag:"pratiques",q:"Quand procède-t-on à l'évaluation des risques d'un changement standard ?",
opts:["Lorsque la procédure pour le changement standard est créée ou modifiée","Chaque fois que le changement standard est mis en œuvre","Au moins une fois par an lors de la revue annuelle","Lorsqu'un changement d'urgence est demandé en parallèle"],
ans:0,why:"Pour un changement standard, l'évaluation des risques est réalisée <strong>lorsque la procédure est créée ou modifiée</strong>. Elle n'est pas répétée à chaque implémentation — c'est ce qui le rend pré-autorisé.",
whynot:["","Un changement standard est pré-autorisé précisément pour éviter une évaluation à chaque occurrence.","Il n'y a pas de règle imposant une revue annuelle.","Un changement d'urgence est un processus distinct."]},

{tag:"pratiques",q:"Quelle affirmation sur les changements d'urgence est CORRECTE ?",
opts:["L'évaluation et l'autorisation sont accélérées pour permettre une mise en œuvre rapide","Le test peut être totalement éliminé pour mettre en œuvre le changement plus rapidement","Les changements d'urgence doivent être autorisés comme des demandes de service","Les changements d'urgence doivent être entièrement documentés avant toute autorisation"],
ans:0,why:"Pour les changements d'urgence, le processus d'<strong>évaluation et d'autorisation est accéléré</strong>. ITIL 4 précise que les tests doivent être maintenus autant que possible — pas éliminés.",
whynot:["","Les tests ne doivent pas être complètement éliminés — ITIL 4 recommande de les maintenir autant que possible.","Les changements d'urgence passent par l'activation du changement, pas les demandes de service.","Attendre une documentation complète irait à l'encontre du caractère urgent."]},

{tag:"pratiques",q:"Quelle est l'utilisation PRINCIPALE d'un calendrier des changements ?",
opts:["Planifier les changements et éviter les conflits entre eux","Soutenir la gestion des incidents et la planification d'améliorations","Gérer spécifiquement les changements urgents","Gérer uniquement les changements standard"],
ans:0,why:"L'utilisation principale du <strong>calendrier des changements</strong> est de <strong>planifier les changements et éviter les conflits</strong> entre eux, tout en facilitant la communication et l'affectation des ressources.",
whynot:["","C'est un usage secondaire du calendrier, pas son utilisation principale.","Les changements urgents ne sont généralement pas inclus dans le calendrier car leur processus est accéléré.","Les changements standard sont pré-autorisés et n'ont généralement pas besoin du calendrier."]},

{tag:"pratiques",q:"Quelle pratique maintient des informations exactes sur la configuration des services dans une CMDB ?",
opts:["La gestion de la configuration des services","La gestion des actifs IT","La gestion des événements","La gestion des mises en production"],
ans:0,why:"La <strong>gestion de la configuration des services</strong> garantit la disponibilité d'informations exactes et fiables sur les services et leurs CI dans une CMDB (Configuration Management Database).",
whynot:["","La gestion des actifs IT gère le cycle de vie et la valeur financière des actifs, pas les relations entre CI dans une CMDB.","La gestion des événements surveille les changements d'état en temps réel.","La gestion des mises en production coordonne la disponibilité des services."]},

{tag:"pratiques",q:"Quelle pratique surveille les services pour détecter les changements d'état significatifs ?",
opts:["La gestion des événements","La gestion des incidents","La gestion des problèmes","La gestion de la configuration des services"],
ans:0,why:"La <strong>gestion des événements</strong> surveille systématiquement tous les services et CI. Tout changement d'état significatif est classé : <strong>informatif</strong>, <strong>avertissement</strong> ou <strong>exception</strong> nécessitant une action.",
whynot:["","La gestion des incidents réagit après la signalisation, la gestion des événements est proactive.","La gestion des problèmes analyse les causes, pas les événements en temps réel.","La gestion de la configuration maintient la CMDB, pas la surveillance en temps réel."]},

{tag:"pratiques",q:"Quel est le but de la gestion des niveaux de service (SLM) ?",
opts:["Fixer des objectifs de performance basés sur le métier et s'assurer que la livraison est évaluée et gérée en conséquence","Maximiser la disponibilité technique des systèmes au-delà des exigences contractuelles","Gérer la résolution des incidents dans les délais techniques les plus courts possibles","Mesurer la satisfaction des équipes IT internes et ajuster leurs conditions de travail"],
ans:0,why:"La <strong>gestion des niveaux de service</strong> fixe des objectifs clairs basés sur le métier (SLA) et s'assure que la livraison est correctement évaluée, surveillée et gérée. Les métriques doivent refléter l'expérience réelle du client.",
whynot:["","Maximiser la disponibilité au-delà des exigences peut être inutilement coûteux.","La résolution rapide des incidents relève de la gestion des incidents.","La satisfaction des équipes IT n'est pas l'objectif de la SLM."]},

{tag:"pratiques",q:"Quelle pratique identifie les métriques reflétant l'expérience du client pour un service ?",
opts:["La gestion des niveaux de service","L'amélioration continue","Le centre de services","La gestion des problèmes"],
ans:0,why:"La <strong>gestion des niveaux de service</strong> identifie des métriques et des mesures qui reflètent fidèlement l'expérience réelle du client. ITIL 4 insiste sur l'importance de métriques basées sur la perception client.",
whynot:["","L'amélioration continue identifie des opportunités d'amélioration, pas des métriques d'expérience client.","Le centre de services est le point de contact, pas l'entité qui identifie les métriques.","La gestion des problèmes analyse les causes d'incidents, pas les métriques d'expérience client."]},

{tag:"pratiques",q:"Quelle pratique gère la confidentialité, l'intégrité et la disponibilité (CIA) des informations ?",
opts:["La gestion de la sécurité de l'information","La gestion des risques","La gestion de la conformité","La gestion de la continuité des services IT"],
ans:0,why:"La <strong>gestion de la sécurité de l'information</strong> protège les informations en gérant les risques liés à la <strong>C</strong>onfidentialité, l'<strong>I</strong>ntégrité et la <strong>D</strong>isponibilité (CIA), ainsi que l'authentification et la non-répudiation.",
whynot:["","La gestion des risques est plus large — la sécurité de l'information est une pratique dédiée à la CIA.","La conformité est une pratique distincte axée sur les exigences légales.","La continuité IT (ITSCM) cible la reprise après sinistre, pas la CIA au sens large."]},

{tag:"pratiques",q:"Le but de la pratique de gestion de la sécurité de l'information est de [?] les informations de l'organisation.",
opts:["protéger","stocker","fournir","vérifier"],
ans:0,why:"L'objectif de la pratique est de <strong>protéger</strong> les informations nécessaires à l'organisation pour conduire ses activités, en gérant les risques liés à la confidentialité, l'intégrité et la disponibilité.",
whynot:["","Stocker les informations n'est pas l'objectif principal — la protection est le but.","Fournir les informations n'est pas l'objectif — les protéger l'est.","Vérifier (authentification) n'est qu'un aspect parmi d'autres — pas l'objectif global."]},

{tag:"pratiques",q:"Quelle pratique garantit la continuité des services après une perturbation majeure ?",
opts:["La gestion de la continuité des services IT (ITSCM)","La gestion de la disponibilité","La gestion des incidents majeurs","La gestion des risques"],
ans:0,why:"La <strong>gestion de la continuité des services IT (ITSCM)</strong> garantit que les services IT peuvent être rétablis dans des délais définis après une perturbation majeure, en alignement avec les exigences de continuité métier.",
whynot:["","La gestion de la disponibilité optimise la disponibilité normale — pas la reprise après sinistre.","La gestion des incidents traite les interruptions quotidiennes, pas les plans de continuité.","La gestion des risques identifie les risques — pas la reprise après sinistre."]},

{tag:"pratiques",q:"Quelles sont les 7 étapes du modèle d'amélioration continue ?",
opts:["Quelle est la vision ? / Où en sommes-nous ? / Où voulons-nous être ? / Comment y arriver ? / Prendre des mesures / Avons-nous atteint l'objectif ? / Comment maintenir l'élan ?","Identifier, Analyser, Concevoir, Tester, Déployer, Évaluer et Clôturer","Planifier, Exécuter, Vérifier, Agir (PDCA) répété jusqu'à atteindre l'objectif","Initier, Diagnostiquer, Établir, Agir, Implémenter, Contrôler et Clôturer"],
ans:0,why:"Le modèle d'amélioration continue comporte 7 étapes : <strong>1. Quelle est la vision ? — 2. Où en sommes-nous ? — 3. Où voulons-nous être ? — 4. Comment y arriver ? — 5. Prendre des mesures — 6. Avons-nous atteint l'objectif ? — 7. Comment maintenir l'élan ?</strong>",
whynot:["","Ce ne sont pas les 7 étapes officielles.","Le cycle PDCA est un outil qui peut être utilisé, mais ne représente pas les 7 étapes.","Ce n'est pas le modèle d'amélioration continue ITIL 4."]},

{tag:"pratiques",q:"Quelle est une recommandation de la pratique d'amélioration continue ?",
opts:["Il devrait y avoir au moins une petite équipe dédiée à plein temps à l'amélioration continue","Toutes les améliorations doivent être gérées comme des projets à phases multiples","L'amélioration continue doit être isolée des autres pratiques","Les fournisseurs externes doivent être exclus des initiatives d'amélioration"],
ans:0,why:"Bien que tout le monde doive contribuer, ITIL 4 recommande qu'<strong>au moins une petite équipe soit dédiée à plein temps</strong> pour mener les efforts d'amélioration continue et promouvoir la pratique dans toute l'organisation.",
whynot:["","Différents types d'améliorations peuvent appeler différentes méthodes.","L'amélioration continue est au contraire intégrée à toutes les autres pratiques.","Les fournisseurs externes font partie de l'écosystème et doivent aussi contribuer."]},

{tag:"pratiques",q:"Quelle pratique relève de la responsabilité de chacun au sein de l'organisation ?",
opts:["L'amélioration continue","La gestion des niveaux de service","L'activation du changement","La gestion des problèmes"],
ans:0,why:"<strong>L'amélioration continue est la responsabilité de tous</strong> dans l'organisation. L'engagement envers cette pratique doit être ancré dans chaque aspect de l'organisation, à tous les niveaux.",
whynot:["","La gestion des niveaux de service est gérée par des rôles spécifiques.","L'activation du changement implique des rôles spécifiques (change authority, etc.).","La gestion des problèmes s'appuie principalement sur l'expérience de certains membres."]},

{tag:"pratiques",q:"Quel est l'objectif du service desk selon ITIL 4 ?",
opts:["Capturer la demande de résolution d'incidents et de demandes de service et servir de point d'entrée unique pour tous les utilisateurs","Résoudre uniquement les incidents techniques complexes de niveau 2 et 3","Gérer les relations stratégiques entre le prestataire IT et les directions métier","Superviser la performance de l'ensemble des pratiques ITIL de l'organisation"],
ans:0,why:"Le <strong>service desk</strong> capte la demande de résolution d'incidents et de demandes de service. Il est le <strong>point d'entrée et de contact unique</strong> du prestataire avec tous ses utilisateurs, quel que soit le canal.",
whynot:["","Le service desk traite tous les niveaux — pas uniquement les incidents complexes.","Les relations stratégiques relèvent de la gestion des relations.","Superviser les pratiques ITIL est un rôle managérial."]},

{tag:"pratiques",q:"Quelle pratique inclut la classification et la propriété des questions et demandes des utilisateurs ?",
opts:["Le centre de services (service desk)","La gestion des incidents","L'activation du changement","La gestion des niveaux de service"],
ans:0,why:"Le <strong>centre de services (service desk)</strong> fournit un chemin clair pour que les utilisateurs signalent des problèmes, des requêtes et des demandes, qui sont ensuite <strong>reconnues, classifiées, attribuées et traitées</strong>.",
whynot:["","La gestion des incidents traite uniquement les interruptions non planifiées.","L'activation du changement concerne uniquement les demandes de changement.","La gestion des niveaux de service fixe des objectifs de performance."]},

{tag:"pratiques",q:"Quelle structure le service desk peut-il adopter selon ITIL 4 ?",
opts:["Centralisé, virtuel ou distribué géographiquement — l'essentiel est sa compréhension de l'organisation","Uniquement centralisé dans un seul lieu pour garantir la cohérence du service","Obligatoirement externalisé pour réduire les coûts opérationnels","Uniquement composé de techniciens hautement spécialisés dans les technologies utilisées"],
ans:0,why:"ITIL 4 reconnaît plusieurs modèles valides : centralisé, virtuel, distribué (follow-the-sun). L'essentiel est que le service desk comprenne <strong>l'organisation dans son ensemble</strong> et fasse preuve d'empathie.",
whynot:["","ITIL 4 décrit explicitement que le service desk peut être virtuel ou distribué.","L'externalisation peut être une option, mais ITIL 4 ne la recommande pas systématiquement.","Un service desk n'a pas besoin d'être hautement technique — ITIL 4 le précise."]},

{tag:"pratiques",q:"Quelle pratique est responsable du déplacement des composants vers les environnements de production ?",
opts:["La gestion du déploiement","L'activation du changement","La gestion des mises en production","La gestion des actifs IT"],
ans:0,why:"La <strong>gestion du déploiement</strong> déplace les composants nouveaux ou modifiés (matériel, logiciel, documentation, processus) vers les environnements de production. Elle peut aussi déployer vers des environnements de test ou staging.",
whynot:["","L'activation du changement autorise et planifie — c'est la gestion du déploiement qui exécute le mouvement.","La gestion des mises en production rend les services disponibles — une étape ultérieure.","La gestion des actifs IT gère la valeur et le cycle de vie, pas le déploiement."]},

{tag:"pratiques",q:"Quelle pratique rend les nouveaux services et fonctionnalités disponibles à l'utilisation ?",
opts:["La gestion des mises en production","La gestion du déploiement","L'activation du changement","La gestion des demandes de service"],
ans:0,why:"La <strong>gestion des mises en production (release management)</strong> rend les nouveaux services et fonctionnalités modifiés disponibles à l'utilisation pour les consommateurs.",
whynot:["","La gestion du déploiement déplace les composants — une étape technique antérieure à la mise en production.","L'activation du changement autorise les changements, elle ne les rend pas disponibles aux utilisateurs.","La gestion des demandes de service traite des demandes individuelles, pas la mise à disposition d'un service."]},

{tag:"pratiques",q:"Quelle pratique planifie et gère le cycle de vie complet de tous les actifs IT ?",
opts:["La gestion des actifs IT","La gestion de la configuration des services","La gestion des mises en production","La gestion financière des services IT"],
ans:0,why:"La <strong>gestion des actifs IT</strong> planifie et gère le cycle de vie complet de tous les actifs (de l'acquisition à la mise hors service), pour maximiser la valeur, contrôler les coûts et maintenir la conformité.",
whynot:["","La gestion de la configuration maintient la CMDB — distincte de la gestion du cycle de vie des actifs.","La gestion des mises en production coordonne la disponibilité, pas le cycle de vie des actifs.","La gestion financière contrôle les budgets, pas le cycle de vie des actifs."]},

{tag:"pratiques",q:"Quelle pratique analyse les données d'incidents pour identifier des tendances ?",
opts:["La gestion des problèmes","La gestion des niveaux de service","La gestion des changements","La gestion des événements"],
ans:0,why:"La <strong>gestion des problèmes</strong> analyse les données d'incidents pour identifier des tendances et des causes potentielles, dans le but de prévenir la récurrence des incidents.",
whynot:["","La gestion des niveaux de service surveille les SLA, pas les tendances d'incidents.","La gestion des changements évalue les risques de modification, pas les tendances d'incidents.","La gestion des événements surveille les changements d'état en temps réel."]},

{tag:"pratiques",q:"La gestion des problèmes contribue à 'Fournir et Soutenir' de la chaîne de valeur en :",
opts:["Prévenant la répétition des incidents et soutenant la résolution rapide des incidents en cours","Résolvant directement tous les incidents dès leur signalement","Empêchant la totalité des incidents, rendant ainsi la gestion des incidents inutile","Remplaçant la gestion des incidents pour les incidents complexes"],
ans:0,why:"La gestion des problèmes contribue à 'Fournir et Soutenir' en <strong>prévenant la répétition des incidents</strong> (via la résolution des causes profondes) et en <strong>soutenant la résolution rapide</strong> des incidents (via les workarounds documentés).",
whynot:["","La gestion des problèmes n'a pas pour rôle de résoudre directement les incidents.","ITIL 4 ne prétend pas qu'on peut empêcher tous les incidents.","La gestion des problèmes complète la gestion des incidents, elle ne la remplace pas."]},

{tag:"pratiques",q:"Quel est un bénéfice potentiel d'un outil ITSM pour la gestion des incidents ?",
opts:["Un appariement automatisé des incidents avec d'autres incidents, problèmes ou erreurs connues","La garantie que la cause des incidents est identifiée dans les délais convenus","La garantie que les contrats fournisseurs sont alignés sur les besoins du prestataire","La résolution et clôture automatisées d'incidents complexes"],
ans:0,why:"Les outils ITSM modernes peuvent fournir un <strong>appariement automatisé des incidents</strong> avec d'autres incidents, problèmes ou erreurs connues — ce qui accélère le diagnostic et la résolution.",
whynot:["","Identifier la cause dans les délais dépend des équipes, pas uniquement de l'outil.","L'alignement des contrats fournisseurs relève de la gestion des fournisseurs.","La résolution d'incidents complexes nécessite toujours une expertise humaine selon ITIL 4."]},

{tag:"pratiques",q:"Quelle pratique établit et entretient les liens entre l'organisation et ses parties prenantes ?",
opts:["La gestion des relations","La gestion des fournisseurs","La gestion des niveaux de service","Le centre de services"],
ans:0,why:"La <strong>gestion des relations</strong> établit et entretient les liens entre l'organisation et ses parties prenantes aux niveaux stratégique et tactique, pour identifier et satisfaire leurs besoins.",
whynot:["","La gestion des fournisseurs gère spécifiquement les relations avec les fournisseurs externes.","La gestion des niveaux de service fixe des objectifs de performance.","Le centre de services est le point de contact opérationnel quotidien."]},

{tag:"pratiques",q:"Comment les fournisseurs tiers doivent-ils être inclus dans l'amélioration continue ?",
opts:["Les détails de leur approche d'amélioration de service doivent être inclus dans les contrats","Ils doivent être exclus des initiatives d'amélioration pour préserver la confidentialité","Ils doivent uniquement être impliqués si un incident majeur est causé par leur service","Leur inclusion est optionnelle et dépend de la bonne volonté du fournisseur"],
ans:0,why:"Selon ITIL 4, <strong>les fournisseurs tiers font partie de l'écosystème de services</strong>. Leur approche d'amélioration doit être formalisée dans les contrats pour garantir leur contribution à l'amélioration continue.",
whynot:["","Les fournisseurs doivent être inclus, pas exclus — ils font partie du paysage de services.","Attendre un incident majeur pour impliquer les fournisseurs est une approche réactive insuffisante.","L'inclusion des fournisseurs doit être contractuellement garantie, pas optionnelle."]},

{tag:"pratiques",q:"Quelle pratique s'assure que les informations de configuration des CI et leurs relations sont exactes ?",
opts:["La gestion de la configuration des services","La gestion des actifs IT","La gestion des événements","La gestion des mises en production"],
ans:0,why:"La <strong>gestion de la configuration des services</strong> s'assure que des informations exactes et fiables sont disponibles sur la configuration des services et les CI qui les soutiennent, quand et où elles sont nécessaires.",
whynot:["","La gestion des actifs IT gère le cycle de vie des actifs, pas les relations entre CI dans une CMDB.","La gestion des événements surveille les changements d'état.","La gestion des mises en production coordonne la disponibilité des nouvelles versions."]},

   SCÉNARIOS PRATIQUES  (12 questions)

{tag:"scenarios",q:"Le serveur de messagerie est inaccessible pour 200 utilisateurs depuis 30 minutes. Quelle pratique est activée en PREMIER ?",
opts:["La gestion des incidents, pour rétablir l'accès à la messagerie aussi rapidement que possible","La gestion des problèmes, pour identifier immédiatement la cause profonde","L'activation du changement, pour appliquer rapidement un correctif","La gestion des événements, pour analyser les logs du serveur"],
ans:0,why:"Une interruption non planifiée est un <strong>incident</strong>. La priorité absolue est le <strong>rétablissement rapide du service</strong>. La gestion des problèmes interviendra ensuite pour identifier et éliminer la cause profonde.",
whynot:["","Identifier la cause profonde vient après le rétablissement — c'est la gestion des problèmes.","Appliquer un correctif peut faire partie de la résolution, mais la pratique activée en premier est la gestion des incidents.","Analyser les logs est une activité d'investigation, pas la première priorité."]},

{tag:"scenarios",q:"Après plusieurs incidents de lenteur réseau, l'équipe analyse leur cause commune. Quelle pratique est engagée ?",
opts:["La gestion des problèmes, pour identifier et traiter la cause profonde","La gestion des incidents, pour créer un incident majeur regroupant tous les incidents","La gestion des demandes de service, pour traiter les plaintes des utilisateurs","L'activation du changement, pour planifier une mise à jour de l'infrastructure"],
ans:0,why:"L'analyse des causes profondes d'incidents récurrents est une activité clé de la <strong>gestion des problèmes</strong>. L'objectif est de réduire la probabilité et l'impact futurs.",
whynot:["","Regrouper des incidents ne constitue pas en soi un incident majeur.","Les demandes de service traitent les demandes prédéfinies, pas les investigations.","Un changement peut résulter de l'investigation, mais c'est la gestion des problèmes qui analyse."]},

{tag:"scenarios",q:"Un utilisateur demande l'installation d'Adobe Acrobat sur son poste. Quelle pratique traite cela ?",
opts:["La gestion des demandes de service — c'est une demande prédéfinie faisant partie normale de la prestation","La gestion des incidents — l'absence du logiciel constitue une interruption de productivité","L'activation du changement — l'installation modifie la configuration du poste","La gestion des actifs IT — l'installation impacte les licences logicielles"],
ans:0,why:"L'installation d'un logiciel standard est une <strong>demande de service</strong> — prédéfinie, faisant partie normale de la prestation, avec un processus approuvé et documenté.",
whynot:["","L'absence d'un logiciel n'est pas un incident — c'est une demande de service.","L'activation du changement s'applique aux changements pouvant impacter les services, pas aux demandes routinières.","La gestion des actifs peut enregistrer la licence, mais la pratique qui traite la demande est la gestion des demandes."]},

{tag:"scenarios",q:"Un patch de sécurité critique doit être déployé en urgence ce soir. Quel type de changement s'applique ?",
opts:["Un changement d'urgence — il doit être implémenté aussi rapidement que possible","Un changement standard — les patches sont des procédures documentées et pré-autorisées","Un changement normal — tout patch doit être évalué et planifié normalement","Aucun changement formel n'est requis pour les patches de sécurité critiques"],
ans:0,why:"Un patch critique nécessitant une application rapide est un <strong>changement d'urgence</strong>. Le processus est accéléré mais ITIL 4 précise que les tests doivent être maintenus autant que possible.",
whynot:["","Un changement standard est pré-autorisé pour des procédures à faible risque connues.","Un changement normal suit le processus standard qui peut être trop lent pour un patch critique urgent.","Tout changement en production doit suivre un processus d'autorisation selon ITIL 4."]},

{tag:"scenarios",q:"Suite à un incident majeur de 4 heures, le management demande une revue pour éviter la récurrence. Quelle activité est engagée ?",
opts:["Une revue post-incident (PIR/RCA) dans le cadre de la gestion des problèmes","Un audit de conformité ITIL par un organisme de certification externe","Une revue des niveaux de service avec le client pour négocier des compensations","Une mise à jour du catalogue de services pour documenter la perturbation"],
ans:0,why:"Une revue post-incident est une activité clé de la <strong>gestion des problèmes</strong>. Elle analyse les causes profondes (RCA), évalue la réponse et identifie des améliorations pour éviter la récurrence.",
whynot:["","Un audit de conformité ITIL est un processus distinct.","Une revue SLA concerne les niveaux de service, pas l'analyse de cause profonde.","Le catalogue de services n'est pas l'outil pour analyser les incidents majeurs."]},

{tag:"scenarios",q:"Un technicien applique un workaround documenté pour rétablir l'accès d'un utilisateur à son CRM. Quelle pratique ?",
opts:["La gestion des incidents — il rétablit la capacité de travail de l'utilisateur","La gestion des problèmes — il utilise une erreur connue documentée","La gestion des demandes de service — l'utilisateur a contacté le service desk","La gestion de la configuration — l'accès au CRM implique des CI"],
ans:0,why:"Rétablir la capacité de travail d'un utilisateur est une activité de <strong>gestion des incidents</strong>. Le workaround vient des erreurs connues (gestion des problèmes), mais l'acte de résoudre l'incident appartient à la gestion des incidents.",
whynot:["","La gestion des problèmes a créé l'erreur connue documentée, mais l'acte de résolution de l'incident lui appartient à la gestion des incidents.","Contacter le service desk est le canal, pas la pratique.","La gestion de la configuration maintient la CMDB — elle n'intervient pas dans la résolution d'incidents."]},

{tag:"scenarios",q:"Un nouveau collaborateur a besoin d'un poste configuré, d'accès aux systèmes et d'un badge. Quelle pratique coordonne cela ?",
opts:["La gestion des demandes de service — ce sont des demandes prédéfinies normales du processus d'onboarding","La gestion des incidents — l'absence d'accès constitue une interruption","L'activation du changement — l'attribution de droits modifie les configurations","La gestion des actifs IT — l'attribution d'équipements implique des actifs physiques"],
ans:0,why:"L'onboarding est un ensemble de <strong>demandes de service</strong> prédéfinies (création de compte, matériel, droits d'accès). La <strong>gestion des demandes de service</strong> coordonne via le catalogue et des flux de travail définis.",
whynot:["","L'absence d'accès pour un nouveau collaborateur est attendue et planifiée — pas un incident.","L'attribution de droits peut impliquer des configurations, mais le processus global est une demande de service.","La gestion des actifs enregistre les attributions, mais ne coordonne pas l'ensemble de l'onboarding."]},

{tag:"scenarios",q:"Un serveur atteint régulièrement 95% de CPU le matin sans qu'aucun incident n'ait été déclaré. Quelle démarche ?",
opts:["Identifier cela comme un problème potentiel et l'analyser proactivement via la gestion des problèmes","Attendre qu'un incident se produise pour intervenir — ITIL 4 est réactif","Créer un ticket d'incident immédiatement même sans interruption constatée","Soumettre directement une demande de changement pour augmenter la capacité"],
ans:0,why:"La <strong>gestion des problèmes</strong> inclut une activité <strong>proactive</strong> : identifier et traiter les problèmes potentiels avant qu'ils causent des incidents. Ce pic CPU récurrent est un problème potentiel à investiguer.",
whynot:["","ITIL 4 encourage la gestion proactive des problèmes — attendre un incident est purement réactif.","Un pic CPU sans interruption n'est pas un incident — c'est un problème potentiel.","Un changement sans analyse préalable est risqué."]},

/* ─────────────────────────────────────────────────────
   CONFIG
   ───────────────────────────────────────────────────── */
const N_SESSION  = 40;
const PAGE_SIZE  = 8;
const PASS_SCORE = 65;

const TAG_CLASS = {pratiques:'tp',concepts:'tc',principes:'tr',dimensions:'td',svs:'ts',scenarios:'tn'};
const TAG_LABEL = {pratiques:'Pratiques',concepts:'Concepts',principes:'Principes',dimensions:'Dimensions',svs:'SVS',scenarios:'Scénario'};
const LETTERS   = ['A','B','C','D'];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* Tirage équilibré garantissant exactement N questions */
function balancedDraw(bank,n){
  const byTag={};
  bank.forEach((q,i)=>{(byTag[q.tag]=byTag[q.tag]||[]).push(i);});
  const tags=Object.keys(byTag);
  const base=Math.floor(n/tags.length);
  let extra=n-base*tags.length;
  let pool=[];
  tags.forEach(t=>{
    const s=shuffle([...byTag[t]]);
    const take=base+(extra-->0?1:0);
    pool.push(...s.slice(0,Math.min(take,s.length)));
  });
  if(pool.length<n){
    const poolSet=new Set(pool);
    const rem=shuffle(bank.map((_,i)=>i).filter(i=>!poolSet.has(i)));
    pool.push(...rem.slice(0,n-pool.length));
  }
  return shuffle(pool).slice(0,n);
}

/* Mélange les options d'une question */
function shuffleOpts(q){
  const order=shuffle([0,1,2,3]);
  return{
    opts:order.map(i=>q.opts[i]),
    ans:order.indexOf(q.ans),
    whynot:q.whynot?order.map(i=>q.whynot[i]||''):['','','','']
  };
}

let session=[];
let answers=[];
let page=0;
let filter='all';

function buildSession(indices){
  session=indices.map(qi=>({qi,...shuffleOpts(BANK[qi])}));
  answers=new Array(session.length).fill(null);
}

function save(){try{localStorage.setItem('itil4_v3',JSON.stringify({session,answers,page,filter}));}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('itil4_v3'));
    if(d&&d.session&&d.answers&&d.session.length===d.answers.length){
      session=d.session;answers=d.answers;page=d.page||0;filter=d.filter||'all';return true;
    }
  }catch(e){}
  return false;
}

document.getElementById('bank-btn').textContent=BANK.length+' questions en banque';

function filteredPos(){
  const all=session.map((_,p)=>p);
  if(filter==='all')return all;
  if(filter==='unanswered')return all.filter(p=>answers[p]===null);
  if(filter==='correct')return all.filter(p=>answers[p]!==null&&answers[p]===session[p].ans);
  if(filter==='wrong')return all.filter(p=>answers[p]!==null&&answers[p]!==session[p].ans);
  return all;
}

function updateScore(){
  const total=session.length;
  const answered=answers.filter(a=>a!==null).length;
  const correct=answers.filter((a,p)=>a!==null&&a===session[p].ans).length;
  const pct=answered>0?Math.round(correct/answered*100):null;
  document.getElementById('s-done').textContent=answered+'/'+total;
  document.getElementById('s-ok').textContent=correct;
  document.getElementById('s-ko').textContent=answered-correct;
  document.getElementById('s-pct').textContent=pct!==null?pct+'%':'—';
  document.getElementById('prog').style.width=Math.round(answered/total*100)+'%';
}

function renderPagination(positions){
  const total=Math.ceil(positions.length/PAGE_SIZE);
  const el=document.getElementById('pagination');
  el.innerHTML='';
  if(total<=1)return;
  const prev=document.createElement('button');
  prev.className='pg nav';prev.textContent='←';prev.disabled=page===0;
  prev.onclick=()=>{if(page>0){page--;renderQuiz();window.scrollTo(0,0);}};
  el.appendChild(prev);
  for(let i=0;i<total;i++){
    const b=document.createElement('button');
    b.className='pg'+(i===page?' active':'');b.textContent=i+1;
    const pi=i;b.onclick=()=>{page=pi;renderQuiz();window.scrollTo(0,0);};
    el.appendChild(b);
  }
  const next=document.createElement('button');
  next.className='pg nav';next.textContent='→';next.disabled=page>=total-1;
  next.onclick=()=>{if(page<total-1){page++;renderQuiz();window.scrollTo(0,0);}};
  el.appendChild(next);
}

function renderQuiz(){
  const positions=filteredPos();
  const pagePos=positions.slice(page*PAGE_SIZE,page*PAGE_SIZE+PAGE_SIZE);
  const container=document.getElementById('quiz-area');
  container.innerHTML='';
  if(pagePos.length===0){
    container.innerHTML='<div class="empty"><div class="icon">🎯</div>Aucune question ici.<br>Essayez un autre filtre !</div>';
    renderPagination(positions);updateScore();return;
  }
  pagePos.forEach(pos=>{
    const s=session[pos];const q=BANK[s.qi];
    const answered=answers[pos]!==null;
    const correct=answered&&answers[pos]===s.ans;
    const wrong=answered&&!correct;
    const card=document.createElement('div');
    card.className='q-card'+(correct?' ok':wrong?' ko':'');
    card.id='qc-'+pos;
    const optsHTML=s.opts.map((o,oi)=>{
      let cls='opt';
      if(answered){if(oi===s.ans)cls+=' correct';else if(oi===answers[pos])cls+=' wrong';}
      return`<button class="${cls}" ${answered?'disabled':''} onclick="pick(${pos},${oi})"><span class="opt-l">${LETTERS[oi]}</span><span>${o}</span></button>`;
    }).join('');
    let ratHTML='';
    if(answered){
      let wrongNote='';
      if(wrong&&s.whynot&&s.whynot[answers[pos]]){
        wrongNote=`<div class="why-wrong">⚠ Ton choix (${LETTERS[answers[pos]]}) : ${s.whynot[answers[pos]]}</div>`;
      }
      ratHTML=`<div class="rationale ${correct?'ok':'ko'}"><div class="verdict">${correct?'✓ Correct':'✗ Incorrect — bonne réponse : '+LETTERS[s.ans]}</div>${q.why}${wrongNote}</div>`;
    }
    card.innerHTML=`<div class="q-meta"><span class="q-num">Q${String(pos+1).padStart(2,'0')}</span><span class="q-tag ${TAG_CLASS[q.tag]||''}">${TAG_LABEL[q.tag]||q.tag}</span>${answered?`<span class="q-status">${correct?'✓':'✗'}</span>`:''}</div><div class="q-text">${q.q}</div><div class="opts">${optsHTML}</div>${ratHTML}`;
    container.appendChild(card);
  });
  renderPagination(positions);updateScore();
}

function pick(pos,oi){
  if(answers[pos]!==null)return;
  answers[pos]=oi;save();renderQuiz();
  setTimeout(()=>{const c=document.getElementById('qc-'+pos);if(c)c.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}

function finishSession(){
  const total=session.length;
  const answered=answers.filter(a=>a!==null).length;
  const correct=answers.filter((a,p)=>a!==null&&a===session[p].ans).length;
  const pct=answered>0?Math.round(correct/total*100):0;
  const pass=pct>=PASS_SCORE;
  const catStats={};
  session.forEach((s,pos)=>{
    const tag=BANK[s.qi].tag;
    if(!catStats[tag])catStats[tag]={total:0,correct:0};
    catStats[tag].total++;
    if(answers[pos]!==null&&answers[pos]===s.ans)catStats[tag].correct++;
  });
  const wrongItems=session.map((s,pos)=>({s,pos,q:BANK[s.qi],ans:answers[pos]})).filter(x=>x.ans===null||x.ans!==x.s.ans);
  document.getElementById('screen-results-body').innerHTML=`
    <div class="results-hero">
      <div class="results-score ${pass?'pass':'fail'}">${pct}%</div>
      <div class="results-verdict ${pass?'pass':'fail'}">${pass?'✓ REÇU':'✗ AJOURNÉ'}</div>
      <div class="results-sub">Seuil réel ITIL 4 Foundation : ${PASS_SCORE}% · 40 questions · 60 min</div>
    </div>
    <div class="results-grid">
      <div class="r-cell"><div class="rv a">${total}</div><div class="rl">Questions</div></div>
      <div class="r-cell"><div class="rv g">${correct}</div><div class="rl">Correctes</div></div>
      <div class="r-cell"><div class="rv r">${total-correct}</div><div class="rl">Incorrectes</div></div>
    </div>
    <div class="cat-breakdown"><h3>Résultats par catégorie</h3>
    ${Object.entries(catStats).map(([tag,s])=>{
      const p=s.total>0?Math.round(s.correct/s.total*100):0;
      const c=p>=PASS_SCORE?'var(--green)':p>=50?'var(--amber)':'var(--red)';
      return`<div class="cat-row"><span class="cat-name">${TAG_LABEL[tag]||tag}</span><div class="cat-bar-wrap"><div class="cat-bar" style="width:${p}%;background:${c}"></div></div><span class="cat-pct">${p}%</span></div>`;
    }).join('')}</div>
    ${wrongItems.length>0?`<div class="wrong-list"><h3>À retravailler (${wrongItems.length})</h3>
    ${wrongItems.map(({s,pos,q,ans})=>`<div class="wrong-item"><div class="wi-q">Q${pos+1}. ${q.q}</div><div class="wi-correct">✓ Bonne réponse : <strong>${LETTERS[s.ans]}. ${s.opts[s.ans]}</strong></div>${ans!==null?`<div class="wi-your">✗ Ta réponse : ${LETTERS[ans]}. ${s.opts[ans]}</div>`:'<div class="wi-your" style="color:var(--text3)">— Sans réponse</div>'}</div>`).join('')}</div>`:'<div class="empty" style="padding:2rem 0"><div class="icon">🎉</div>Score parfait !</div>'}
    <div class="results-actions">
      <button class="r-btn primary" onclick="reviewSession()">← Revoir les questions</button>
      <button class="r-btn" onclick="newSession()">↺ Nouvelle session (40 questions différentes)</button>
    </div>`;
  showScreen('screen-results');window.scrollTo(0,0);
}

function reviewSession(){
  filter='all';page=0;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.f-btn[data-f="all"]').classList.add('active');
  showScreen('screen-quiz');renderQuiz();window.scrollTo(0,0);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function newSession(){
  if(answers.some(a=>a!==null)){if(!confirm('Nouvelle session avec '+N_SESSION+' questions différentes ?\nTes réponses actuelles seront perdues.'))return;}
  buildSession(balancedDraw(BANK,Math.min(N_SESSION,BANK.length)));
  page=0;filter='all';
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.f-btn[data-f="all"]').classList.add('active');
  showScreen('screen-quiz');save();renderQuiz();window.scrollTo(0,0);
}

function resetAnswers(){
  if(!confirm('Effacer toutes tes réponses ? Les questions restent les mêmes.'))return;
  answers=new Array(session.length).fill(null);page=0;save();renderQuiz();
}

document.getElementById('filters').addEventListener('click',e=>{
  const btn=e.target.closest('.f-btn');if(!btn)return;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');filter=btn.dataset.f;page=0;renderQuiz();
});

function dismissBanner(){
  document.getElementById('install-banner').classList.remove('show');
  try{localStorage.setItem('itil4_banner','1');}catch(e){}
}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone;
if(isIOS&&!isStandalone&&!localStorage.getItem('itil4_banner')){
  document.getElementById('install-banner').classList.add('show');
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

if(!load()){buildSession(balancedDraw(BANK,Math.min(N_SESSION,BANK.length)));}

setTimeout(()=>{
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{document.getElementById('splash').style.display='none';},500);
  renderQuiz();
},1200);
</script>
