/* ─────────────────────────────────────────────────────
   CONFIG
───────────────────────────────────────────────────── */
const N_SESSION  = 40;
const PASS_SCORE = 65;
const TAG_CLASS  = {pratiques:'tp',concepts:'tc',principes:'tr',dimensions:'td',svs:'ts',scenarios:'tn'};
const TAG_LABEL  = {pratiques:'Pratiques',concepts:'Concepts',principes:'Principes',dimensions:'Dimensions',svs:'SVS',scenarios:'Scénario'};
const LETTERS    = ['A','B','C','D'];

/* ─────────────────────────────────────────────────────
   THÈME
───────────────────────────────────────────────────── */
function initTheme(){
  const saved = localStorage.getItem('itil4_theme') || 'dark';
  setTheme(saved);
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('itil4_theme',t);
  const label  = t==='dark' ? '☾ Sombre' : '☀ Clair';
  document.getElementById('theme-label').textContent  = label;
  document.getElementById('theme-label2').textContent = label;
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur==='dark'?'light':'dark');
}
document.getElementById('theme-toggle').addEventListener('click',toggleTheme);
document.getElementById('theme-toggle2').addEventListener('click',toggleTheme);
initTheme();

/* ─────────────────────────────────────────────────────
   UTILITAIRES
───────────────────────────────────────────────────── */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function balancedDraw(bank,n){
  const byTag={};
  bank.forEach((q,i)=>{(byTag[q.tag]=byTag[q.tag]||[]).push(i);});
  const tags=Object.keys(byTag);
  const base=Math.floor(n/tags.length);
  let extra=n-base*tags.length;
  let pool=[];
  tags.forEach(t=>{
    const s=shuffle([...byTag[t]]);
    const take=base+(extra-->0?1:0);
    pool.push(...s.slice(0,Math.min(take,s.length)));
  });
  if(pool.length<n){
    const poolSet=new Set(pool);
    const rem=shuffle(bank.map((_,i)=>i).filter(i=>!poolSet.has(i)));
    pool.push(...rem.slice(0,n-pool.length));
  }
  return shuffle(pool).slice(0,n);
}
function shuffleOpts(q){
  const order=shuffle([0,1,2,3]);
  return{
    opts:order.map(i=>q.opts[i]),
    ans:order.indexOf(q.ans),
    whynot:q.whynot?order.map(i=>q.whynot[i]||''):['','','','']
  };
}

/* ─────────────────────────────────────────────────────
   ÉTAT
───────────────────────────────────────────────────── */
let session=[];
let answers=[];
let currentIdx=0;  // index dans session (mode une-question)

function buildSession(indices){
  session=indices.map(qi=>({qi,...shuffleOpts(BANK[qi])}));
  answers=new Array(session.length).fill(null);
  currentIdx=0;
}

/* ─────────────────────────────────────────────────────
   PERSISTANCE
───────────────────────────────────────────────────── */
function save(){
  try{localStorage.setItem('itil4_v4',JSON.stringify({session,answers,currentIdx}));}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('itil4_v4'));
    if(d&&d.session&&d.answers&&d.session.length===d.answers.length){
      session=d.session;answers=d.answers;
      currentIdx=typeof d.currentIdx==='number'?d.currentIdx:0;
      // recaler sur la première non répondue si on est à la fin mais pas encore finishé
      if(currentIdx>=session.length) currentIdx=session.length-1;
      return true;
    }
  }catch(e){}
  return false;
}

/* ─────────────────────────────────────────────────────
   SCORE
───────────────────────────────────────────────────── */
function computeScore(){
  const answered=answers.filter(a=>a!==null).length;
  const correct=answers.filter((a,p)=>a!==null&&a===session[p].ans).length;
  const pct=answered>0?Math.round(correct/answered*100):null;
  return{answered,correct,total:session.length,pct};
}
function updateScoreUI(){
  const {answered,correct,total,pct}=computeScore();
  document.getElementById('s-done').textContent=answered;
  document.getElementById('s-ok').textContent=correct;
  document.getElementById('s-ko').textContent=answered-correct;
  document.getElementById('s-pct').textContent=pct!==null?pct+'%':'—';
  document.getElementById('q-current').textContent=Math.min(currentIdx+1,total);
  document.getElementById('q-total').textContent=total;
  const progPct=Math.round(answered/total*100);
  document.getElementById('prog-fill').style.width=progPct+'%';
}

/* ─────────────────────────────────────────────────────
   RENDU D'UNE QUESTION
───────────────────────────────────────────────────── */
function renderQuestion(pos){
  const s=session[pos];
  const q=BANK[s.qi];
  const answered=answers[pos]!==null;
  const correct=answered&&answers[pos]===s.ans;
  const wrong=answered&&!correct;

  const area=document.getElementById('quiz-area');
  area.innerHTML='';

  const card=document.createElement('div');
  card.className='q-card';
  card.id='q-card';

  // En-tête
  const meta=document.createElement('div');
  meta.className='q-meta';
  meta.innerHTML=`<span class="q-num">Q${String(pos+1).padStart(2,'0')}</span><span class="q-tag ${TAG_CLASS[q.tag]||''}">${TAG_LABEL[q.tag]||q.tag}</span>`;
  card.appendChild(meta);

  // Texte de la question
  const qt=document.createElement('div');
  qt.className='q-text';
  qt.textContent=q.q;
  card.appendChild(qt);

  // Options
  const opts=document.createElement('div');
  opts.className='opts';
  s.opts.forEach((o,oi)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    if(answered){
      if(oi===s.ans) btn.classList.add('correct');
      else if(oi===answers[pos]) btn.classList.add('wrong');
      else btn.classList.add('neutral');
      btn.disabled=true;
    }
    btn.innerHTML=`<span class="opt-letter">${LETTERS[oi]}</span><span class="opt-text">${o}</span>`;
    if(!answered){
      btn.addEventListener('click',()=>pick(pos,oi));
    }
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  // Feedback
  if(answered){
    const fb=document.createElement('div');
    fb.className='feedback '+(correct?'ok':'ko');

    // Verdict
    const verdict=document.createElement('div');
    verdict.className='feedback-verdict';
    if(correct){
      verdict.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Bonne réponse !`;
    } else {
      verdict.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Mauvaise réponse — Bonne réponse : <strong>${LETTERS[s.ans]}. ${s.opts[s.ans]}</strong>`;
    }
    fb.appendChild(verdict);

    // Explication
    const why=document.createElement('div');
    why.className='feedback-why';
    why.innerHTML=q.why;
    fb.appendChild(why);

    // Pourquoi le mauvais choix
    if(!correct&&s.whynot&&s.whynot[answers[pos]]&&s.whynot[answers[pos]].length>0){
      const wn=document.createElement('div');
      wn.className='feedback-whynot';
      wn.innerHTML=`<strong>Pourquoi ${LETTERS[answers[pos]]} est incorrect :</strong> ${s.whynot[answers[pos]]}`;
      fb.appendChild(wn);
    }

    card.appendChild(fb);
  }

  area.appendChild(card);

  // Bouton suivant
  if(answered){
    const nw=document.createElement('div');
    nw.className='next-wrap';
    const nb=document.createElement('button');
    nb.className='btn-next';
    if(pos<session.length-1){
      nb.innerHTML='Question suivante <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
      nb.addEventListener('click',()=>{
        currentIdx=pos+1;
        save();
        renderQuestion(currentIdx);
        updateScoreUI();
        window.scrollTo({top:0,behavior:'smooth'});
      });
    } else {
      nb.innerHTML='Voir mes résultats <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
      nb.addEventListener('click',()=>showResults());
    }
    nw.appendChild(nb);
    area.appendChild(nw);
  }

  updateScoreUI();
}

/* ─────────────────────────────────────────────────────
   SÉLECTIONNER UNE RÉPONSE
───────────────────────────────────────────────────── */
function pick(pos,oi){
  if(answers[pos]!==null)return;
  answers[pos]=oi;
  save();
  renderQuestion(pos);
  // scroll vers le feedback
  setTimeout(()=>{
    const fb=document.querySelector('.feedback');
    if(fb) fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  },100);
}

/* ─────────────────────────────────────────────────────
   RÉSULTATS
───────────────────────────────────────────────────── */
function showResults(){
  const {answered,correct,total,pct}=computeScore();
  const pass=(pct||0)>=PASS_SCORE;
  const pctDisplay=pct!==null?pct:0;

  const encouragements={
    pass:[
      "Excellent travail ! Vous maîtrisez très bien les concepts ITIL 4 Foundation. 🎉",
      "Félicitations ! Votre préparation porte ses fruits. Continuez ainsi ! 🏆",
      "Très bon résultat ! Vous êtes prêt(e) pour la certification ITIL 4 Foundation. 🎯"
    ],
    fail:[
      "Bon courage ! Revoyez les catégories en rouge et retentez le quiz. Vous pouvez y arriver ! 💪",
      "Ne vous découragez pas ! Chaque erreur est une occasion d'apprendre. Révisez et recommencez ! 📚",
      "Le score de passage est 65%. Focalisez-vous sur les catégories les moins maîtrisées et retentez !"
    ]
  };
  const msgs=pass?encouragements.pass:encouragements.fail;
  const msg=msgs[Math.floor(Math.random()*msgs.length)];

  // Calcul par catégorie
  const catStats={};
  session.forEach((s,pos)=>{
    const tag=BANK[s.qi].tag;
    if(!catStats[tag])catStats[tag]={total:0,correct:0};
    catStats[tag].total++;
    if(answers[pos]!==null&&answers[pos]===s.ans)catStats[tag].correct++;
  });

  // Questions à retravailler
  const wrongItems=session.map((s,pos)=>({s,pos,q:BANK[s.qi],ans:answers[pos]}))
    .filter(x=>x.ans===null||x.ans!==x.s.ans);

  const body=document.getElementById('results-body');
  body.innerHTML=`
    <div class="results-hero">
      <div class="results-pct ${pass?'pass':'fail'}">${pctDisplay}%</div>
      <div class="results-verdict ${pass?'pass':'fail'}">${pass?'✓ REÇU':'✗ AJOURNÉ'}</div>
      <div class="results-threshold">Seuil réel ITIL 4 Foundation : ${PASS_SCORE}% · ${total} questions</div>
      <div class="results-encouragement">${msg}</div>
    </div>

    <div class="results-stats">
      <div class="stat-card"><div class="stat-val ac">${total}</div><div class="stat-lbl">Questions</div></div>
      <div class="stat-card"><div class="stat-val ok">${correct}</div><div class="stat-lbl">Correctes</div></div>
      <div class="stat-card"><div class="stat-val ko">${total-correct}</div><div class="stat-lbl">Incorrectes</div></div>
    </div>

    <div class="cat-card">
      <h3>Résultats par catégorie</h3>
      ${Object.entries(catStats).map(([tag,st])=>{
        const p=st.total>0?Math.round(st.correct/st.total*100):0;
        const color=p>=PASS_SCORE?'var(--green)':p>=50?'var(--amber)':'var(--red)';
        return`<div class="cat-row">
          <span class="cat-name">${TAG_LABEL[tag]||tag}</span>
          <div class="cat-track"><div class="cat-bar" style="width:${p}%;background:${color}"></div></div>
          <span class="cat-pct">${p}%</span>
        </div>`;
      }).join('')}
    </div>

    ${wrongItems.length>0?`
    <div class="wrong-card">
      <h3>À retravailler (${wrongItems.length})</h3>
      ${wrongItems.map(({s,pos,q,ans})=>`
        <div class="wrong-item">
          <div class="wi-q">Q${pos+1}. ${q.q}</div>
          <div class="wi-correct">✓ Bonne réponse : ${LETTERS[s.ans]}. ${s.opts[s.ans]}</div>
          ${ans!==null?`<div class="wi-your">✗ Votre réponse : ${LETTERS[ans]}. ${s.opts[ans]}</div>`:'<div class="wi-your" style="color:var(--text3)">— Sans réponse</div>'}
        </div>`).join('')}
    </div>`:`
    <div class="perfect-badge"><div class="pi">🎉</div><p>Score parfait ! Toutes les réponses sont correctes.</p></div>`}

    <div class="results-actions">
      <button class="btn" onclick="reviewQuiz()">← Revoir les questions</button>
      <button class="btn btn-accent" onclick="newSession()">↺ Nouvelle session</button>
    </div>
  `;

  showScreen('screen-results');
  window.scrollTo(0,0);
}

function reviewQuiz(){
  currentIdx=0;
  showScreen('screen-quiz');
  renderQuestion(currentIdx);
  updateScoreUI();
  window.scrollTo(0,0);
}

/* ─────────────────────────────────────────────────────
   NAVIGATION
───────────────────────────────────────────────────── */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function newSession(){
  if(answers.some(a=>a!==null)){
    if(!confirm('Démarrer une nouvelle session avec '+N_SESSION+' questions différentes ?\nVotre progression actuelle sera perdue.'))return;
  }
  buildSession(balancedDraw(BANK,Math.min(N_SESSION,BANK.length)));
  save();
  showScreen('screen-quiz');
  renderQuestion(currentIdx);
  updateScoreUI();
  window.scrollTo(0,0);
}

function confirmReset(){
  if(!confirm('Recommencer depuis le début ? Les mêmes questions seront conservées mais toutes les réponses seront effacées.'))return;
  answers=new Array(session.length).fill(null);
  currentIdx=0;
  save();
  renderQuestion(currentIdx);
  updateScoreUI();
  window.scrollTo(0,0);
}

/* ─────────────────────────────────────────────────────
   INSTALL BANNER (iOS)
───────────────────────────────────────────────────── */
function dismissBanner(){
  document.getElementById('install-banner').classList.remove('show');
  try{localStorage.setItem('itil4_banner','1');}catch(e){}
}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone;
if(isIOS&&!isStandalone&&!localStorage.getItem('itil4_banner')){
  document.getElementById('install-banner').classList.add('show');
}

/* ─────────────────────────────────────────────────────
   DÉMARRAGE
───────────────────────────────────────────────────── */
document.getElementById('bank-label').textContent=BANK.length+' questions en banque';

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

if(!load()){
  buildSession(balancedDraw(BANK,Math.min(N_SESSION,BANK.length)));
}

setTimeout(()=>{
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{document.getElementById('splash').style.display='none';},500);
  showScreen('screen-quiz');
  renderQuestion(currentIdx);
  updateScoreUI();
},1200);
</script>
</body>
</html>
