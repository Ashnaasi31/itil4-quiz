<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ITIL® 4 Foundation — Quiz</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — DARK / LIGHT
═══════════════════════════════════════════ */
:root,[data-theme="dark"]{
  --bg:       #0d1117;
  --bg2:      #161b22;
  --bg3:      #1f2937;
  --border:   #30363d;
  --border2:  #3d444d;
  --text1:    #f0f6fc;
  --text2:    #c9d1d9;
  --text3:    #8b949e;
  --accent:   #4f7cff;
  --accent2:  #6e8efb;
  --green:    #3fb950;
  --green-bg: #122a1c;
  --green-bd: #2d6a3f;
  --red:      #f85149;
  --red-bg:   #2c1215;
  --red-bd:   #8b3335;
  --amber:    #e3b341;
  --amber-bg: #2d2005;
  --tag-c:    #1c2b50; --tag-ct:#79a8ff;
  --tag-p:    #1a2c1a; --tag-pt:#56d364;
  --tag-pr:   #2c1e3a; --tag-prt:#c6a5f7;
  --tag-d:    #1e2a1e; --tag-dt:#7ee787;
  --tag-s:    #1a1f2e; --tag-st:#58a6ff;
  --tag-n:    #2d2005; --tag-nt:#e3b341;
  --shadow:   0 4px 24px rgba(0,0,0,.5);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:       #f6f8fa;
  --bg2:      #ffffff;
  --bg3:      #eef2f7;
  --border:   #d0d7de;
  --border2:  #b6bcc3;
  --text1:    #1a202c;
  --text2:    #374151;
  --text3:    #6e7a8a;
  --accent:   #2563eb;
  --accent2:  #1d4ed8;
  --green:    #16a34a;
  --green-bg: #f0fdf4;
  --green-bd: #86efac;
  --red:      #dc2626;
  --red-bg:   #fef2f2;
  --red-bd:   #fca5a5;
  --amber:    #d97706;
  --amber-bg: #fffbeb;
  --tag-c:    #dbeafe; --tag-ct:#1e40af;
  --tag-p:    #dcfce7; --tag-pt:#166534;
  --tag-pr:   #f3e8ff; --tag-prt:#6b21a8;
  --tag-d:    #d1fae5; --tag-dt:#065f46;
  --tag-s:    #e0f2fe; --tag-st:#0c4a6e;
  --tag-n:    #fef9c3; --tag-nt:#854d0e;
  --shadow:   0 4px 24px rgba(0,0,0,.08);
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scroll-behavior:smooth;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text1);
  min-height:100vh;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════════
   ÉCRANS
═══════════════════════════════════════════ */
.screen{display:none;}
.screen.active{display:block;}

/* ═══════════════════════════════════════════
   SPLASH
═══════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.5rem;
  transition:opacity .5s;
}
#splash.hidden{opacity:0;pointer-events:none;}
.splash-logo{
  font-size:3rem;font-weight:700;
  letter-spacing:-.02em;color:var(--text1);
}
.splash-logo span{color:var(--accent);}
.splash-sub{font-size:.9rem;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
.splash-bar{
  width:200px;height:3px;border-radius:2px;
  background:var(--bg3);overflow:hidden;
}
.splash-fill{
  height:100%;width:0;background:var(--accent);border-radius:2px;
  animation:spl 1.2s ease forwards;
}
@keyframes spl{to{width:100%;}}

/* ═══════════════════════════════════════════
   LAYOUT WRAPPER
═══════════════════════════════════════════ */
.app{max-width:720px;margin:0 auto;padding:1.5rem 1rem 5rem;}

/* ═══════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem;gap:1rem;
}
.topbar-brand{
  font-size:1.15rem;font-weight:700;letter-spacing:-.01em;color:var(--text1);
}
.topbar-brand span{color:var(--accent);}
.topbar-actions{display:flex;gap:.5rem;align-items:center;}

/* ═══════════════════════════════════════════
   BOUTONS
═══════════════════════════════════════════ */
.btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.55rem 1.1rem;border-radius:8px;border:1px solid var(--border);
  font:500 .875rem 'DM Sans',sans-serif;cursor:pointer;
  background:var(--bg2);color:var(--text2);
  transition:all .18s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg3);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn-sm{padding:.4rem .8rem;font-size:.8rem;}
.btn-icon{padding:.5rem;aspect-ratio:1;justify-content:center;}

/* ═══════════════════════════════════════════
   TOGGLE THÈME
═══════════════════════════════════════════ */
.theme-toggle{
  width:48px;height:26px;border-radius:13px;
  background:var(--bg3);border:1px solid var(--border);
  cursor:pointer;position:relative;transition:background .3s;
  flex-shrink:0;
}
.theme-toggle::after{
  content:'';position:absolute;
  top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:var(--accent);
  transition:transform .25s,background .25s;
}
[data-theme="light"] .theme-toggle::after{transform:translateX(22px);}
.theme-label{font-size:.75rem;color:var(--text3);}

/* ═══════════════════════════════════════════
   CARTE PROGRESSION
═══════════════════════════════════════════ */
.progress-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:1.25rem 1.5rem;
  margin-bottom:1.25rem;box-shadow:var(--shadow-sm);
}
.progress-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.75rem;gap:.5rem;flex-wrap:wrap;
}
.progress-label{
  font-size:.85rem;font-weight:600;color:var(--text3);
  letter-spacing:.04em;text-transform:uppercase;
}
.progress-count{
  font-family:'DM Mono',monospace;font-size:1rem;
  font-weight:500;color:var(--text1);
}
.progress-count span{color:var(--accent);}

.prog-track{
  height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;
}
.prog-fill{
  height:100%;background:var(--accent);border-radius:4px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
}

.score-chips{
  display:flex;gap:.75rem;margin-top:1rem;flex-wrap:wrap;
}
.chip{
  flex:1;min-width:60px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:.5rem .75rem;text-align:center;
}
.chip .cv{font-size:1.2rem;font-weight:700;font-family:'DM Mono',monospace;}
.chip .cl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
.chip.ok .cv{color:var(--green);}
.chip.ko .cv{color:var(--red);}
.chip.ac .cv{color:var(--accent);}

/* ═══════════════════════════════════════════
   CARTE QUESTION
═══════════════════════════════════════════ */
.q-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:1.75rem 1.5rem;
  box-shadow:var(--shadow);
  animation:fadeUp .3s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
.q-meta{
  display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap;
}
.q-num{
  font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;
  color:var(--text3);background:var(--bg3);
  border:1px solid var(--border);
  border-radius:6px;padding:.2rem .5rem;
}
.q-tag{
  font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border-radius:6px;padding:.2rem .6rem;border:1px solid transparent;
}
.tc{background:var(--tag-c);color:var(--tag-ct);border-color:var(--tag-ct);}
.tp{background:var(--tag-p);color:var(--tag-pt);border-color:var(--tag-pt);}
.tr{background:var(--tag-pr);color:var(--tag-prt);border-color:var(--tag-prt);}
.td{background:var(--tag-d);color:var(--tag-dt);border-color:var(--tag-dt);}
.ts{background:var(--tag-s);color:var(--tag-st);border-color:var(--tag-st);}
.tn{background:var(--tag-n);color:var(--tag-nt);border-color:var(--tag-nt);}

.q-text{
  font-size:1.1rem;font-weight:500;line-height:1.6;
  color:var(--text1);margin-bottom:1.5rem;
}

/* ═══════════════════════════════════════════
   OPTIONS
═══════════════════════════════════════════ */
.opts{display:flex;flex-direction:column;gap:.6rem;}

.opt{
  width:100%;text-align:left;cursor:pointer;
  display:flex;align-items:flex-start;gap:.8rem;
  background:var(--bg3);border:1.5px solid var(--border);
  border-radius:10px;padding:.85rem 1rem;
  font:400 .9rem/1.5 'DM Sans',sans-serif;color:var(--text2);
  transition:all .18s;
}
.opt:not(:disabled):hover{
  border-color:var(--accent);color:var(--text1);
  background:var(--bg2);transform:translateX(2px);
}
.opt-letter{
  flex-shrink:0;width:24px;height:24px;border-radius:6px;
  background:var(--bg2);border:1px solid var(--border2);
  font:600 .75rem 'DM Mono',monospace;color:var(--text3);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;margin-top:1px;
}
.opt-text{flex:1;line-height:1.5;}

/* États après réponse */
.opt.correct{
  background:var(--green-bg);border-color:var(--green);color:var(--green);
  cursor:default;
}
.opt.correct .opt-letter{
  background:var(--green);border-color:var(--green);color:#fff;
}
.opt.wrong{
  background:var(--red-bg);border-color:var(--red);color:var(--red);
  cursor:default;
}
.opt.wrong .opt-letter{
  background:var(--red);border-color:var(--red);color:#fff;
}
.opt.neutral:disabled{
  opacity:.45;cursor:default;
}
.opt:disabled{cursor:default;}

/* ═══════════════════════════════════════════
   RETOUR IMMÉDIAT
═══════════════════════════════════════════ */
.feedback{
  margin-top:1.25rem;border-radius:12px;padding:1.1rem 1.25rem;
  border:1px solid;animation:fadeUp .25s ease both;
}
.feedback.ok{background:var(--green-bg);border-color:var(--green-bd);}
.feedback.ko{background:var(--red-bg);border-color:var(--red-bd);}

.feedback-verdict{
  font-size:.95rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem;
}
.feedback.ok .feedback-verdict{color:var(--green);}
.feedback.ko .feedback-verdict{color:var(--red);}
.feedback-verdict svg{flex-shrink:0;}

.feedback-why{
  font-size:.875rem;line-height:1.6;color:var(--text2);
}
.feedback-why strong{color:var(--text1);}

.feedback-whynot{
  margin-top:.75rem;padding:.7rem .9rem;
  border-radius:8px;background:rgba(248,81,73,.08);
  border-left:3px solid var(--red);
  font-size:.82rem;line-height:1.5;color:var(--text3);
}

/* ═══════════════════════════════════════════
   BOUTON SUIVANT
═══════════════════════════════════════════ */
.next-wrap{
  margin-top:1.25rem;display:flex;justify-content:flex-end;
}
.btn-next{
  padding:.7rem 1.5rem;font-size:.95rem;font-weight:600;
  border-radius:10px;border:none;cursor:pointer;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;gap:.5rem;
  transition:all .2s;box-shadow:0 2px 12px rgba(79,124,255,.4);
}
.btn-next:hover{background:var(--accent2);transform:translateX(2px);}
.btn-next:active{transform:scale(.97);}

/* ═══════════════════════════════════════════
   ACTIONS BASSE
═══════════════════════════════════════════ */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:.75rem 1rem;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}
.bank-label{font-size:.75rem;color:var(--text3);font-family:'DM Mono',monospace;}

/* ═══════════════════════════════════════════
   VIDE
═══════════════════════════════════════════ */
.empty-state{
  text-align:center;padding:3rem 1rem;
  color:var(--text3);
}
.empty-state .ei{font-size:2.5rem;margin-bottom:.75rem;}

/* ═══════════════════════════════════════════
   ÉCRAN RÉSULTATS
═══════════════════════════════════════════ */
.results-wrap{max-width:720px;margin:0 auto;padding:1.5rem 1rem 5rem;}

.results-hero{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:2.5rem 1.5rem;text-align:center;
  margin-bottom:1.25rem;box-shadow:var(--shadow);
}
.results-pct{
  font-size:4rem;font-weight:700;font-family:'DM Mono',monospace;
  line-height:1;margin-bottom:.5rem;
}
.results-pct.pass{color:var(--green);}
.results-pct.fail{color:var(--red);}
.results-verdict{
  font-size:1.2rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:.5rem;
}
.results-verdict.pass{color:var(--green);}
.results-verdict.fail{color:var(--red);}
.results-threshold{font-size:.85rem;color:var(--text3);}
.results-encouragement{
  margin-top:1rem;font-size:.95rem;line-height:1.6;
  color:var(--text2);max-width:480px;margin-inline:auto;
}

.results-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;
  margin-bottom:1.25rem;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:1.25rem 1rem;text-align:center;
}
.stat-val{
  font-size:2rem;font-weight:700;font-family:'DM Mono',monospace;
}
.stat-val.ok{color:var(--green);}
.stat-val.ko{color:var(--red);}
.stat-val.ac{color:var(--accent);}
.stat-lbl{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:.25rem;}

.cat-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;
}
.cat-card h3{font-size:.85rem;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1rem;}
.cat-row{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;}
.cat-row:last-child{margin-bottom:0;}
.cat-name{font-size:.8rem;font-weight:500;color:var(--text2);width:100px;flex-shrink:0;}
.cat-track{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.cat-bar{height:100%;border-radius:4px;transition:width .6s ease;}
.cat-pct{font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;color:var(--text3);width:34px;text-align:right;}

.wrong-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;
}
.wrong-card h3{font-size:.85rem;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:1rem;}
.wrong-item{
  border-bottom:1px solid var(--border);padding:.9rem 0;
}
.wrong-item:last-child{border-bottom:none;}
.wi-q{font-size:.85rem;color:var(--text2);margin-bottom:.4rem;line-height:1.5;}
.wi-correct{font-size:.8rem;color:var(--green);font-weight:500;}
.wi-your{font-size:.8rem;color:var(--red);}

.results-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.25rem;}
.results-actions .btn{flex:1;min-width:160px;justify-content:center;}

/* ═══════════════════════════════════════════
   BADGE DE CATÉGORIE (résultats)
═══════════════════════════════════════════ */
.perfect-badge{
  text-align:center;padding:2rem;color:var(--text3);
}
.perfect-badge .pi{font-size:2.5rem;}

/* ═══════════════════════════════════════════
   INSTALL BANNER
═══════════════════════════════════════════ */
#install-banner{
  display:none;background:var(--accent);color:#fff;
  border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;
  font-size:.85rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
}
#install-banner.show{display:flex;}
#install-banner button{
  flex-shrink:0;background:rgba(255,255,255,.2);border:none;color:#fff;
  border-radius:6px;padding:.3rem .75rem;cursor:pointer;font-size:.8rem;font-weight:600;
}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media(max-width:480px){
  .app,.results-wrap{padding:1rem .75rem 5rem;}
  .q-text{font-size:1rem;}
  .results-pct{font-size:3rem;}
  .results-stats{grid-template-columns:repeat(3,1fr);}
  .stat-val{font-size:1.5rem;}
}
</style>
</head>
<body>

<!-- ─── SPLASH ─── -->
<div id="splash">
  <div class="splash-logo">ITIL<span>®</span> 4</div>
  <div class="splash-sub">Foundation · Quiz d'entraînement</div>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<!-- ─── ÉCRAN QUIZ ─── -->
<div id="screen-quiz" class="screen">
  <div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-brand">ITIL<span>®</span> 4 Foundation</div>
      <div class="topbar-actions">
        <div class="theme-label" id="theme-label">☾</div>
        <button class="theme-toggle" id="theme-toggle" title="Changer de thème"></button>
        <button class="btn btn-sm" onclick="newSession()">↺ Nouvelle</button>
      </div>
    </div>

    <!-- INSTALL BANNER iOS -->
    <div id="install-banner">
      <p>📲 <strong>Partager</strong> → <strong>"Sur l'écran d'accueil"</strong> pour installer</p>
      <button onclick="dismissBanner()">OK</button>
    </div>

    <!-- PROGRESSION -->
    <div class="progress-card">
      <div class="progress-header">
        <span class="progress-label">Progression</span>
        <span class="progress-count">Question <span id="q-current">1</span> / <span id="q-total">40</span></span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="score-chips">
        <div class="chip"><div class="cv" id="s-done">0</div><div class="cl">Répondues</div></div>
        <div class="chip ok"><div class="cv" id="s-ok">0</div><div class="cl">Correctes</div></div>
        <div class="chip ko"><div class="cv" id="s-ko">0</div><div class="cl">Incorrectes</div></div>
        <div class="chip ac"><div class="cv" id="s-pct">—</div><div class="cl">Score</div></div>
      </div>
    </div>

    <!-- ZONE QUESTION -->
    <div id="quiz-area"></div>

  </div><!-- .app -->
  <div class="bottom-bar">
    <span class="bank-label" id="bank-label"></span>
    <button class="btn btn-sm" onclick="confirmReset()">🗑 Recommencer</button>
  </div>
</div>

<!-- ─── ÉCRAN RÉSULTATS ─── -->
<div id="screen-results" class="screen">
  <div class="results-wrap">

    <div class="topbar">
      <div class="topbar-brand">ITIL<span>®</span> 4 Foundation</div>
      <div class="topbar-actions">
        <div class="theme-label" id="theme-label2">☾</div>
        <button class="theme-toggle" id="theme-toggle2" title="Changer de thème"></button>
      </div>
    </div>

    <div id="results-body"></div>

  </div>
</div>

<script>
/* =====================================================================
   BANQUE DE QUESTIONS — 100+ questions ITIL 4 Foundation
   ans: index de la BONNE réponse dans opts[]
===================================================================== */
const BANK = [
/* CONCEPTS CLÉS */
{tag:"concepts",q:"Quelle est la définition d'un service selon ITIL 4 ?",
opts:["Un moyen de permettre la co-création de valeur en facilitant les résultats que les clients souhaitent atteindre","Un ensemble de processus permettant de gérer les composants techniques d'une organisation","Un accord formel entre prestataire et client définissant les niveaux de performance attendus","Une combinaison de ressources humaines et techniques pour répondre aux demandes"],
ans:0,why:"Un <strong>service</strong> est un moyen de permettre la co-création de valeur en facilitant les <strong>résultats (outcomes)</strong> que les clients souhaitent atteindre, sans que le client ait à gérer des coûts et risques spécifiques.",
whynot:["","Un service n'est pas un ensemble de processus — c'est la définition d'une pratique.","C'est la définition d'un SLA, pas d'un service.","Des ressources humaines et techniques décrivent une capacité, pas un service."]},

{tag:"concepts",q:"Qu'est-ce que l'utilité (utility) d'un service ?",
opts:["La fonctionnalité offerte par un produit ou service pour répondre à un besoin particulier","L'assurance que le service sera disponible selon les niveaux convenus avec le client","Le coût total supporté par le consommateur pour bénéficier du service","La mesure de la satisfaction des utilisateurs à l'issue de la prestation"],
ans:0,why:"L'<strong>utilité (utility)</strong> est la fonctionnalité offerte pour répondre à un besoin — ce que le service fait. Autrement dit : est-il <em>fitness for purpose</em> ?",
whynot:["","C'est la définition de la garantie (warranty), pas de l'utilité.","Le coût est une composante de la valeur perçue, pas de l'utilité.","La satisfaction client est une mesure de résultat."]},

{tag:"concepts",q:"Qu'est-ce que la garantie (warranty) dans ITIL 4 ?",
opts:["L'assurance qu'un produit ou service répondra aux exigences convenues en termes de disponibilité et sécurité","La fonctionnalité d'un produit permettant de répondre aux besoins identifiés du consommateur","Un document contractuel précisant les obligations légales du prestataire envers le client","L'ensemble des activités réalisées par le prestataire pour livrer un service"],
ans:0,why:"La <strong>garantie (warranty)</strong> est l'assurance qu'un produit ou service répondra aux exigences convenues. Elle couvre disponibilité, capacité, continuité et sécurité — <em>fitness for use</em>.",
whynot:["","C'est la définition de l'utilité (utility).","Un contrat légal n'est pas la définition ITIL de la garantie.","Cela décrit la prestation de services."]},

{tag:"concepts",q:"Pour qu'un service crée de la valeur, que faut-il ?",
opts:["L'utilité ET la garantie doivent être présentes simultanément","L'utilité seule est suffisante si le service répond au besoin du client","La garantie seule suffit si le service est disponible et sécurisé","Ni l'utilité ni la garantie : la valeur est déterminée uniquement par le prix"],
ans:0,why:"La valeur nécessite <strong>l'utilité ET la garantie simultanément</strong>. Un service fonctionnel mais instable (pas de garantie) ou disponible mais inutile (pas d'utilité) ne crée pas de valeur réelle.",
whynot:["","L'utilité seule ne suffit pas — un service instable ne crée pas de valeur.","La garantie seule ne suffit pas — un service disponible mais inutile ne crée pas de valeur.","Le prix n'est pas le déterminant de la valeur selon ITIL 4."]},

{tag:"concepts",q:"Qu'est-ce qu'un 'résultat' (outcome) dans ITIL 4 ?",
opts:["Un résultat pour une partie prenante rendu possible par une ou plusieurs sorties (outputs)","Une livraison tangible produite par une activité de service","Le temps de réponse moyen mesuré pour un service donné","Un rapport généré à la fin d'un cycle de gestion des services"],
ans:0,why:"Un <strong>outcome</strong> est un <strong>résultat pour une partie prenante</strong>, rendu possible par des sorties (outputs). La distinction est clé : l'output est ce qui est livré, l'outcome est le bénéfice obtenu.",
whynot:["","Une livraison tangible est un output, pas un outcome.","Le temps de réponse est une mesure de performance (KPI), pas un outcome.","Un rapport est un output, pas un outcome."]},

{tag:"concepts",q:"Quelle est la différence entre un client et un utilisateur selon ITIL 4 ?",
opts:["Le client définit les exigences et paye pour le service ; l'utilisateur utilise le service au quotidien","Le client utilise le service au quotidien ; l'utilisateur définit les exigences contractuelles","Client et utilisateur sont synonymes dans ITIL 4","Le client est toujours interne à l'organisation ; l'utilisateur est toujours externe"],
ans:0,why:"Le <strong>client</strong> définit les exigences, négocie les SLA et paye. L'<strong>utilisateur</strong> utilise le service quotidiennement. Une même personne peut jouer les deux rôles.",
whynot:["","C'est l'inverse des définitions ITIL 4.","ITIL 4 distingue clairement ces deux rôles.","Les deux peuvent être internes ou externes à l'organisation."]},

{tag:"concepts",q:"Qu'est-ce qu'un risque selon ITIL 4 ?",
opts:["Un événement incertain susceptible de causer un préjudice ou une perte, ou de rendre plus difficile l'atteinte des objectifs","Un problème identifié dont la cause profonde est connue","Un incident majeur ayant déjà causé une interruption de service","Une vulnérabilité technique détectée lors d'un audit de sécurité"],
ans:0,why:"Un <strong>risque</strong> est un événement <strong>incertain</strong> qui, s'il se produit, peut avoir un impact négatif sur les objectifs. Il inclut à la fois la probabilité d'occurrence et l'impact potentiel.",
whynot:["","Un problème connu n'est plus un risque incertain — c'est un problème documenté.","Un incident passé est un fait, pas un risque futur incertain.","Une vulnérabilité peut devenir un risque mais n'en est pas la définition."]},

{tag:"concepts",q:"Qu'est-ce que la gestion des relations dans ITIL 4 ?",
opts:["Établir et entretenir des liens entre l'organisation et ses parties prenantes à tous les niveaux","Gérer les contrats formels entre prestataires et fournisseurs","Résoudre les conflits entre équipes IT et métiers","Surveiller la satisfaction client via des enquêtes régulières"],
ans:0,why:"La <strong>gestion des relations</strong> vise à établir et entretenir des liens entre l'organisation et ses parties prenantes à tous les niveaux — stratégique, tactique et opérationnel.",
whynot:["","La gestion des contrats est une pratique distincte.","La résolution de conflits est une activité, pas la définition de la pratique.","Les enquêtes de satisfaction sont un outil parmi d'autres."]},

{tag:"concepts",q:"Qu'est-ce qu'un 'problème' (problem) dans ITIL 4 ?",
opts:["Une cause ou cause potentielle d'un ou plusieurs incidents","Une interruption non planifiée ou une dégradation d'un service","Une demande prédéfinie initiée par un utilisateur","Un changement non autorisé causant une dégradation de service"],
ans:0,why:"Un <strong>problème</strong> est la <strong>cause ou cause potentielle d'un ou plusieurs incidents</strong>. Il peut être identifié de manière réactive (après un incident) ou proactive.",
whynot:["","Une interruption non planifiée est un <strong>incident</strong>, pas un problème.","Une demande prédéfinie est une demande de service.","Un changement non autorisé peut provoquer un incident, mais ce n'est pas la définition d'un problème."]},

{tag:"concepts",q:"Qu'est-ce qu'un 'événement' (event) dans ITIL 4 ?",
opts:["Tout changement d'état significatif pour la gestion d'un service ou d'un CI","Une interruption non planifiée d'un service IT","Une demande de changement émise par l'équipe technique","Une réunion de revue de service avec le client"],
ans:0,why:"Un <strong>événement</strong> est tout <strong>changement d'état significatif</strong> pour la gestion d'un service ou d'un élément de configuration (CI). Les événements peuvent être informatifs, avertissements ou exceptions.",
whynot:["","Une interruption non planifiée est un incident.","Une demande de changement est une demande de service ou de changement.","Une réunion est une activité organisationnelle, pas un événement ITIL."]},

{tag:"concepts",q:"Comment ITIL 4 définit-il la 'valeur' ?",
opts:["Les bénéfices perçus, l'utilité et l'importance de quelque chose — définis par le bénéficiaire","Le prix payé par le client pour accéder à un service","La somme des coûts évités grâce à la mise en œuvre des services","Le retour sur investissement calculé par le prestataire de services"],
ans:0,why:"La <strong>valeur</strong> selon ITIL 4 est subjective et <strong>définie par le bénéficiaire</strong> — ce sont les bénéfices perçus, l'utilité et l'importance du service pour le consommateur, pas le coût ou le ROI.",
whynot:["","Le prix est un facteur, mais pas la définition de la valeur.","Les coûts évités sont une mesure de valeur partielle, pas sa définition.","Le ROI est calculé par le prestataire, mais la valeur est perçue par le bénéficiaire."]},

{tag:"concepts",q:"Qu'est-ce qu'un 'élément de configuration' (CI) ?",
opts:["Tout composant qui doit être géré pour délivrer un service IT","Uniquement les serveurs physiques et équipements réseau de l'organisation","Un document contractuel définissant les paramètres d'un service","Une alerte générée par un outil de supervision IT"],
ans:0,why:"Un <strong>CI (Configuration Item)</strong> est tout composant qui doit être géré pour délivrer un service — serveurs, logiciels, documents, personnes, etc. Tout ce qui figure dans la CMDB est un CI.",
whynot:["","Un CI peut être logiciel, documentaire ou humain — pas uniquement matériel.","Un document contractuel peut être un CI mais n'en est pas la définition.","Une alerte est un événement, pas un CI."]},

{tag:"concepts",q:"Qu'est-ce que la 'co-création de valeur' selon ITIL 4 ?",
opts:["La valeur est créée conjointement par le prestataire et le consommateur — pas uniquement par le prestataire","Le prestataire crée seul la valeur et la transmet au client sous forme de services","Le client co-finance les services pour en réduire le coût unitaire","Les fournisseurs externes créent la valeur à la place du prestataire interne"],
ans:0,why:"ITIL 4 rompt avec l'idée que le prestataire crée seul la valeur. La <strong>co-création</strong> signifie que <strong>prestataire et consommateur collaborent</strong> pour produire de la valeur ensemble.",
whynot:["","ITIL 4 dépasse ce modèle unilatéral — la valeur est co-créée.","Le co-financement est une notion financière, pas la co-création de valeur.","Les fournisseurs participent à l'écosystème mais la co-création implique le consommateur."]},

{tag:"concepts",q:"Qu'est-ce que la 'gestion des actifs IT' selon ITIL 4 ?",
opts:["La planification et la gestion du cycle de vie complet de tous les actifs IT","La surveillance en temps réel de tous les équipements réseau","La gestion des licences logicielles uniquement","L'inventaire annuel des équipements physiques de l'organisation"],
ans:0,why:"La <strong>gestion des actifs IT</strong> planifie et gère le <strong>cycle de vie complet</strong> de tous les actifs IT pour maximiser la valeur, contrôler les coûts et gérer les risques — matériels, logiciels, contrats.",
whynot:["","La surveillance réseau relève de la gestion des événements.","Les licences sont incluses mais ne sont pas la seule composante.","Un inventaire annuel est insuffisant — ITIL 4 prône une gestion continue du cycle de vie."]},

{tag:"concepts",q:"Qu'est-ce qu'un 'workaround' (solution de contournement) ?",
opts:["Une solution temporaire réduisant l'impact d'un incident en attendant la résolution permanente","Une correction définitive appliquée pour résoudre un problème identifié","Un changement d'urgence visant à restaurer un service interrompu","Un accord de niveau de service dégradé accepté temporairement par le client"],
ans:0,why:"Un <strong>workaround</strong> est une <strong>solution temporaire</strong> pour réduire l'impact d'un incident ou d'un problème. Il ne résout pas la cause profonde mais permet de maintenir un niveau de service acceptable.",
whynot:["","Une correction définitive est une résolution permanente du problème.","Un changement d'urgence peut être une façon de mettre en place un workaround, mais n'en est pas la définition.","Un SLA dégradé est un accord commercial, pas une solution technique."]},

{tag:"concepts",q:"Quelle est la définition d'une 'erreur connue' (known error) ?",
opts:["Un problème analysé dont la cause profonde a été documentée, avec ou sans workaround","Un incident récurrent sans solution identifiée","Un changement échoué dont les effets sont documentés dans la CMDB","Un risque identifié et accepté formellement par le management"],
ans:0,why:"Une <strong>erreur connue</strong> est un problème dont la <strong>cause profonde a été documentée</strong>. Un workaround peut exister ou non. Elle est enregistrée dans la base des erreurs connues (KEDB).",
whynot:["","Un incident récurrent devient un problème puis une erreur connue une fois analysé.","Un changement échoué peut générer un incident ou problème, pas une erreur connue.","Un risque accepté est géré par la gestion des risques."]},

{tag:"concepts",q:"Qu'est-ce que l'amélioration continue selon ITIL 4 ?",
opts:["L'activité récurrente réalisée à tous les niveaux pour améliorer la performance des services et pratiques","Une phase annuelle de révision des processus par le management","Un projet ponctuel visant à corriger les défaillances majeures","L'automatisation progressive de tous les processus manuels"],
ans:0,why:"L'<strong>amélioration continue</strong> est une <strong>activité récurrente</strong> qui se déroule à tous les niveaux de l'organisation. Elle fait partie intégrante du SVS et est ancrée dans la culture de l'organisation.",
whynot:["","L'amélioration continue est permanente, pas annuelle.","Un projet ponctuel n'est pas l'amélioration continue telle que définie par ITIL 4.","L'automatisation peut être une forme d'amélioration, mais n'en est pas la définition."]},

{tag:"concepts",q:"Qu'est-ce que le 'catalogue de services' ?",
opts:["Un référentiel structuré listant tous les services opérationnels disponibles pour les utilisateurs","Un document listant les incidents en cours et leur statut","Un inventaire de tous les équipements IT de l'organisation","Un registre des changements planifiés pour les prochains mois"],
ans:0,why:"Le <strong>catalogue de services</strong> est un référentiel structuré listant tous les <strong>services disponibles</strong> pour les utilisateurs, avec leurs caractéristiques, niveaux de service et modalités d'accès.",
whynot:["","Un document d'incidents est un registre d'incidents, pas un catalogue.","L'inventaire IT est géré par la CMDB et la gestion des actifs.","Les changements planifiés sont dans le planning des changements (change schedule)."]},

{tag:"concepts",q:"Qu'est-ce que la 'gouvernance' dans le SVS ITIL 4 ?",
opts:["Le système par lequel une organisation est dirigée et contrôlée, assurant l'alignement sur les objectifs","L'ensemble des pratiques techniques utilisées pour gérer l'infrastructure IT","Le processus de validation des changements avant leur mise en production","La structure hiérarchique de l'équipe IT et ses responsabilités"],
ans:0,why:"La <strong>gouvernance</strong> est le système par lequel une organisation est <strong>dirigée et contrôlée</strong>. Dans le SVS, elle assure l'alignement des activités IT sur les objectifs de l'organisation.",
whynot:["","Les pratiques techniques sont des composants du SVS, pas la gouvernance.","La validation des changements est une activité de l'activation du changement.","La structure hiérarchique est une composante organisationnelle, pas la gouvernance en elle-même."]},

{tag:"concepts",q:"Qu'est-ce qu'un SLA (Service Level Agreement) ?",
opts:["Un accord documenté entre prestataire et client définissant les niveaux de service attendus","Un contrat de maintenance entre l'organisation IT et ses fournisseurs externes","Une charte interne définissant les objectifs de l'équipe IT","Un rapport mensuel présentant les performances atteintes par les services"],
ans:0,why:"Un <strong>SLA</strong> est un accord documenté entre <strong>prestataire et client</strong> définissant les niveaux de service (disponibilité, temps de réponse, etc.) ainsi que les responsabilités de chaque partie.",
whynot:["","Un accord avec des fournisseurs externes est un OLA ou UC (Underpinning Contract).","Une charte interne est un document organisationnel, pas un SLA.","Un rapport de performance est un bilan, pas un accord."]},

/* PRINCIPES DIRECTEURS */
{tag:"principes",q:"Combien y a-t-il de principes directeurs dans ITIL 4 ?",
opts:["7","5","4","9"],
ans:0,why:"ITIL 4 définit <strong>7 principes directeurs</strong> : Se concentrer sur la valeur, Partir de l'existant, Progresser itérativement, Collaborer et promouvoir la visibilité, Penser et travailler de façon holistique, Rester simple et pratique, Optimiser et automatiser.",
whynot:["","5 n'est pas le bon nombre.","4 n'est pas le bon nombre.","9 n'est pas le bon nombre."]},

{tag:"principes",q:"Quel principe directeur recommande de commencer par évaluer ce qui existe avant de créer quelque chose de nouveau ?",
opts:["Partir de l'existant","Se concentrer sur la valeur","Rester simple et pratique","Optimiser et automatiser"],
ans:0,why:"<strong>Partir de l'existant</strong> recommande d'évaluer ce qui est déjà en place avant de créer quoi que ce soit de nouveau. Les processus, services, outils et compétences existants peuvent être réutilisés.",
whynot:["","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur.","Rester simple et pratique concerne la réduction de la complexité inutile.","Optimiser et automatiser concerne l'amélioration de l'efficience."]},

{tag:"principes",q:"Quel principe directeur insiste sur l'importance de comprendre la vision d'ensemble plutôt que de se concentrer sur un seul aspect ?",
opts:["Penser et travailler de façon holistique","Collaborer et promouvoir la visibilité","Se concentrer sur la valeur","Progresser itérativement avec des retours"],
ans:0,why:"<strong>Penser et travailler de façon holistique</strong> insiste sur la compréhension de l'ensemble — aucune pratique ni composant ne fonctionne de manière isolée. Il faut considérer toutes les dimensions.",
whynot:["","Collaborer concerne l'implication des parties prenantes.","Se concentrer sur la valeur concerne l'alignement sur les besoins.","Progresser itérativement concerne l'organisation du travail."]},

{tag:"principes",q:"Quel principe directeur est lié au fait d'impliquer les bonnes personnes et de partager les informations nécessaires ?",
opts:["Collaborer et promouvoir la visibilité","Penser et travailler de façon holistique","Partir de l'existant","Optimiser et automatiser"],
ans:0,why:"<strong>Collaborer et promouvoir la visibilité</strong> implique d'associer les bonnes parties prenantes, de partager l'information et de travailler ensemble — tout en maintenant la transparence sur les décisions.",
whynot:["","Penser holistiquement concerne la vision d'ensemble, pas la collaboration.","Partir de l'existant concerne l'évaluation de l'existant.","Optimiser et automatiser concerne l'efficience."]},

{tag:"principes",q:"Quel principe directeur recommande d'organiser le travail en petites sections gérables exécutables en temps voulu ?",
opts:["Progresser itérativement avec des retours","Se concentrer sur la valeur","Rester simple et pratique","Partir de l'existant"],
ans:0,why:"<strong>Progresser itérativement avec des retours</strong> préconise d'organiser le travail en sections plus petites et gérables. Cela permet une concentration plus nette, une meilleure adaptation aux retours et une réduction des risques.",
whynot:["","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur.","Rester simple et pratique concerne la réduction de la complexité.","Partir de l'existant concerne l'évaluation de ce qui existe déjà."]},

{tag:"principes",q:"Quel est le bon ordre pour appliquer le principe 'Optimiser et automatiser' ?",
opts:["Optimiser d'abord les processus manuels, puis automatiser ce qui a été optimisé","Automatiser d'abord pour gagner du temps, puis optimiser les processus automatisés","Automatiser et optimiser simultanément pour maximiser l'efficacité","L'ordre n'a pas d'importance tant que l'objectif d'efficience est atteint"],
ans:0,why:"Il faut d'abord <strong>optimiser</strong> (simplifier, éliminer les étapes inutiles), puis <strong>automatiser</strong>. Automatiser un mauvais processus revient à faire plus vite quelque chose qui ne devrait pas être fait.",
whynot:["","Automatiser un processus non optimisé amplifie ses défauts.","Faire les deux simultanément sans ordre logique crée de la confusion.","L'ordre est crucial selon ITIL 4."]},

{tag:"principes",q:"Quel principe directeur est en jeu lorsqu'une équipe IT évite de créer des processus inutilement complexes ?",
opts:["Rester simple et pratique","Optimiser et automatiser","Partir de l'existant","Collaborer et promouvoir la visibilité"],
ans:0,why:"<strong>Rester simple et pratique</strong> est le principe qui guide vers la simplicité et l'élimination de la complexité inutile. Si une activité ne contribue pas à la création de valeur, il faut la supprimer ou la simplifier.",
whynot:["","Optimiser et automatiser améliore l'efficience mais ne cherche pas spécifiquement à éviter la complexité.","Partir de l'existant évalue ce qui existe, pas la complexité des nouveaux processus.","Collaborer et promouvoir la visibilité concerne l'implication des parties prenantes."]},

{tag:"principes",q:"Quel principe directeur est directement lié à la réduction du travail manuel répétitif ?",
opts:["Optimiser et automatiser","Rester simple et pratique","Progresser itérativement avec des retours","Partir de l'existant"],
ans:0,why:"<strong>Optimiser et automatiser</strong> vise à maximiser l'efficacité des processus en réduisant le travail manuel répétitif grâce à l'automatisation — après avoir d'abord optimisé les processus concernés.",
whynot:["","Rester simple et pratique concerne la réduction de la complexité, pas nécessairement l'automatisation.","Progresser itérativement concerne l'organisation du travail, pas l'automatisation.","Partir de l'existant concerne l'évaluation de l'existant, pas l'automatisation."]},

{tag:"principes",q:"Quelle affirmation décrit le MIEUX la nature des principes directeurs ?",
opts:["Ils peuvent guider une organisation en toutes circonstances et sont des recommandations non obligatoires","Ils imposent des actions et des décisions précises selon les situations","Ils s'appliquent strictement indépendamment les uns des autres","Ils décrivent les processus que toute organisation doit obligatoirement adopter"],
ans:0,why:"Les principes directeurs sont des <strong>recommandations</strong> pouvant guider une organisation dans <strong>toutes les circonstances</strong>. Ils ne sont pas prescriptifs ni obligatoires — ils s'appliquent ensemble et se renforcent mutuellement.",
whynot:["","Les principes directeurs ne sont pas des obligations.","Les principes se renforcent mutuellement et ne s'appliquent pas indépendamment.","Les principes sont des recommandations, pas des processus obligatoires."]},

{tag:"principes",q:"Comment les principes directeurs doivent-ils être appliqués dans une organisation ?",
opts:["Ensemble et en combinaison — ils se renforcent mutuellement","Un seul principe à la fois, en sélectionnant le plus pertinent pour chaque situation","Dans l'ordre numéroté défini par ITIL 4, du premier au septième","En appliquant uniquement les principes approuvés par la direction de l'organisation"],
ans:0,why:"Les principes directeurs sont conçus pour être <strong>appliqués ensemble</strong>. Ils se complètent et se renforcent mutuellement — aucun principe ne s'applique isolément des autres.",
whynot:["","Sélectionner un seul principe n'est pas la recommandation d'ITIL 4.","Il n'y a pas d'ordre obligatoire d'application des principes.","Les principes ne nécessitent pas d'approbation de la direction pour être appliqués."]},

/* QUATRE DIMENSIONS */
{tag:"dimensions",q:"Quelles sont les quatre dimensions de la gestion des services selon ITIL 4 ?",
opts:["Organisations et personnes ; Information et technologie ; Partenaires et fournisseurs ; Flux de valeur et processus","Stratégie, Conception, Transition, Exploitation continue des services","Personnes, Processus, Produits, Partenaires (les 4P d'ITIL v3)","Gouvernance, Amélioration continue, Chaîne de valeur, Pratiques de gestion"],
ans:0,why:"Les quatre dimensions : <strong>1. Organisations et personnes — 2. Information et technologie — 3. Partenaires et fournisseurs — 4. Flux de valeur et processus.</strong> Tout service doit être analysé sous ces quatre angles.",
whynot:["","Ce sont les étapes du cycle de vie ITIL v3.","Les 4P sont un concept ITIL v3 différent.","Ce sont des composants du SVS ITIL 4, pas les 4 dimensions."]},

{tag:"dimensions",q:"Quelle dimension ITIL 4 concerne principalement la culture organisationnelle et les compétences des équipes ?",
opts:["Organisations et personnes","Information et technologie","Partenaires et fournisseurs","Flux de valeur et processus"],
ans:0,why:"La dimension <strong>Organisations et personnes</strong> couvre la structure organisationnelle, les rôles, les responsabilités, la culture, les compétences et les comportements nécessaires à la prestation de services.",
whynot:["","Outils et systèmes appartiennent à la dimension 'Information et technologie'.","Les relations avec les fournisseurs appartiennent à la dimension 'Partenaires et fournisseurs'.","Les processus détaillés appartiennent à la dimension 'Flux de valeur et processus'."]},

{tag:"dimensions",q:"Quelle dimension inclut les enjeux de sécurité et de conformité réglementaire ?",
opts:["Information et technologie","Organisations et personnes","Partenaires et fournisseurs","Flux de valeur et processus"],
ans:0,why:"La dimension <strong>Information et technologie</strong> inclut les enjeux de sécurité de l'information et de conformité réglementaire, car ils concernent directement la gestion des informations et des technologies utilisées.",
whynot:["","Organisations et personnes couvre les rôles et la culture, pas spécifiquement la sécurité IT.","Partenaires et fournisseurs couvre les relations externes, pas la sécurité informatique interne.","Flux de valeur et processus couvre les activités et leur coordination."]},

{tag:"dimensions",q:"Quel facteur externe représente une nouvelle réglementation RGPD affectant le traitement des données ?",
opts:["Un facteur Légal (L) du modèle PESTEL","Un facteur Social (S) du modèle PESTEL","Un facteur Technologique (T) du modèle PESTEL","Un facteur Politique (P) du modèle PESTEL"],
ans:0,why:"Une nouvelle réglementation RGPD est un <strong>facteur Légal (L)</strong> du modèle PESTEL. Il influence directement la dimension 'Information et technologie' et 'Flux de valeur et processus' de l'organisation.",
whynot:["","Le facteur Social concerne les tendances sociétales et comportements humains.","Le facteur Technologique concerne les avancées technologiques, pas les réglementations.","Le facteur Politique concerne les décisions gouvernementales et la stabilité politique."]},

{tag:"dimensions",q:"Quelle dimension est concernée lorsqu'une organisation sous-traite son support IT à un prestataire externe ?",
opts:["Partenaires et fournisseurs","Organisations et personnes","Information et technologie","Flux de valeur et processus"],
ans:0,why:"La sous-traitance implique directement la dimension <strong>Partenaires et fournisseurs</strong>, qui couvre les relations avec les organisations externes contribuant à la prestation de services.",
whynot:["","Organisations et personnes concerne principalement l'organisation interne.","Information et technologie concerne les systèmes et données, pas les relations de sous-traitance.","Flux de valeur et processus concerne l'organisation des activités, pas les partenariats."]},

{tag:"dimensions",q:"Quelle dimension est principalement concernée par la conception des processus et des flux de travail ?",
opts:["Flux de valeur et processus","Organisations et personnes","Information et technologie","Partenaires et fournisseurs"],
ans:0,why:"La dimension <strong>Flux de valeur et processus</strong> se concentre sur la façon dont les activités sont organisées, les processus conçus et les flux de travail structurés pour créer de la valeur.",
whynot:["","Organisations et personnes concerne les rôles et la culture.","Information et technologie concerne les systèmes et données.","Partenaires et fournisseurs concerne les relations externes."]},

{tag:"dimensions",q:"Les quatre dimensions doivent être équilibrées pour éviter quoi selon ITIL 4 ?",
opts:["Des risques de pertes de valeur, de conflits et une prise en compte insuffisante des parties prenantes","Une augmentation excessive des coûts de prestation de services","Une dépendance trop forte envers les outils et technologies","Un manque de clarté dans les rôles et responsabilités de l'équipe IT"],
ans:0,why:"ITIL 4 précise que les quatre dimensions doivent être <strong>équilibrées</strong> pour éviter des risques importants : <strong>pertes de valeur, conflits et parties prenantes insuffisamment prises en compte</strong>.",
whynot:["","Les coûts excessifs sont un risque mais pas la principale conséquence d'un déséquilibre des dimensions.","La dépendance technologique est un risque lié à une seule dimension.","Le manque de clarté des rôles concerne principalement la dimension Organisations et personnes."]},

{tag:"dimensions",q:"Quelle est la signification du modèle PESTEL dans ITIL 4 ?",
opts:["Un outil d'analyse des facteurs externes : Politique, Économique, Social, Technologique, Environnemental, Légal","Un framework de gestion des pratiques ITIL en 6 phases successives","Un acronyme décrivant les 6 composants du système de valeur des services","Un modèle de maturité pour évaluer les pratiques de gestion des services"],
ans:0,why:"<strong>PESTEL</strong> est un outil d'analyse des facteurs externes influençant une organisation : <strong>P</strong>olitique, <strong>É</strong>conomique, <strong>S</strong>ocial, <strong>T</strong>echnologique, <strong>E</strong>nvironnemental, <strong>L</strong>égal.",
whynot:["","PESTEL n'est pas un framework de phases ITIL.","PESTEL concerne les facteurs externes, pas les composants du SVS.","PESTEL est un outil d'analyse stratégique, pas un modèle de maturité."]},

{tag:"dimensions",q:"Que couvre la dimension 'Information et technologie' dans ITIL 4 ?",
opts:["Les informations, la connaissance, les technologies et leurs relations — y compris sécurité et conformité","Les relations de l'organisation avec ses partenaires et fournisseurs stratégiques","La structure des équipes IT et les compétences requises pour gérer les services","Les processus détaillés et les procédures utilisés pour délivrer les services"],
ans:0,why:"La dimension <strong>Information et technologie</strong> couvre : les informations gérées par les services, la connaissance nécessaire, les technologies utilisées, ainsi que les enjeux de sécurité et de conformité.",
whynot:["","Les relations avec partenaires et fournisseurs relèvent d'une autre dimension.","La structure des équipes appartient à la dimension Organisations et personnes.","Les processus détaillés appartiennent à la dimension Flux de valeur et processus."]},

{tag:"dimensions",q:"Quelle dimension concerne la gestion des accords avec les partenaires selon ITIL 4 ?",
opts:["Partenaires et fournisseurs","Information et technologie","Flux de valeur et processus","Organisations et personnes"],
ans:0,why:"La dimension <strong>Partenaires et fournisseurs</strong> couvre toutes les relations avec les organisations externes — contrats, accords de niveau de service des fournisseurs (OLA/UC) et gestion des partenariats stratégiques.",
whynot:["","Information et technologie concerne les systèmes et données.","Flux de valeur et processus concerne l'organisation des activités.","Organisations et personnes concerne les équipes internes."]},

/* SVS */
{tag:"svs",q:"Quels sont les 5 composants du Système de Valeur des Services (SVS) d'ITIL 4 ?",
opts:["Principes directeurs, gouvernance, chaîne de valeur des services, pratiques et amélioration continue","Processus, fonctions, équipes, organisations et partenaires","Disponibilité, fiabilité, résilience, continuité et temps moyen de restauration","Gestion des incidents, des problèmes, des changements, du service desk et des mises en production"],
ans:0,why:"Le <strong>SVS</strong> comporte 5 composants : <strong>Principes directeurs — Gouvernance — Chaîne de valeur des services — Pratiques — Amélioration continue.</strong>",
whynot:["","Processus, fonctions et équipes sont des éléments opérationnels, pas les composants du SVS.","Ce sont des indicateurs de disponibilité, pas des composants du SVS.","Ce sont des pratiques ITIL 4, pas les composants du SVS lui-même."]},

{tag:"svs",q:"Quelles sont les 6 activités de la chaîne de valeur des services (CVS) ?",
opts:["Planifier, Améliorer, Engager, Concevoir et faire la transition, Obtenir/construire, Livrer et soutenir","Identifier, Analyser, Concevoir, Tester, Déployer et Clôturer","Stratégiser, Concevoir, Transitionner, Opérer, Améliorer et Gouverner","Initier, Planifier, Exécuter, Surveiller, Contrôler et Clôturer"],
ans:0,why:"La <strong>chaîne de valeur des services</strong> comprend 6 activités : <strong>Planifier — Améliorer — Engager — Concevoir et faire la transition — Obtenir/construire — Livrer et soutenir.</strong>",
whynot:["","Ce ne sont pas les 6 activités officielles de la CVS.","Ce sont les étapes du cycle de vie ITIL v3.","Ce sont des étapes de gestion de projet, pas la CVS."]},

{tag:"svs",q:"Quel est l'objectif principal du SVS dans ITIL 4 ?",
opts:["S'assurer que l'organisation crée continuellement de la valeur pour toutes les parties prenantes","Définir les étapes du cycle de vie des services IT de l'organisation","Imposer une structure organisationnelle standard aux équipes IT","Décrire la hiérarchie des pratiques ITIL et leur ordre de priorité"],
ans:0,why:"Le <strong>SVS</strong> a pour objectif de s'assurer que l'organisation crée <strong>continuellement de la valeur</strong> avec et pour toutes les parties prenantes grâce à des flux de travail intégrés et coordonnés.",
whynot:["","Le cycle de vie est un concept ITIL v3, pas l'objectif du SVS.","Le SVS ne prescrit pas de structure organisationnelle standard.","Le SVS ne hiérarchise pas les pratiques."]},

{tag:"svs",q:"Qu'est-ce que la 'demande' (demand) dans le contexte du SVS ?",
opts:["Le déclencheur qui alimente la chaîne de valeur — les besoins et opportunités identifiés par les parties prenantes","Un processus formel de demande de service initié par un utilisateur","Un rapport de performance soumis par le prestataire au client","Une alerte générée par un outil de surveillance des services"],
ans:0,why:"Dans le SVS, la <strong>demande (demand)</strong> représente les <strong>besoins et opportunités</strong> des parties prenantes qui déclenchent l'activité dans la chaîne de valeur. Elle est le point d'entrée du SVS.",
whynot:["","Un processus formel est une pratique, pas la demande dans le SVS.","Un rapport de performance est un output, pas une demande.","Une alerte est un événement IT, pas la demande dans le SVS."]},

{tag:"svs",q:"Parmi les éléments suivants, lequel n'est PAS un composant du SVS ?",
opts:["Les processus métier de l'organisation cliente","Les principes directeurs","La chaîne de valeur des services","L'amélioration continue"],
ans:0,why:"Les <strong>processus métier de l'organisation cliente</strong> ne font pas partie du SVS. Les composants du SVS sont : principes directeurs, gouvernance, chaîne de valeur, pratiques et amélioration continue.",
whynot:["","Les principes directeurs sont bien un composant du SVS.","La chaîne de valeur est bien un composant du SVS.","L'amélioration continue est bien un composant du SVS."]},

{tag:"svs",q:"Quelle activité de la chaîne de valeur garantit la compréhension partagée des objectifs ?",
opts:["Planifier","Engager","Améliorer","Livrer et soutenir"],
ans:0,why:"L'activité <strong>Planifier</strong> de la CVS garantit une compréhension partagée de la vision, de l'état actuel et de la direction d'amélioration pour toutes les dimensions et les 4 pratiques de la chaîne de valeur.",
whynot:["","Engager concerne l'interaction avec les parties prenantes pour comprendre leurs besoins.","Améliorer concerne l'amélioration continue des services et pratiques.","Livrer et soutenir concerne la fourniture quotidienne des services."]},

{tag:"svs",q:"Quelle activité de la CVS vise à assurer la compréhension des besoins des parties prenantes ?",
opts:["Engager","Planifier","Obtenir/construire","Concevoir et faire la transition"],
ans:0,why:"L'activité <strong>Engager</strong> vise à assurer une bonne compréhension des besoins des parties prenantes, leur transparence et une relation continue de qualité entre le prestataire et ses clients/utilisateurs.",
whynot:["","Planifier concerne la définition de la vision et des objectifs.","Obtenir/construire concerne l'acquisition ou le développement des composants de service.","Concevoir et faire la transition concerne la conception et le déploiement des nouvelles versions."]},

{tag:"svs",q:"Quelle activité de la CVS correspond à la mise en production d'un nouveau service ?",
opts:["Concevoir et faire la transition","Obtenir/construire","Livrer et soutenir","Engager"],
ans:0,why:"<strong>Concevoir et faire la transition</strong> assure que les services nouveaux ou modifiés répondent aux attentes qualité, coût et délai — c'est l'activité de la CVS correspondant au déploiement en production.",
whynot:["","Obtenir/construire concerne la production des composants (code, infra), pas la mise en production.","Livrer et soutenir concerne l'opération quotidienne du service après sa mise en production.","Engager concerne la relation avec les parties prenantes."]},

{tag:"svs",q:"Quel est le résultat attendu du SVS selon ITIL 4 ?",
opts:["La création de valeur pour l'organisation, ses clients et ses autres parties prenantes","La conformité des services aux normes ISO 20000","La réduction des coûts IT de 20% minimum par an","La certification ITIL de tous les membres de l'équipe IT"],
ans:0,why:"Le résultat attendu du SVS est la <strong>création de valeur</strong> pour l'organisation, ses clients et ses autres parties prenantes. La valeur est l'objectif central de tout le système.",
whynot:["","La conformité ISO est un objectif possible, pas le résultat du SVS.","La réduction des coûts est un bénéfice potentiel, pas l'objectif principal.","La certification des équipes est un moyen, pas un résultat du SVS."]},

{tag:"svs",q:"Pourquoi parle-t-on de 'silos organisationnels' dans ITIL 4 et comment les éviter ?",
opts:["Les silos fragmentent la valeur — ITIL 4 recommande une approche holistique et la transparence inter-équipes","Les silos sont positifs car ils permettent la spécialisation — ITIL 4 les encourage","Les silos sont inévitables dans les grandes organisations et ITIL 4 ne les aborde pas","Les silos peuvent être évités uniquement par la mise en place d'une structure matricielle"],
ans:0,why:"Les <strong>silos organisationnels</strong> fragmentent la création de valeur. Le SVS est conçu pour <strong>éviter les silos</strong> grâce à une approche holistique, la transparence et la collaboration inter-équipes.",
whynot:["","ITIL 4 considère les silos comme un problème, pas un avantage.","ITIL 4 aborde explicitement les silos comme un obstacle à la création de valeur.","La structure matricielle est une option parmi d'autres, pas la seule solution."]},

{tag:"svs",q:"Quelle activité de la CVS s'assure que les composants de service sont disponibles quand nécessaire ?",
opts:["Obtenir/construire","Livrer et soutenir","Concevoir et faire la transition","Planifier"],
ans:0,why:"<strong>Obtenir/construire</strong> s'assure que les composants de service (infrastructure, logiciels, ressources) sont disponibles selon les spécifications et quand nécessaire pour les autres activités de la CVS.",
whynot:["","Livrer et soutenir concerne l'opération quotidienne, pas l'acquisition des composants.","Concevoir et faire la transition concerne la mise en production des nouveaux services.","Planifier concerne la définition des objectifs et de la vision."]},

/* PRATIQUES */
{tag:"pratiques",q:"Combien de pratiques de gestion ITIL 4 existe-t-il ?",
opts:["34","26","40","18"],
ans:0,why:"ITIL 4 définit <strong>34 pratiques</strong> réparties en 3 catégories : pratiques de gestion générale (14), pratiques de gestion des services (17) et pratiques de gestion technique (3).",
whynot:["","26 n'est pas le bon nombre.","40 n'est pas le bon nombre.","18 n'est pas le bon nombre."]},

{tag:"pratiques",q:"Quelle est la priorité absolue de la gestion des incidents selon ITIL 4 ?",
opts:["Rétablir le service normal aussi rapidement que possible","Identifier la cause profonde avant de tenter toute résolution","Documenter l'incident en détail avant d'agir","Impliquer le management pour tout incident, quelle que soit sa sévérité"],
ans:0,why:"La <strong>gestion des incidents</strong> a pour priorité absolue le <strong>rétablissement du service normal aussi rapidement que possible</strong> pour minimiser l'impact sur les activités. La cause profonde est identifiée par la gestion des problèmes.",
whynot:["","Identifier la cause profonde vient après le rétablissement — c'est la gestion des problèmes.","La documentation ne doit pas retarder la restauration du service.","Le management n'est impliqué que pour les incidents majeurs."]},

{tag:"pratiques",q:"Quelle pratique inclut la classification et la propriété des questions et demandes des utilisateurs ?",
opts:["Le centre de services (service desk)","La gestion des incidents","L'activation du changement","La gestion des niveaux de service"],
ans:0,why:"Le <strong>centre de services (service desk)</strong> fournit un chemin clair pour que les utilisateurs signalent des problèmes, des requêtes et des demandes, qui sont ensuite <strong>reconnues, classifiées, attribuées et traitées</strong>.",
whynot:["","La gestion des incidents traite uniquement les interruptions non planifiées.","L'activation du changement concerne uniquement les demandes de changement.","La gestion des niveaux de service fixe des objectifs de performance."]},

{tag:"pratiques",q:"Quels sont les trois types de changements dans ITIL 4 ?",
opts:["Standard, Normal, Urgence","Mineur, Majeur, Critique","Préventif, Correctif, Évolutif","Demandé, Planifié, Déployé"],
ans:0,why:"ITIL 4 définit <strong>3 types de changements</strong> : <strong>Standard</strong> (pré-autorisé, faible risque), <strong>Normal</strong> (évalué et autorisé selon le processus), <strong>Urgence</strong> (implémenté rapidement pour résoudre un incident ou risque majeur).",
whynot:["","Mineur/Majeur/Critique sont des niveaux de priorité d'incidents, pas les types de changements.","Préventif/Correctif/Évolutif sont des types de maintenance, pas de changements ITIL 4.","Demandé/Planifié/Déployé sont des états, pas des types de changements."]},

{tag:"pratiques",q:"Quel est l'objectif de la gestion des problèmes selon ITIL 4 ?",
opts:["Réduire la probabilité et l'impact des incidents en identifiant leurs causes réelles et potentielles","Rétablir le plus rapidement possible le fonctionnement normal du service","Gérer le cycle de vie complet de toutes les demandes de service","Superviser les performances des services par rapport aux SLA"],
ans:0,why:"La <strong>gestion des problèmes</strong> vise à <strong>réduire la probabilité et l'impact des incidents</strong> en identifiant les causes réelles (réactif) et potentielles (proactif) et en les éliminant durablement.",
whynot:["","Rétablir le service est l'objectif de la gestion des incidents.","Gérer les demandes de service est l'objectif de la pratique éponyme.","Superviser les performances est l'objectif de la gestion des niveaux de service."]},

{tag:"pratiques",q:"Quelle pratique gère les demandes routinières comme la réinitialisation d'un mot de passe ?",
opts:["La gestion des demandes de service, car c'est une demande prédéfinie faisant partie normale de la prestation","La gestion des incidents, car l'incapacité à se connecter constitue une interruption de service","L'activation du changement, car la réinitialisation modifie une configuration du système","La gestion des problèmes, car des réinitialisations répétées peuvent indiquer une cause profonde"],
ans:0,why:"La <strong>gestion des demandes de service</strong> traite les demandes prédéfinies initiées par les utilisateurs qui font partie normale de la prestation — faible risque, processus connu et approuvé.",
whynot:["","Un mot de passe oublié est une situation prédéfinie normale, pas une interruption non planifiée.","L'activation du changement s'applique aux changements pouvant impacter les services, pas aux demandes routinières.","La gestion des problèmes analyse les causes d'incidents, pas les demandes routinières."]},

{tag:"pratiques",q:"Quel est l'objectif de la pratique d'activation du changement ?",
opts:["Maximiser le nombre de changements réussis en s'assurant que les risques sont évalués, les changements autorisés et le planning géré","Déployer rapidement tous les changements demandés par les utilisateurs","Éliminer complètement tous les risques associés aux changements IT","Automatiser intégralement le déploiement des changements en production"],
ans:0,why:"L'<strong>activation du changement</strong> vise à <strong>maximiser le nombre de changements réussis</strong> en évaluant correctement les risques, en autorisant les changements et en gérant le planning pour éviter les conflits.",
whynot:["","Déployer rapidement sans évaluation des risques est contraire à l'objectif.","Éliminer tous les risques est impossible — l'objectif est de les évaluer et les gérer.","L'automatisation peut aider, mais n'est pas l'objectif principal de la pratique."]},

{tag:"pratiques",q:"Quel est l'objectif du service desk selon ITIL 4 ?",
opts:["Capturer la demande de résolution d'incidents et de demandes de service et servir de point d'entrée unique pour tous les utilisateurs","Résoudre uniquement les incidents techniques complexes de niveau 2 et 3","Gérer les relations stratégiques entre le prestataire IT et les directions métier","Superviser la performance de l'ensemble des pratiques ITIL de l'organisation"],
ans:0,why:"Le <strong>service desk</strong> capte la demande de résolution d'incidents et de demandes de service. Il est le <strong>point d'entrée et de contact unique</strong> du prestataire avec tous ses utilisateurs, quel que soit le canal.",
whynot:["","Le service desk traite tous les niveaux — pas uniquement les incidents complexes.","Les relations stratégiques relèvent de la gestion des relations.","Superviser les pratiques ITIL est un rôle managérial."]},

{tag:"pratiques",q:"Les demandes de service doivent-elles être automatisées selon ITIL 4 ?",
opts:["Oui, dans la mesure du possible, les demandes de service doivent être automatisées au maximum","Non, chaque demande étant unique, l'automatisation n'est pas recommandée","Oui, toutes les demandes de service doivent être entièrement automatisées sans exception","Seulement si elles déclenchent d'autres processus comme l'activation du changement"],
ans:0,why:"Selon ITIL 4, les demandes de service <strong>doivent être automatisées dans la mesure du possible</strong>. L'automatisation réduit les délais et améliore la satisfaction des utilisateurs pour ces demandes répétitives et prévisibles.",
whynot:["","L'automatisation est au contraire fortement recommandée pour les demandes de service standardisées.","Toutes les automatiser sans exception peut ne pas être possible.","L'automatisation n'est pas conditionnée au déclenchement d'autres processus."]},

{tag:"pratiques",q:"Quelle pratique inclut la gestion de la CMDB (Configuration Management Database) ?",
opts:["La gestion de la configuration des services","La gestion des actifs IT","La gestion des changements","La gestion des mises en production"],
ans:0,why:"La <strong>gestion de la configuration des services</strong> maintient et gère la <strong>CMDB</strong>, qui contient les informations sur les CI (Configuration Items) et leurs relations.",
whynot:["","La gestion des actifs IT gère le cycle de vie des actifs, pas les relations entre CI dans une CMDB.","La gestion des changements évalue les risques des changements, pas la CMDB.","La gestion des mises en production coordonne la disponibilité des nouvelles versions."]},

{tag:"pratiques",q:"Quelle pratique a un objectif qui inclut de s'assurer que les risques ont été correctement évalués ?",
opts:["L'activation du changement (Change enablement)","La gestion de la configuration des services","La gestion des problèmes","La gestion des niveaux de service"],
ans:0,why:"L'<strong>activation du changement</strong> vise à maximiser le nombre de changements réussis en s'assurant que les <strong>risques ont été correctement évalués</strong>, que les changements sont autorisés et que le planning est géré.",
whynot:["","La gestion de la configuration maintient la CMDB — l'évaluation des risques de changement n'est pas son objectif principal.","La gestion des problèmes identifie les causes d'incidents — pas l'évaluation des risques de changement.","La gestion des niveaux de service fixe des objectifs de performance."]},

{tag:"pratiques",q:"Quelle structure le service desk peut-il adopter selon ITIL 4 ?",
opts:["Centralisé, virtuel ou distribué géographiquement — l'essentiel est sa compréhension de l'organisation","Uniquement centralisé dans un seul lieu pour garantir la cohérence du service","Obligatoirement externalisé pour réduire les coûts opérationnels","Uniquement composé de techniciens hautement spécialisés dans les technologies utilisées"],
ans:0,why:"ITIL 4 reconnaît plusieurs modèles valides : centralisé, virtuel, distribué (follow-the-sun). L'essentiel est que le service desk comprenne <strong>l'organisation dans son ensemble</strong> et fasse preuve d'empathie.",
whynot:["","ITIL 4 décrit explicitement que le service desk peut être virtuel ou distribué.","L'externalisation peut être une option, mais ITIL 4 ne la recommande pas systématiquement.","Un service desk n'a pas besoin d'être hautement technique — ITIL 4 le précise."]},

{tag:"pratiques",q:"Quelle pratique est responsable de définir les objectifs de niveaux de service avec les clients ?",
opts:["La gestion des niveaux de service","Le service desk","La gestion des incidents","L'activation du changement"],
ans:0,why:"La <strong>gestion des niveaux de service</strong> est responsable de définir, documenter, surveiller et rendre compte des niveaux de service convenus avec les clients — notamment via les SLA.",
whynot:["","Le service desk est un point de contact, pas responsable des SLA.","La gestion des incidents traite les interruptions, pas les SLA.","L'activation du changement gère les changements, pas les niveaux de service."]},

{tag:"pratiques",q:"Quelle est une recommandation de la pratique d'amélioration continue ?",
opts:["Il devrait y avoir au moins une petite équipe dédiée à plein temps à l'amélioration continue","Toutes les améliorations doivent être gérées comme des projets à phases multiples","L'amélioration continue doit être isolée des autres pratiques","Les fournisseurs externes doivent être exclus des initiatives d'amélioration"],
ans:0,why:"Bien que tout le monde doive contribuer, ITIL 4 recommande qu'<strong>au moins une petite équipe soit dédiée à plein temps</strong> pour mener les efforts d'amélioration continue et promouvoir la pratique dans toute l'organisation.",
whynot:["","Différents types d'améliorations peuvent appeler différentes méthodes.","L'amélioration continue est au contraire intégrée à toutes les autres pratiques.","Les fournisseurs externes font partie de l'écosystème et doivent aussi contribuer."]},

{tag:"pratiques",q:"Quelle pratique relève de la responsabilité de chacun au sein de l'organisation ?",
opts:["L'amélioration continue","La gestion des niveaux de service","L'activation du changement","La gestion des problèmes"],
ans:0,why:"<strong>L'amélioration continue est la responsabilité de tous</strong> dans l'organisation. L'engagement envers cette pratique doit être ancré dans chaque aspect de l'organisation, à tous les niveaux.",
whynot:["","La gestion des niveaux de service est gérée par des rôles spécifiques.","L'activation du changement implique des rôles spécifiques (change authority, etc.).","La gestion des problèmes s'appuie principalement sur l'expérience de certains membres."]},
