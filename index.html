<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ITIL 4 Quiz">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ITIL 4 Foundation — Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2335;--card:#1a1f2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--text2:#8892aa;--text3:#555f77;
  --accent:#4f7cff;--accent2:#7b5ea7;
  --green:#22c98a;--green-bg:rgba(34,201,138,0.1);--green-border:rgba(34,201,138,0.35);
  --red:#f05a5a;--red-bg:rgba(240,90,90,0.1);--red-border:rgba(240,90,90,0.35);
  --amber:#f5a623;
  --radius:14px;--radius-sm:10px;
  --font:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;min-height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s ease;}
#splash .s-icon{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:0 8px 32px rgba(79,124,255,0.3);}
#splash h1{font-size:22px;font-weight:600;margin-bottom:6px;}
#splash h1 span{color:var(--accent);}
#splash p{font-size:13px;color:var(--text3);}
#splash .loader{width:40px;height:3px;background:var(--bg3);border-radius:2px;margin-top:32px;overflow:hidden;}
#splash .loader-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;animation:load 1.2s ease forwards;}
@keyframes load{to{width:100%;}}
#splash.hidden{opacity:0;pointer-events:none;}

/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}

/* HEADER */
.app-header{background:rgba(15,17,23,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.header-title{font-size:17px;font-weight:600;}
.header-title span{color:var(--accent);}
.header-right{display:flex;gap:8px;align-items:center;}
.hbtn{font-family:var(--font);font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;}
.hbtn.primary{border-color:rgba(79,124,255,0.4);background:rgba(79,124,255,0.1);color:var(--accent);}
.hbtn:hover{background:var(--bg3);color:var(--text);}

/* SCORE ROW */
.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.score-chip{background:var(--bg3);border-radius:var(--radius-sm);padding:7px 8px;text-align:center;}
.score-chip .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.score-chip .val{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--text);line-height:1.2;margin-top:1px;}
.score-chip .val.g{color:var(--green);}.score-chip .val.r{color:var(--red);}.score-chip .val.a{color:var(--accent);}
.prog-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:10px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease;}

/* FILTERS */
.filters{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.f-btn{font-family:var(--font);font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.f-btn.active{background:rgba(79,124,255,0.15);border-color:var(--accent);color:var(--accent);}

/* QUESTION CARD */
.q-list{padding:0 16px 120px;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:border-color .2s;}
.q-card.ok{border-color:var(--green-border);}.q-card.ko{border-color:var(--red-border);}
.q-meta{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.q-num{font-family:var(--font-mono);font-size:10px;color:var(--text3);}
.q-tag{font-size:9px;padding:2px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.q-tag.tp{border-color:rgba(79,124,255,0.3);color:#7aa0ff;}
.q-tag.tc{border-color:rgba(123,94,167,0.4);color:#a07ec8;}
.q-tag.tr{border-color:rgba(34,201,138,0.3);color:#22c98a;}
.q-tag.td{border-color:rgba(245,166,35,0.3);color:var(--amber);}
.q-tag.ts{border-color:rgba(79,200,255,0.3);color:#79c8ff;}
.q-tag.tn{border-color:rgba(240,90,90,0.3);color:#f07a7a;}
.q-status{margin-left:auto;font-size:14px;}
.q-text{font-size:14px;color:var(--text);line-height:1.55;margin-bottom:12px;white-space:pre-line;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--text2);text-align:left;width:100%;font-family:var(--font);transition:all .15s;line-height:1.5;-webkit-appearance:none;}
.opt:active:not(:disabled){transform:scale(0.98);}
.opt:disabled{cursor:default;}
.opt-l{font-family:var(--font-mono);font-size:10px;color:var(--text3);min-width:16px;padding-top:2px;flex-shrink:0;}
.opt.correct{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.opt.correct .opt-l{color:var(--green);}
.opt.wrong{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.opt.wrong .opt-l{color:var(--red);}

/* RATIONALE */
.rationale{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--border2);font-size:12.5px;color:var(--text2);line-height:1.65;animation:fadeIn .2s ease;}
.rationale.ok{border-left-color:var(--green);}.rationale.ko{border-left-color:var(--red);}
.verdict{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.rationale.ok .verdict{color:var(--green);}.rationale.ko .verdict{color:var(--red);}
.rationale strong{color:var(--text);font-weight:500;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

/* PAGINATION */
.pagination{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:16px 16px 0;}
.pg{font-family:var(--font-mono);font-size:12px;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.pg.nav{width:auto;padding:0 14px;}
.pg.active{background:rgba(79,124,255,0.15);border-color:var(--accent);color:var(--accent);}
.pg:disabled{opacity:.35;cursor:default;}

/* EMPTY */
.empty{text-align:center;padding:4rem 1rem;color:var(--text3);font-size:14px;}
.empty .icon{font-size:3rem;margin-bottom:1rem;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:10px 16px;padding-bottom:calc(10px + var(--safe-bottom));gap:8px;}
.bottom-btn{flex:1;font-family:var(--font);font-size:13px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;}
.bottom-btn:hover{background:var(--bg3);}
.bottom-btn.accent{background:rgba(79,124,255,0.1);border-color:rgba(79,124,255,0.4);color:var(--accent);}
.bottom-btn.danger{color:var(--red);border-color:rgba(240,90,90,0.3);}

/* iOS INSTALL BANNER */
#install-banner{margin:0 16px 0;padding:12px 14px;background:linear-gradient(135deg,rgba(79,124,255,0.12),rgba(123,94,167,0.12));border:1px solid rgba(79,124,255,0.25);border-radius:var(--radius-sm);display:none;align-items:center;gap:10px;margin-bottom:2px;}
#install-banner.show{display:flex;}
#install-banner p{font-size:12px;color:var(--text2);flex:1;line-height:1.5;}
#install-banner strong{color:var(--text);}
#install-banner button{font-family:var(--font);font-size:11px;padding:6px 12px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-weight:500;}

/* ── RESULTS SCREEN ── */
#screen-results{padding:0 16px 120px;}
.results-hero{text-align:center;padding:2rem 0 1.5rem;}
.results-score{font-family:var(--font-mono);font-size:64px;font-weight:500;line-height:1;}
.results-score.pass{color:var(--green);}
.results-score.fail{color:var(--red);}
.results-verdict{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-top:8px;}
.results-verdict.pass{color:var(--green);}.results-verdict.fail{color:var(--red);}
.results-sub{font-size:12px;color:var(--text3);margin-top:6px;}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.5rem 0;}
.r-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;}
.r-cell .rv{font-family:var(--font-mono);font-size:22px;font-weight:500;margin-bottom:4px;}
.r-cell .rl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.r-cell .rv.g{color:var(--green);}.r-cell .rv.r{color:var(--red);}.r-cell .rv.a{color:var(--accent);}

.cat-breakdown{margin:1rem 0;}
.cat-breakdown h3{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cat-name{font-size:12px;color:var(--text2);width:90px;flex-shrink:0;}
.cat-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.cat-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.cat-pct{font-family:var(--font-mono);font-size:11px;color:var(--text3);width:32px;text-align:right;}

.wrong-list{margin-top:1.5rem;}
.wrong-list h3{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.wrong-item{background:var(--card);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:13px;}
.wrong-item .wi-q{color:var(--text2);margin-bottom:6px;line-height:1.5;}
.wrong-item .wi-correct{color:var(--green);font-size:12px;}
.wrong-item .wi-your{color:var(--red);font-size:12px;}

.results-actions{display:flex;flex-direction:column;gap:8px;margin-top:1.5rem;}
.r-btn{font-family:var(--font);font-size:14px;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;text-align:center;transition:all .15s;}
.r-btn.primary{background:rgba(79,124,255,0.1);border-color:rgba(79,124,255,0.4);color:var(--accent);}
.r-btn:hover{background:var(--bg3);}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;}
@media(max-width:380px){.header-title{font-size:15px;}.score-chip .val{font-size:14px;}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="s-icon">📋</div>
  <h1>ITIL® 4 <span>Foundation</span></h1>
  <p>Quiz d'entraînement · Français</p>
  <div class="loader"><div class="loader-bar"></div></div>
</div>

<!-- ══════════════ SCREEN QUIZ ══════════════ -->
<div id="screen-quiz" class="screen active">

  <div class="app-header">
    <div class="header-top">
      <div class="header-title">ITIL® 4 <span>Foundation</span></div>
      <div class="header-right">
        <button class="hbtn" onclick="finishSession()">Terminer</button>
        <button class="hbtn primary" onclick="newSession()">↺ Nouvelle</button>
      </div>
    </div>
    <div class="score-row">
      <div class="score-chip"><div class="lbl">Répondues</div><div class="val" id="s-done">0</div></div>
      <div class="score-chip"><div class="lbl">Correctes</div><div class="val g" id="s-ok">0</div></div>
      <div class="score-chip"><div class="lbl">Incorrectes</div><div class="val r" id="s-ko">0</div></div>
      <div class="score-chip"><div class="lbl">Score</div><div class="val a" id="s-pct">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  </div>

  <div class="filters" id="filters">
    <button class="f-btn active" data-f="all">Toutes</button>
    <button class="f-btn" data-f="unanswered">À faire</button>
    <button class="f-btn" data-f="correct">✓ Correctes</button>
    <button class="f-btn" data-f="wrong">✗ Incorrectes</button>
  </div>

  <div id="install-banner">
    <p>📲 Appuie sur <strong>Partager</strong> puis <strong>"Sur l'écran d'accueil"</strong> pour installer l'app !</p>
    <button onclick="dismissBanner()">OK</button>
  </div>

  <div class="q-list" id="quiz-area"></div>
  <div class="pagination" id="pagination"></div>

  <div class="bottom-nav">
    <button class="bottom-btn danger" onclick="resetAnswers()">Effacer réponses</button>
    <button class="bottom-btn" id="bank-info-btn" disabled style="font-size:11px;color:var(--text3);"></button>
    <button class="bottom-btn accent" onclick="finishSession()">Voir résultats →</button>
  </div>
</div>

<!-- ══════════════ SCREEN RESULTS ══════════════ -->
<div id="screen-results" class="screen">

  <div class="app-header">
    <div class="header-top">
      <div class="header-title">Résultats de la <span>session</span></div>
    </div>
  </div>

  <div id="screen-results-body"></div>

</div>

<script>
/* =====================================================================
   BANQUE DE QUESTIONS
   ─────────────────────────────────────────────────────────────────────
   Format d'une question :
   {
     tag: "pratiques",    ← pratiques | concepts | principes | dimensions | svs | scenarios
     q:   "Question ?",
     opts: ["A…","B…","C…","D…"],   ← 4 options de longueur similaire
     ans:  2,             ← index 0-3 de la bonne réponse (varie entre A B C D !)
     why:  "Court pourquoi correct.",
     whynot: ["Pourquoi A faux.","Pourquoi B faux.","","Pourquoi D faux."]
             ← laisser "" pour la bonne réponse
   }
   ===================================================================== */
const BANK = [

/* ── CONCEPTS CLÉS ─────────────────────────────────────────────────── */
{ tag:"concepts",
  q:"Quelle est la définition officielle d'un service selon ITIL 4 ?",
  opts:[
    "Un ensemble de processus et de procédures documentés permettant de gérer les composants techniques d'une organisation",
    "Un accord formel entre un prestataire et un client définissant les niveaux de performance attendus",
    "Un moyen de permettre la co-création de valeur en facilitant les résultats que les clients souhaitent atteindre",
    "Une combinaison de ressources humaines et techniques déployées pour répondre aux demandes des utilisateurs"
  ],
  ans:2,
  why:"Un service est un moyen de permettre la co-création de valeur en facilitant les <strong>résultats (outcomes)</strong> que les clients souhaitent atteindre, sans que le client ait à gérer des coûts et risques spécifiques.",
  whynot:["Un service n'est pas un ensemble de processus documentés — c'est la définition d'une pratique.","Un SLA est un accord de niveau de service, pas la définition d'un service.","","Des ressources humaines et techniques décrivent une capacité, pas un service au sens ITIL 4."]
},

{ tag:"concepts",
  q:"Dans ITIL 4, qu'est-ce que l'utilité (utility) d'un service ?",
  opts:[
    "L'assurance que le service sera disponible selon les niveaux convenus avec le client",
    "La fonctionnalité offerte par un produit ou service pour répondre à un besoin particulier",
    "Le coût total supporté par le consommateur pour bénéficier du service",
    "La mesure de la satisfaction des utilisateurs à l'issue de la prestation"
  ],
  ans:1,
  why:"L'<strong>utilité (utility)</strong> est la fonctionnalité offerte pour répondre à un besoin particulier — ce que le service fait. Elle répond à la question : « est-il apte à l'usage ? »",
  whynot:["C'est la définition de la garantie (warranty), pas de l'utilité.","","Le coût est une composante de la valeur perçue, pas de l'utilité.","La satisfaction client est une mesure de résultat, pas la définition de l'utilité."]
},

{ tag:"concepts",
  q:"Qu'est-ce que la garantie (warranty) dans ITIL 4 ?",
  opts:[
    "La fonctionnalité d'un produit permettant de répondre aux besoins identifiés du consommateur",
    "L'ensemble des activités réalisées par le prestataire pour livrer un service au client",
    "Un document contractuel précisant les obligations légales du prestataire envers le client",
    "L'assurance qu'un produit ou service répondra aux exigences convenues, notamment en termes de disponibilité et sécurité"
  ],
  ans:3,
  why:"La <strong>garantie (warranty)</strong> est l'assurance qu'un produit ou service répondra aux exigences convenues. Elle couvre disponibilité, capacité, continuité et sécurité — le service est-il adapté à l'usage ?",
  whynot:["C'est la définition de l'utilité (utility), pas de la garantie.","Cela décrit la prestation de services, pas la garantie.","Un contrat légal n'est pas la définition ITIL de la garantie.",""]
},

{ tag:"concepts",
  q:"Quelle est la définition d'un incident dans ITIL 4 ?",
  opts:[
    "Une cause potentielle ou avérée d'une dégradation de service qui doit être analysée en profondeur",
    "Une demande formelle d'un utilisateur pour obtenir un accès à un service ou une ressource",
    "Une interruption non planifiée d'un service ou une réduction de la qualité d'un service",
    "Tout changement d'état ayant de l'importance pour la gestion d'un service ou d'un élément de configuration"
  ],
  ans:2,
  why:"Un <strong>incident</strong> est une interruption non planifiée d'un service ou une réduction de sa qualité. La priorité est de rétablir le service le plus vite possible.",
  whynot:["C'est la définition d'un problème, pas d'un incident.","C'est la définition d'une demande de service.","","C'est la définition d'un événement (event) dans ITIL 4."]
},

{ tag:"concepts",
  q:"Qu'est-ce qu'un problème (problem) selon ITIL 4 ?",
  opts:[
    "Une interruption non planifiée d'un service affectant un ou plusieurs utilisateurs simultanément",
    "Une demande d'amélioration soumise par un utilisateur ou une équipe IT interne",
    "Un changement d'état qui a de l'importance pour la gestion d'un service ou d'un CI",
    "Une cause ou cause potentielle d'un ou plusieurs incidents"
  ],
  ans:3,
  why:"Un <strong>problème</strong> est une cause ou cause potentielle d'un ou plusieurs incidents. La gestion des problèmes cherche à identifier et éliminer ces causes profondes.",
  whynot:["C'est la définition d'un incident — un problème en est la cause, pas l'interruption elle-même.","Une demande d'amélioration est traitée via l'amélioration continue, pas la gestion des problèmes.","C'est la définition d'un événement (event).",""]
},

{ tag:"concepts",
  q:"Qu'est-ce qu'une erreur connue (known error) dans ITIL 4 ?",
  opts:[
    "Un incident récurrent dont la cause est clairement identifiée et qui attend une résolution définitive",
    "Un problème pour lequel la cause profonde a été identifiée et une solution de contournement documentée",
    "Une vulnérabilité de sécurité découverte dans un système et non encore corrigée",
    "Un incident qui ne peut pas être résolu car il dépasse les compétences du service desk"
  ],
  ans:1,
  why:"Une <strong>erreur connue</strong> est un problème pour lequel la cause a été identifiée et une solution de contournement (workaround) documentée. La résolution permanente n'est pas encore appliquée — souvent pour des raisons de coût ou de priorité.",
  whynot:["Un incident récurrent est potentiellement lié à un problème, mais ce n'est pas la définition d'une erreur connue.","","Une vulnérabilité de sécurité est gérée par la gestion de la sécurité de l'information, pas par les erreurs connues.","Un incident hors compétences est escaladé — ce n'est pas une erreur connue."]
},

{ tag:"concepts",
  q:"Quelle est la définition d'un événement (event) selon ITIL 4 ?",
  opts:[

{ tag:"scenarios",
  q:"L'organisation souhaite remplacer son système de ticketing actuel par une nouvelle solution ITSM. Quelle séquence de pratiques est la plus appropriée ?",

]; /* ═══ FIN DE LA BANQUE ═══ */

/* ─────────────────────────────────────────────────────────────────────
   CONFIGURATION
   ───────────────────────────────────────────────────────────────────── */
const N_SESSION   = 40;   // Questions par session
const PAGE_SIZE   = 8;    // Questions par page
const PASS_SCORE  = 65;   // Seuil réel ITIL 4 Foundation (%)

/* ─────────────────────────────────────────────────────────────────────
   ÉTAT
   ───────────────────────────────────────────────────────────────────── */
const TAG_CLASS = { pratiques:'tp', concepts:'tc', principes:'tr', dimensions:'td', svs:'ts', scenarios:'tn' };
const TAG_LABEL = { pratiques:'Pratiques', concepts:'Concepts', principes:'Principes', dimensions:'Dimensions', svs:'SVS', scenarios:'Scénario' };
const LETTERS   = ['A','B','C','D'];

/* Validation silencieuse de la banque au démarrage */
BANK.forEach((q,i) => {
  if (!Array.isArray(q.opts) || q.opts.length !== 4) console.warn(`Q${i}: opts invalides`);
  if (typeof q.ans !== 'number' || q.ans < 0 || q.ans > 3) console.warn(`Q${i}: ans invalide`);
});

/* Tirage équilibré par catégorie */
function balancedDraw(bank, n) {
  const byTag = {};
  bank.forEach((q,i) => { (byTag[q.tag] = byTag[q.tag]||[]).push(i); });
  const tags = Object.keys(byTag);
  const perTag = Math.floor(n / tags.length);
  let remainder = n - perTag * tags.length;
  let pool = [];
  tags.forEach(t => {
    const shuffled = shuffle([...byTag[t]]);
    pool.push(...shuffled.slice(0, perTag + (remainder-- > 0 ? 1 : 0)));
  });
  return shuffle(pool).slice(0, n);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let session = balancedDraw(BANK, Math.min(N_SESSION, BANK.length));
let answers  = new Array(session.length).fill(null);
let page     = 0;
let filter   = 'all';

/* Sauvegarde localStorage */
function save() {
  try { localStorage.setItem('itil4_session', JSON.stringify({session,answers,page,filter})); } catch(e){}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('itil4_session'));
    if (d && d.session && d.answers && d.session.length === d.answers.length) {
      session = d.session; answers = d.answers; page = d.page||0; filter = d.filter||'all';
      return true;
    }
  } catch(e){}
  return false;
}

document.getElementById('bank-info-btn').textContent = BANK.length + ' questions en banque';

/* ─────────────────────────────────────────────────────────────────────
   QUIZ RENDER
   ───────────────────────────────────────────────────────────────────── */
function filteredPos() {
  const all = session.map((_,p)=>p);
  if (filter==='all')        return all;
  if (filter==='unanswered') return all.filter(p=>answers[p]===null);
  if (filter==='correct')    return all.filter(p=>answers[p]!==null && answers[p]===BANK[session[p]].ans);
  if (filter==='wrong')      return all.filter(p=>answers[p]!==null && answers[p]!==BANK[session[p]].ans);
  return all;
}

function updateScore() {
  const total    = session.length;
  const answered = answers.filter(a=>a!==null).length;
  const correct  = answers.filter((a,p)=>a!==null && a===BANK[session[p]].ans).length;
  const pct      = answered > 0 ? Math.round(correct/answered*100) : null;
  document.getElementById('s-done').textContent = answered+'/'+total;
  document.getElementById('s-ok').textContent   = correct;
  document.getElementById('s-ko').textContent   = answered-correct;
  document.getElementById('s-pct').textContent  = pct!==null ? pct+'%' : '—';
  document.getElementById('prog').style.width   = Math.round(answered/total*100)+'%';
}

function renderPagination(positions) {
  const total = Math.ceil(positions.length / PAGE_SIZE);
  const el = document.getElementById('pagination');
  el.innerHTML = '';
  if (total <= 1) return;
  const prev = document.createElement('button');
  prev.className='pg nav'; prev.textContent='←'; prev.disabled=page===0;
  prev.onclick=()=>{ if(page>0){page--;renderQuiz();window.scrollTo(0,0);} };
  el.appendChild(prev);
  for (let i=0;i<total;i++) {
    const b=document.createElement('button');
    b.className='pg'+(i===page?' active':'');
    b.textContent=i+1;
    const pi=i;
    b.onclick=()=>{ page=pi;renderQuiz();window.scrollTo(0,0); };
    el.appendChild(b);
  }
  const next=document.createElement('button');
  next.className='pg nav'; next.textContent='→'; next.disabled=page>=total-1;
  next.onclick=()=>{ if(page<total-1){page++;renderQuiz();window.scrollTo(0,0);} };
  el.appendChild(next);
}

function renderQuiz() {
  const positions = filteredPos();
  const pagePos   = positions.slice(page*PAGE_SIZE, page*PAGE_SIZE+PAGE_SIZE);
  const container = document.getElementById('quiz-area');

  /* Sauvegarder la position de scroll de la carte cliquée */
  const prevScroll = window.scrollY;

  container.innerHTML = '';

  if (pagePos.length === 0) {
    container.innerHTML='<div class="empty"><div class="icon">🎯</div>Aucune question ici.<br>Essayez un autre filtre !</div>';
    renderPagination(positions); updateScore(); return;
  }

  pagePos.forEach(pos => {
    const qi       = session[pos];
    const q        = BANK[qi];
    const answered = answers[pos] !== null;
    const correct  = answered && answers[pos] === q.ans;
    const wrong    = answered && !correct;

    const card = document.createElement('div');
    card.className = 'q-card'+(correct?' ok':wrong?' ko':'');
    card.id = 'q-'+pos;

    const optsHTML = q.opts.map((o,oi) => {
      let cls = 'opt';
      if (answered) {
        if (oi===q.ans)          cls += ' correct';
        else if (oi===answers[pos]) cls += ' wrong';
      }
      return `<button class="${cls}" ${answered?'disabled':''} onclick="pick(${pos},${oi})">
        <span class="opt-l">${LETTERS[oi]}</span><span>${o}</span>
      </button>`;
    }).join('');

    /* Rationale courte : pourquoi correct + pourquoi l'option choisie est fausse */
    let ratHTML = '';
    if (answered) {
      let wrongNote = '';
      if (wrong && q.whynot && q.whynot[answers[pos]]) {
        wrongNote = `<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);font-size:11.5px;color:var(--text3);">⚠ Ton choix (${LETTERS[answers[pos]]}) : ${q.whynot[answers[pos]]}</div>`;
      }
      ratHTML = `<div class="rationale ${correct?'ok':'ko'}">
        <div class="verdict">${correct?'✓ Correct':'✗ Incorrect — bonne réponse : '+LETTERS[q.ans]}</div>
        ${q.why}${wrongNote}
      </div>`;
    }

    card.innerHTML = `<div class="q-meta">
      <span class="q-num">Q${String(pos+1).padStart(2,'0')}</span>
      <span class="q-tag ${TAG_CLASS[q.tag]||''}">${TAG_LABEL[q.tag]||q.tag}</span>
      ${answered?`<span class="q-status">${correct?'✓':'✗'}</span>`:''}
    </div>
    <div class="q-text">${q.q}</div>
    <div class="opts">${optsHTML}</div>${ratHTML}`;
    container.appendChild(card);
  });

  renderPagination(positions);
  updateScore();
}

function pick(pos, oi) {
  if (answers[pos] !== null) return;
  answers[pos] = oi;
  save();
  renderQuiz();
  /* Scroll doux vers la carte pour voir la rationale */
  setTimeout(()=>{
    const card = document.getElementById('q-'+pos);
    if (card) card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 80);
}

/* ─────────────────────────────────────────────────────────────────────
   RÉSULTATS
   ───────────────────────────────────────────────────────────────────── */
function finishSession() {
  const total    = session.length;
  const answered = answers.filter(a=>a!==null).length;
  const correct  = answers.filter((a,p)=>a!==null && a===BANK[session[p]].ans).length;
  const pct      = answered > 0 ? Math.round(correct/total*100) : 0;
  const pass     = pct >= PASS_SCORE;

  /* Statistiques par catégorie */
  const catStats = {};
  session.forEach((qi,pos) => {
    const tag = BANK[qi].tag;
    if (!catStats[tag]) catStats[tag] = {total:0, correct:0};
    catStats[tag].total++;
    if (answers[pos] !== null && answers[pos] === BANK[qi].ans) catStats[tag].correct++;
  });

  /* Questions incorrectes */
  const wrongItems = session.map((qi,pos) => ({qi,pos,q:BANK[qi],ans:answers[pos]}))
    .filter(x => x.ans !== null && x.ans !== x.q.ans);

  const body = document.getElementById('screen-results-body');
  body.innerHTML = `
    <div class="results-hero">
      <div class="results-score ${pass?'pass':'fail'}">${pct}%</div>
      <div class="results-verdict ${pass?'pass':'fail'}">${pass?'✓ REÇU':'✗ AJOURNÉ'}</div>
      <div class="results-sub">Seuil de réussite ITIL 4 Foundation : ${PASS_SCORE}% — Examen réel : 40 questions, 60 min</div>
    </div>

    <div class="results-grid">
      <div class="r-cell"><div class="rv a">${total}</div><div class="rl">Questions</div></div>
      <div class="r-cell"><div class="rv g">${correct}</div><div class="rl">Correctes</div></div>
      <div class="r-cell"><div class="rv r">${total-correct}</div><div class="rl">Incorrectes</div></div>
    </div>

    <div class="cat-breakdown">
      <h3>Résultats par catégorie</h3>
      ${Object.entries(catStats).map(([tag, s]) => {
        const pctCat = s.total > 0 ? Math.round(s.correct/s.total*100) : 0;
        const color  = pctCat >= PASS_SCORE ? 'var(--green)' : pctCat >= 50 ? 'var(--amber)' : 'var(--red)';
        return `<div class="cat-row">
          <span class="cat-name">${TAG_LABEL[tag]||tag}</span>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pctCat}%;background:${color}"></div></div>
          <span class="cat-pct">${pctCat}%</span>
        </div>`;
      }).join('')}
    </div>

    ${wrongItems.length > 0 ? `
    <div class="wrong-list">
      <h3>Questions à retravailler (${wrongItems.length})</h3>
      ${wrongItems.map(({qi,pos,q,ans}) => `
        <div class="wrong-item">
          <div class="wi-q">Q${pos+1}. ${q.q}</div>
          <div class="wi-correct">✓ Bonne réponse : <strong>${LETTERS[q.ans]}. ${q.opts[q.ans]}</strong></div>
          ${ans!==null?`<div class="wi-your">✗ Ta réponse : ${LETTERS[ans]}. ${q.opts[ans]}</div>`:'<div class="wi-your" style="color:var(--text3)">— Sans réponse</div>'}
        </div>
      `).join('')}
    </div>` : '<div class="empty" style="padding:2rem 0"><div class="icon">🎉</div>Toutes les questions correctes !</div>'}

    <div class="results-actions">
      <button class="r-btn primary" onclick="reviewSession()">← Revoir les questions</button>
      <button class="r-btn" onclick="newSession()">↺ Nouvelle session (40 questions différentes)</button>
    </div>
  `;

  showScreen('screen-results');
  window.scrollTo(0,0);
}

function reviewSession() {
  filter = 'all'; page = 0;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.f-btn[data-f="all"]').classList.add('active');
  showScreen('screen-quiz');
  renderQuiz();
  window.scrollTo(0,0);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ─────────────────────────────────────────────────────────────────────
   CONTRÔLES
   ───────────────────────────────────────────────────────────────────── */
function newSession() {
  if (answers.some(a=>a!==null)) {
    if (!confirm('Démarrer une nouvelle session avec '+N_SESSION+' questions différentes ?\nTes réponses actuelles seront perdues.')) return;
  }
  session = balancedDraw(BANK, Math.min(N_SESSION, BANK.length));
  answers = new Array(session.length).fill(null);
  page=0; filter='all';
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.f-btn[data-f="all"]').classList.add('active');
  showScreen('screen-quiz');
  save(); renderQuiz(); window.scrollTo(0,0);
}

function resetAnswers() {
  if (!confirm('Effacer toutes tes réponses ? Les questions restent les mêmes.')) return;
  answers = new Array(session.length).fill(null);
  page=0; save(); renderQuiz();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn=e.target.closest('.f-btn');
  if (!btn) return;
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filter=btn.dataset.f; page=0; renderQuiz();
});

/* ─────────────────────────────────────────────────────────────────────
   iOS INSTALL BANNER
   ───────────────────────────────────────────────────────────────────── */
function dismissBanner() {
  document.getElementById('install-banner').classList.remove('show');
  try { localStorage.setItem('itil4_banner','1'); } catch(e){}
}
const isIOS        = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if (isIOS && !isStandalone && !localStorage.getItem('itil4_banner')) {
  document.getElementById('install-banner').classList.add('show');
}

/* ─────────────────────────────────────────────────────────────────────
   SERVICE WORKER
   ───────────────────────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

/* ─────────────────────────────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────────────────────────────── */
load(); // Restaure la session sauvegardée si elle existe

setTimeout(()=>{
  document.getElementById('splash').classList.add('hidden');
  setTimeout(()=>{ document.getElementById('splash').style.display='none'; }, 500);
  renderQuiz();
}, 1200);
</script>
