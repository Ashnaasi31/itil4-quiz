<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ITIL 4 Quiz">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ITIL 4 Foundation — Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#181c27;--bg3:#1e2335;--card:#1a1f2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--text2:#8892aa;--text3:#555f77;
  --accent:#4f7cff;--accent2:#7b5ea7;
  --green:#22c98a;--green-bg:rgba(34,201,138,0.1);--green-border:rgba(34,201,138,0.35);
  --red:#f05a5a;--red-bg:rgba(240,90,90,0.1);--red-border:rgba(240,90,90,0.35);
  --amber:#f5a623;
  --radius:14px;--radius-sm:10px;
  --font:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;min-height:100%;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s ease;}
#splash .s-icon{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:20px;box-shadow:0 8px 32px rgba(79,124,255,0.3);}
#splash h1{font-size:22px;font-weight:600;margin-bottom:6px;}
#splash h1 span{color:var(--accent);}
#splash p{font-size:13px;color:var(--text3);}
#splash .loader{width:40px;height:3px;background:var(--bg3);border-radius:2px;margin-top:32px;overflow:hidden;}
#splash .loader-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;animation:load 1.2s ease forwards;}
@keyframes load{to{width:100%;}}
#splash.hidden{opacity:0;pointer-events:none;}
.screen{display:none;}.screen.active{display:block;}
.app-header{background:rgba(15,17,23,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 16px 12px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.header-title{font-size:17px;font-weight:600;}.header-title span{color:var(--accent);}
.header-right{display:flex;gap:8px;align-items:center;}
.hbtn{font-family:var(--font);font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;transition:all .15s;}
.hbtn.primary{border-color:rgba(79,124,255,0.4);background:rgba(79,124,255,0.1);color:var(--accent);}
.score-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.score-chip{background:var(--bg3);border-radius:var(--radius-sm);padding:7px 8px;text-align:center;}
.score-chip .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.score-chip .val{font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--text);line-height:1.2;margin-top:1px;}
.score-chip .val.g{color:var(--green);}.score-chip .val.r{color:var(--red);}.score-chip .val.a{color:var(--accent);}
.prog-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:10px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease;}
.filters{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.f-btn{font-family:var(--font);font-size:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.f-btn.active{background:rgba(79,124,255,0.15);border-color:var(--accent);color:var(--accent);}
.q-list{padding:0 16px 120px;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:border-color .2s;}
.q-card.ok{border-color:var(--green-border);}.q-card.ko{border-color:var(--red-border);}
.q-meta{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.q-num{font-family:var(--font-mono);font-size:10px;color:var(--text3);}
.q-tag{font-size:9px;padding:2px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.q-tag.tp{border-color:rgba(79,124,255,0.3);color:#7aa0ff;}
.q-tag.tc{border-color:rgba(123,94,167,0.4);color:#a07ec8;}
.q-tag.tr{border-color:rgba(34,201,138,0.3);color:#22c98a;}
.q-tag.td{border-color:rgba(245,166,35,0.3);color:var(--amber);}
.q-tag.ts{border-color:rgba(79,200,255,0.3);color:#79c8ff;}
.q-tag.tn{border-color:rgba(240,90,90,0.3);color:#f07a7a;}
.q-status{margin-left:auto;font-size:14px;}
.q-text{font-size:14px;color:var(--text);line-height:1.55;margin-bottom:12px;white-space:pre-line;}
.opts{display:flex;flex-direction:column;gap:7px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--text2);text-align:left;width:100%;font-family:var(--font);transition:all .15s;line-height:1.5;-webkit-appearance:none;}
.opt:active:not(:disabled){transform:scale(0.98);}.opt:disabled{cursor:default;}
.opt-l{font-family:var(--font-mono);font-size:10px;color:var(--text3);min-width:16px;padding-top:2px;flex-shrink:0;}
.opt.correct{background:var(--green-bg);border-color:var(--green-border);color:var(--green);}
.opt.correct .opt-l{color:var(--green);}
.opt.wrong{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.opt.wrong .opt-l{color:var(--red);}
.rationale{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid var(--border2);font-size:12.5px;color:var(--text2);line-height:1.65;animation:fadeIn .2s ease;}
.rationale.ok{border-left-color:var(--green);}.rationale.ko{border-left-color:var(--red);}
.verdict{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.rationale.ok .verdict{color:var(--green);}.rationale.ko .verdict{color:var(--red);}
.rationale strong{color:var(--text);font-weight:500;}
.why-wrong{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);font-size:11.5px;color:var(--text3);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.pagination{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:16px 16px 0;}
.pg{font-family:var(--font-mono);font-size:12px;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.pg.nav{width:auto;padding:0 14px;}.pg.active{background:rgba(79,124,255,0.15);border-color:var(--accent);color:var(--accent);}
.pg:disabled{opacity:.35;cursor:default;}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3);font-size:14px;}
.empty .icon{font-size:3rem;margin-bottom:1rem;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,23,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:10px 16px;padding-bottom:calc(10px + var(--safe-bottom));gap:8px;}
.bottom-btn{flex:1;font-family:var(--font);font-size:13px;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;}
.bottom-btn.accent{background:rgba(79,124,255,0.1);border-color:rgba(79,124,255,0.4);color:var(--accent);}
.bottom-btn.danger{color:var(--red);border-color:rgba(240,90,90,0.3);}
#install-banner{margin:0 16px 0;padding:12px 14px;background:linear-gradient(135deg,rgba(79,124,255,0.12),rgba(123,94,167,0.12));border:1px solid rgba(79,124,255,0.25);border-radius:var(--radius-sm);display:none;align-items:center;gap:10px;margin-bottom:2px;}
#install-banner.show{display:flex;}
#install-banner p{font-size:12px;color:var(--text2);flex:1;line-height:1.5;}
#install-banner strong{color:var(--text);}
#install-banner button{font-family:var(--font);font-size:11px;padding:6px 12px;border-radius:999px;border:none;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-weight:500;}
#screen-results-body{padding:0 16px 120px;}
.results-hero{text-align:center;padding:2rem 0 1.5rem;}
.results-score{font-family:var(--font-mono);font-size:64px;font-weight:500;line-height:1;}
.results-score.pass{color:var(--green);}.results-score.fail{color:var(--red);}
.results-verdict{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-top:8px;}
.results-verdict.pass{color:var(--green);}.results-verdict.fail{color:var(--red);}
.results-sub{font-size:12px;color:var(--text3);margin-top:6px;}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.5rem 0;}
.r-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;}
.r-cell .rv{font-family:var(--font-mono);font-size:22px;font-weight:500;margin-bottom:4px;}
.r-cell .rl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;}
.r-cell .rv.g{color:var(--green);}.r-cell .rv.r{color:var(--red);}.r-cell .rv.a{color:var(--accent);}
.cat-breakdown{margin:1rem 0;}
.cat-breakdown h3{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cat-name{font-size:12px;color:var(--text2);width:90px;flex-shrink:0;}
.cat-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.cat-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.cat-pct{font-family:var(--font-mono);font-size:11px;color:var(--text3);width:32px;text-align:right;}
.wrong-list{margin-top:1.5rem;}
.wrong-list h3{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.wrong-item{background:var(--card);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:13px;}
.wrong-item .wi-q{color:var(--text2);margin-bottom:6px;line-height:1.5;}
.wrong-item .wi-correct{color:var(--green);font-size:12px;}
.wrong-item .wi-your{color:var(--red);font-size:12px;}
.results-actions{display:flex;flex-direction:column;gap:8px;margin-top:1.5rem;}
.r-btn{font-family:var(--font);font-size:14px;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-weight:500;text-align:center;}
.r-btn.primary{background:rgba(79,124,255,0.1);border-color:rgba(79,124,255,0.4);color:var(--accent);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px;}
</style>
</head>
<body>
<div id="splash">
  <div class="s-icon">📋</div>
  <h1>ITIL® 4 <span>Foundation</span></h1>
  <p>Quiz d'entraînement · Français</p>
  <div class="loader"><div class="loader-bar"></div></div>
</div>

<div id="screen-quiz" class="screen active">
  <div class="app-header">
    <div class="header-top">
      <div class="header-title">ITIL® 4 <span>Foundation</span></div>
      <div class="header-right">
        <button class="hbtn" onclick="finishSession()">Résultats</button>
        <button class="hbtn primary" onclick="newSession()">↺ Nouvelle</button>
      </div>
    </div>
    <div class="score-row">
      <div class="score-chip"><div class="lbl">Répondues</div><div class="val" id="s-done">0</div></div>
      <div class="score-chip"><div class="lbl">Correctes</div><div class="val g" id="s-ok">0</div></div>
      <div class="score-chip"><div class="lbl">Incorrectes</div><div class="val r" id="s-ko">0</div></div>
      <div class="score-chip"><div class="lbl">Score</div><div class="val a" id="s-pct">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="filters" id="filters">
    <button class="f-btn active" data-f="all">Toutes</button>
    <button class="f-btn" data-f="unanswered">À faire</button>
    <button class="f-btn" data-f="correct">✓ Correctes</button>
    <button class="f-btn" data-f="wrong">✗ Incorrectes</button>
  </div>
  <div id="install-banner">
    <p>📲 Appuie sur <strong>Partager</strong> puis <strong>"Sur l'écran d'accueil"</strong> pour installer l'app !</p>
    <button onclick="dismissBanner()">OK</button>
  </div>
  <div class="q-list" id="quiz-area"></div>
  <div class="pagination" id="pagination"></div>
  <div class="bottom-nav">
    <button class="bottom-btn danger" onclick="resetAnswers()">Effacer</button>
    <button class="bottom-btn" id="bank-btn" disabled style="font-size:11px;color:var(--text3);"></button>
    <button class="bottom-btn accent" onclick="finishSession()">Résultats →</button>
  </div>
</div>

<div id="screen-results" class="screen">
  <div class="app-header">
    <div class="header-top">
      <div class="header-title">Résultats de la <span>session</span></div>
    </div>
  </div>
  <div id="screen-results-body"></div>
</div>

<script>
/* =====================================================================
   BANQUE DE QUESTIONS — 100+ questions ITIL 4 Foundation
   Options mélangées automatiquement à chaque session.
   ans: = index de la BONNE réponse dans opts[]
   ===================================================================== */
const BANK = [

/* ══════════════════════════════════════════════════
   CONCEPTS CLÉS  (20 questions)
══════════════════════════════════════════════════ */
{tag:"concepts",q:"Quelle est la définition d'un service selon ITIL 4 ?",
opts:["Un moyen de permettre la co-création de valeur en facilitant les résultats que les clients souhaitent atteindre","Un ensemble de processus permettant de gérer les composants techniques d'une organisation","Un accord formel entre prestataire et client définissant les niveaux de performance attendus","Une combinaison de ressources humaines et techniques pour répondre aux demandes"],
ans:0,why:"Un <strong>service</strong> est un moyen de permettre la co-création de valeur en facilitant les <strong>résultats (outcomes)</strong> que les clients souhaitent atteindre, sans que le client ait à gérer des coûts et risques spécifiques.",
whynot:["","Un service n'est pas un ensemble de processus — c'est la définition d'une pratique.","C'est la définition d'un SLA, pas d'un service.","Des ressources humaines et techniques décrivent une capacité, pas un service."]},

{tag:"concepts",q:"Qu'est-ce que l'utilité (utility) d'un service ?",
opts:["La fonctionnalité offerte par un produit ou service pour répondre à un besoin particulier","L'assurance que le service sera disponible selon les niveaux convenus avec le client","Le coût total supporté par le consommateur pour bénéficier du service","La mesure de la satisfaction des utilisateurs à l'issue de la prestation"],
ans:0,why:"L'<strong>utilité (utility)</strong> est la fonctionnalité offerte pour répondre à un besoin — ce que le service fait. Autrement dit : est-il <em>fitness for purpose</em> ?",
whynot:["","C'est la définition de la garantie (warranty), pas de l'utilité.","Le coût est une composante de la valeur perçue, pas de l'utilité.","La satisfaction client est une mesure de résultat."]},

{tag:"concepts",q:"Qu'est-ce que la garantie (warranty) dans ITIL 4 ?",
opts:["L'assurance qu'un produit ou service répondra aux exigences convenues en termes de disponibilité et sécurité","La fonctionnalité d'un produit permettant de répondre aux besoins identifiés du consommateur","Un document contractuel précisant les obligations légales du prestataire envers le client","L'ensemble des activités réalisées par le prestataire pour livrer un service"],
ans:0,why:"La <strong>garantie (warranty)</strong> est l'assurance qu'un produit ou service répondra aux exigences convenues. Elle couvre disponibilité, capacité, continuité et sécurité — <em>fitness for use</em>.",
whynot:["","C'est la définition de l'utilité (utility).","Un contrat légal n'est pas la définition ITIL de la garantie.","Cela décrit la prestation de services."]},

{tag:"concepts",q:"Pour qu'un service crée de la valeur, que faut-il ?",
opts:["Il doit avoir à la fois l'utilité ET la garantie","Il suffit que l'utilité soit présente si le client est satisfait","Il suffit que la garantie soit présente si le service est disponible","La valeur est créée automatiquement dès que le service est livré"],
ans:0,why:"Un service doit avoir <strong>à la fois l'utilité ET la garantie</strong> pour créer de la valeur. L'utilité sans garantie (service qui marche mais indisponible souvent) ou la garantie sans utilité (service toujours disponible mais inutile) ne suffisent pas.",
whynot:["","L'utilité seule ne suffit pas — un service doit aussi être fiable et disponible.","La garantie seule ne suffit pas — un service doit aussi faire ce qu'il est censé faire.","La valeur ne se crée pas automatiquement — elle est co-créée entre prestataire et consommateur."]},

{tag:"concepts",q:"Quelle est la définition d'un incident dans ITIL 4 ?",
opts:["Une interruption non planifiée d'un service ou une réduction de la qualité d'un service","Une cause potentielle ou avérée d'une dégradation de service","Une demande formelle d'un utilisateur pour accéder à un service","Tout changement d'état ayant de l'importance pour la gestion d'un service"],
ans:0,why:"Un <strong>incident</strong> est une interruption non planifiée d'un service ou une réduction de sa qualité. La priorité est de rétablir le service le plus vite possible.",
whynot:["","C'est la définition d'un problème, pas d'un incident.","C'est la définition d'une demande de service.","C'est la définition d'un événement (event)."]},

{tag:"concepts",q:"Quelle est la définition d'un problème dans ITIL 4 ?",
opts:["Une cause ou cause potentielle d'un ou plusieurs incidents","Une interruption non planifiée d'un service affectant un ou plusieurs utilisateurs","Un changement d'état significatif pour la gestion d'un service ou d'un CI","Une demande formelle d'un utilisateur lors de la prestation normale de service"],
ans:0,why:"Un <strong>problème</strong> est une cause ou cause potentielle d'un ou plusieurs incidents. La gestion des problèmes cherche à identifier et éliminer ces causes profondes pour réduire la récurrence.",
whynot:["","C'est la définition d'un incident.","C'est la définition d'un événement.","C'est la définition d'une demande de service."]},

{tag:"concepts",q:"Qu'est-ce qu'une erreur connue (known error) ?",
opts:["Un problème pour lequel la cause a été identifiée et une solution de contournement documentée","Un incident récurrent dont la cause est encore inconnue et en cours d'investigation","Une vulnérabilité de sécurité découverte dans un système et non encore corrigée","Un incident qui ne peut pas être résolu car il dépasse les compétences du service desk"],
ans:0,why:"Une <strong>erreur connue</strong> est un problème pour lequel la cause a été identifiée et une solution de contournement (workaround) documentée. La résolution permanente n'est pas encore appliquée — souvent pour des raisons de coût ou de priorité.",
whynot:["","Un incident récurrent dont la cause est inconnue est un problème ouvert, pas une erreur connue.","Une vulnérabilité de sécurité relève de la gestion de la sécurité de l'information.","Un incident hors compétences est escaladé — ce n'est pas la définition d'une erreur connue."]},

{tag:"concepts",q:"Quelle est la définition d'un événement (event) selon ITIL 4 ?",
opts:["Tout changement d'état ayant de l'importance pour la gestion d'un service ou d'un élément de configuration","Une interruption non planifiée d'un service ou une réduction de la qualité d'un service","Une cause potentielle d'un ou plusieurs incidents détectée par les équipes IT","Une demande formelle initiée par un utilisateur lors de la prestation normale de service"],
ans:0,why:"Un <strong>événement</strong> est tout changement d'état significatif pour la gestion d'un service ou d'un CI. Les événements sont classés : informatifs, avertissements, ou exceptions nécessitant une action.",
whynot:["","C'est la définition d'un incident.","Un problème est une cause d'incidents, pas un événement.","C'est la définition d'une demande de service."]},

{tag:"concepts",q:"Qu'est-ce qu'une offre de services (service offering) ?",
opts:["Une description d'un ou plusieurs services conçue pour répondre aux besoins d'un groupe de consommateurs cible","Un accord documenté entre prestataire et client précisant les niveaux de service attendus","Un catalogue interne listant toutes les ressources techniques disponibles","Un plan stratégique définissant les services que l'organisation souhaite développer"],
ans:0,why:"Une <strong>offre de services</strong> est une description d'un ou plusieurs services conçue pour répondre aux besoins d'un groupe de consommateurs. Elle peut inclure des biens, des accès à des ressources et des actions de service.",
whynot:["","C'est la définition d'un SLA.","Un catalogue de ressources techniques n'est pas une offre de services au sens ITIL 4.","Un plan stratégique est différent d'une offre de services."]},

{tag:"concepts",q:"Quelle est la différence entre client et utilisateur dans ITIL 4 ?",
opts:["Le client définit les exigences et est responsable des résultats ; l'utilisateur utilise le service au quotidien","Le client utilise le service au quotidien ; l'utilisateur en définit les exigences","Ce sont deux termes interchangeables dans ITIL 4","Le client est toujours externe à l'organisation ; l'utilisateur est toujours interne"],
ans:0,why:"Le <strong>client</strong> définit les exigences et est responsable des résultats. L'<strong>utilisateur</strong> utilise les services au quotidien. Ex : le DRH est client du service de paie, les salariés en sont les utilisateurs.",
whynot:["","C'est l'inverse — le client définit les exigences, l'utilisateur consomme.","Ces termes ont des significations distinctes dans ITIL 4.","Un client peut être interne ou externe, tout comme un utilisateur."]},

{tag:"concepts",q:"Quel rôle soumet des demandes de service ?",
opts:["L'utilisateur ou son représentant autorisé","Le client ou son représentant autorisé","Le sponsor ou son représentant autorisé","Le fournisseur ou son représentant autorisé"],
ans:0,why:"Une demande de service est initiée par <strong>l'utilisateur ou son représentant autorisé</strong>. C'est l'utilisateur qui consomme le service et qui en fait la demande au quotidien.",
whynot:["","Le client définit les exigences globales, pas les demandes individuelles de service.","Le sponsor autorise le budget — il ne soumet pas de demandes de service.","Le fournisseur livre le service, il ne soumet pas de demandes."]},

{tag:"concepts",q:"Qu'est-ce que la co-création de valeur selon ITIL 4 ?",
opts:["La valeur émerge de la collaboration et de l'interaction entre le prestataire et le consommateur","Le prestataire crée la valeur et la livre au client sous forme de service fini","Une méthode de calcul permettant d'évaluer le retour sur investissement d'un service IT","Un accord contractuel par lequel prestataire et client définissent les niveaux de service"],
ans:0,why:"ITIL 4 place la <strong>co-création de valeur</strong> au cœur de sa philosophie. La valeur émerge de la <strong>collaboration et de l'interaction</strong> entre prestataire et consommateur — elle n'est pas créée unilatéralement.",
whynot:["","ITIL 4 rejette l'idée que la valeur est créée seule par le prestataire.","Le calcul du ROI n'est pas la co-création de valeur.","Un accord contractuel est un SLA, pas la co-création de valeur."]},

{tag:"concepts",q:"Un risque peut-il représenter quelque chose de positif selon ITIL 4 ?",
opts:["Oui, un risque peut représenter la possibilité que quelque chose de bénéfique se produise","Non, un risque est toujours une menace ou un événement négatif potentiel","Seulement si le risque a été approuvé par le Change Advisory Board","Oui, mais uniquement dans le cadre de la pratique de gestion des problèmes"],
ans:0,why:"Selon ITIL 4, un <strong>risque peut représenter la possibilité que quelque chose de bon arrive</strong>. Les risques ne sont pas uniquement des menaces — ils peuvent aussi être des opportunités.",
whynot:["","ITIL 4 reconnaît explicitement que les risques peuvent être positifs.","L'approbation du CAB concerne les changements, pas la définition d'un risque positif.","La gestion des risques n'est pas limitée à la pratique de gestion des problèmes."]},

{tag:"concepts",q:"Où enregistre-t-on les opportunités d'amélioration de service ?",
opts:["Dans le registre d'amélioration continue (CIR)","Dans la base de données des erreurs connues","Dans le registre des risques","Dans la base de données des configurations (CMDB)"],
ans:0,why:"Le <strong>registre d'amélioration continue (CIR — Continual Improvement Register)</strong> est l'outil dédié au suivi et à la gestion de toutes les opportunités d'amélioration identifiées dans l'organisation.",
whynot:["","La base des erreurs connues contient les problèmes analysés et leurs workarounds.","Le registre des risques gère les risques identifiés, pas les opportunités d'amélioration.","La CMDB contient les informations de configuration des CI."]},

{tag:"concepts",q:"Quelle est la définition d'un changement dans ITIL 4 ?",
opts:["L'addition, la modification ou la suppression de tout élément pouvant avoir un effet direct ou indirect sur les services","Le déplacement de composants nouveaux ou modifiés vers les environnements de production","La mise à disposition de nouveaux services ou fonctionnalités pour les utilisateurs","L'évaluation des risques associés à une modification de l'infrastructure IT"],
ans:0,why:"Un <strong>changement</strong> est l'addition, la modification ou la suppression de tout élément pouvant avoir un effet direct ou indirect sur les services.",
whynot:["","C'est la définition du déploiement, pas d'un changement.","C'est la définition d'une mise en production.","L'évaluation des risques est une activité de l'activation du changement, pas la définition d'un changement."]},

{tag:"concepts",q:"Qu'est-ce qu'un SLA (Service Level Agreement) ?",
opts:["Un accord documenté entre un prestataire et un client identifiant les services requis et le niveau de service attendu","Un accord interne entre équipes IT définissant leurs obligations mutuelles","Un contrat de sous-traitance signé avec un fournisseur externe de services","Une liste de contrôle utilisée pour vérifier la conformité des incidents résolus"],
ans:0,why:"Un <strong>SLA</strong> est un accord documenté entre un prestataire de services et un client qui identifie les services requis et le niveau de service attendu. Selon ITIL 4, les SLA doivent refléter l'expérience réelle du client.",
whynot:["","Un accord interne entre équipes IT est un OLA (Operational Level Agreement).","Un contrat de sous-traitance fournisseur est un UC (Underpinning Contract).","Une liste de contrôle n'est pas un SLA."]},

{tag:"concepts",q:"Qu'est-ce qu'un OLA (Operational Level Agreement) ?",
opts:["Un accord entre équipes ou unités internes d'une même organisation pour soutenir la livraison des services","Un accord avec un fournisseur externe comme un hébergeur cloud","Un accord de confidentialité lié aux données client","Un document définissant les objectifs annuels de l'équipe IT"],
ans:0,why:"Un <strong>OLA</strong> est un accord interne entre équipes ou unités d'une même organisation, précisant comment elles se soutiennent mutuellement pour satisfaire les engagements des SLA envers les clients.",
whynot:["","Un accord avec un fournisseur externe est un UC (Underpinning Contract).","Un accord de confidentialité est un NDA — pas un OLA.","Les objectifs annuels sont définis dans des documents RH, pas des OLA."]},

{tag:"concepts",q:"Comment s'appelle l'extrant (output) d'un service qui permet à une partie prenante d'atteindre un résultat (outcome) ?",
opts:["Un livrable","Un actif de service","Un élément de configuration","Un produit"],
ans:0,why:"Un <strong>livrable (output)</strong> est un résultat tangible ou intangible d'une activité. Il est distinct du résultat (outcome) qui est l'effet désiré pour la partie prenante. Le livrable <em>permet</em> d'atteindre le résultat.",
whynot:["","Un actif de service est une ressource ou capacité utilisée par le prestataire.","Un CI est un composant géré dans la CMDB.","Un produit est une configuration de ressources de l'organisation."]},

{tag:"concepts",q:"Quelle est la définition d'un actif de service (service asset) ?",
opts:["Toute ressource ou capacité utilisée par un prestataire de services pour fournir un service","Un composant IT qui doit être géré pour garantir la livraison d'un service","Un livrable financièrement valorisable contribuant à la livraison d'un service","Un document décrivant les ressources nécessaires à la mise en œuvre d'un service"],
ans:0,why:"Un <strong>actif de service</strong> est toute ressource ou capacité utilisée par le prestataire pour fournir le service. Il peut s'agir de personnes, de processus, de technologies, d'informations ou de partenaires.",
whynot:["","C'est plutôt la définition d'un CI (Configuration Item).","C'est plus proche de la définition d'un actif IT.","C'est la définition d'un document de service, pas d'un actif."]},

{tag:"concepts",q:"Qu'est-ce que la consommation de services (service consumption) ?",
opts:["Les activités réalisées par une organisation pour consommer des services","Les activités réalisées par un prestataire pour fournir des services","Les activités permettant de co-créer de la valeur entre prestataire et client","Les activités de surveillance et de mesure de la qualité des services fournis"],
ans:0,why:"La <strong>consommation de services</strong> désigne les activités réalisées par une organisation pour consommer des services. Elle inclut la gestion des ressources du consommateur, l'utilisation des services et la demande de services.",
whynot:["","C'est la définition de la fourniture de services (service provision).","La co-création de valeur englobe à la fois la fourniture et la consommation.","La surveillance est une activité de la gestion des niveaux de service."]},

/* ══════════════════════════════════════════════════
   PRINCIPES DIRECTEURS  (18 questions)
══════════════════════════════════════════════════ */
{tag:"principes",q:"Quels sont les 7 principes directeurs d'ITIL 4 ?",
opts:["Se concentrer sur la valeur ; Partir de l'existant ; Progresser itérativement avec des retours ; Collaborer et promouvoir la visibilité ; Penser et travailler holistiquement ; Rester simple et pratique ; Optimiser et automatiser","Planifier, Exécuter, Contrôler, Agir, Améliorer, Mesurer, Rapporter","Stratégie, Conception, Transition, Exploitation, Amélioration continue, Gouvernance, Conformité","Identifier, Protéger, Détecter, Répondre, Récupérer, Communiquer, Améliorer"],
ans:0,why:"Les 7 principes : <strong>1. Se concentrer sur la valeur — 2. Partir de l'existant — 3. Progresser itérativement avec des retours — 4. Collaborer et promouvoir la visibilité — 5. Penser et travailler holistiquement — 6. Rester simple et pratique — 7. Optimiser et automatiser.</strong>",
whynot:["","C'est le cycle PDCA adapté, pas les principes directeurs ITIL 4.","Ce sont les étapes du cycle de vie ITIL v3.","C'est le cadre NIST de cybersécurité."]},

{tag:"principes",q:"Quel principe directeur recommande d'utiliser les services, processus et outils existants avant de tout reconstruire ?",
opts:["Partir de l'existant (Start where you are)","Progresser de manière itérative avec des retours","Rester simple et pratique","Se concentrer sur la valeur"],
ans:0,why:"<strong>Partir de l'existant</strong> recommande d'observer et mesurer ce qui existe déjà avant de décider quoi réutiliser, modifier ou supprimer. Ne pas repartir de zéro si ce qui existe fonctionne.",
whynot:["","Progresser itérativement concerne l'organisation du travail en petites étapes avec des retours réguliers.","Rester simple et pratique concerne la réduction de la complexité inutile.","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur."]},

{tag:"principes",q:"Quel principe directeur recommande de suivre un minimum d'étapes pour réaliser un objectif donné ?",
opts:["Rester simple et pratique","Se concentrer sur la valeur","Progresser de façon itérative avec des retours","Penser et travailler de façon holistique"],
ans:0,why:"<strong>Rester simple et pratique</strong> stipule qu'il faut toujours utiliser le minimum d'étapes nécessaires pour atteindre un objectif. La complexité inutile est un gaspillage à éliminer.",
whynot:["","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur.","Progresser itérativement concerne l'organisation du travail en petites sections.","Penser holistiquement concerne la prise en compte de tous les aspects de l'organisation."]},

{tag:"principes",q:"Quel principe directeur recommande de prendre en compte les quatre dimensions de la gestion des services ?",
opts:["Penser et travailler de façon holistique","Se concentrer sur la valeur","Progresser de façon itérative avec des retours","Optimiser et automatiser"],
ans:0,why:"<strong>Penser et travailler de façon holistique</strong> recommande de prendre en compte tous les aspects de l'organisation — y compris les 4 dimensions — pour créer de la valeur de façon cohérente.",
whynot:["","Se concentrer sur la valeur concerne les besoins du consommateur, pas spécifiquement les 4 dimensions.","Progresser itérativement concerne l'organisation du travail.","Optimiser et automatiser concerne l'efficience des processus."]},

{tag:"principes",q:"Quel principe directeur recommande de collecter les données avant de déterminer ce qui peut être réutilisé ?",
opts:["Partir de l'existant (Commencer là où l'on est)","Se concentrer sur la valeur","Penser et travailler de façon holistique","Progresser de façon itérative avec des retours"],
ans:0,why:"<strong>Partir de l'existant</strong> recommande de mesurer et observer directement les services et méthodes en place pour comprendre leur état réel. Cela évite les hypothèses qui peuvent être désastreuses pour les délais et budgets.",
whynot:["","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur.","Penser holistiquement concerne la prise en compte de tous les aspects de l'organisation.","Progresser itérativement concerne l'organisation du travail en petites sections."]},

{tag:"principes",q:"Quel principe directeur recommande d'impliquer les bonnes parties prenantes et de rendre le travail visible ?",
opts:["Collaborer et promouvoir la visibilité","Rester simple et pratique","Se concentrer sur la valeur","Optimiser et automatiser"],
ans:0,why:"<strong>Collaborer et promouvoir la visibilité</strong> encourage l'implication des bonnes personnes, la transparence des informations et la communication proactive. La collaboration ne signifie pas le consensus — cela signifie impliquer les bonnes personnes au bon moment.",
whynot:["","Rester simple et pratique concerne la réduction de la complexité inutile.","Se concentrer sur la valeur concerne les besoins du consommateur.","Optimiser et automatiser concerne l'efficience des processus."]},

{tag:"principes",q:"Que signifie 'Collaborer et promouvoir la visibilité' concernant le consensus ?",
opts:["Collaborer ne signifie pas obtenir le consensus de tous — il s'agit d'impliquer les bonnes personnes","Collaborer signifie que toutes les parties prenantes doivent approuver chaque décision","Collaborer signifie partager uniquement les informations strictement nécessaires avec les parties concernées","Collaborer signifie déléguer toutes les décisions opérationnelles aux équipes terrain"],
ans:0,why:"ITIL 4 précise explicitement que <strong>la collaboration ne signifie pas le consensus unanime</strong>. Cela signifie impliquer les bonnes personnes, partager les bonnes informations et travailler ensemble — tout en sachant que les décisions doivent être prises.",
whynot:["","ITIL 4 précise que la collaboration ne signifie pas le consensus unanime.","La visibilité implique de partager les informations largement, pas de les restreindre.","Déléguer toutes les décisions n'est pas la collaboration telle que définie par ITIL 4."]},

{tag:"principes",q:"Quelle affirmation décrit le MIEUX la nature des principes directeurs ?",
opts:["Ils peuvent guider une organisation en toutes circonstances et sont des recommandations non obligatoires","Ils imposent des actions et des décisions précises selon les situations","Ils s'appliquent strictement indépendamment les uns des autres","Ils décrivent les processus que toute organisation doit obligatoirement adopter"],
ans:0,why:"Les principes directeurs sont des <strong>recommandations</strong> pouvant guider une organisation dans <strong>toutes les circonstances</strong>. Ils ne sont pas prescriptifs ni obligatoires — ils s'appliquent ensemble et se renforcent mutuellement.",
whynot:["","Les principes directeurs ne sont pas des obligations.","Les principes se renforcent mutuellement et ne s'appliquent pas indépendamment.","Les principes sont des recommandations, pas des processus obligatoires."]},

{tag:"principes",q:"Quel principe directeur recommande d'organiser le travail en petites sections gérables exécutables en temps voulu ?",
opts:["Progresser itérativement avec des retours","Se concentrer sur la valeur","Rester simple et pratique","Partir de l'existant"],
ans:0,why:"<strong>Progresser itérativement avec des retours</strong> préconise d'organiser le travail en sections plus petites et gérables. Cela permet une concentration plus nette, une meilleure adaptation aux retours et une réduction des risques.",
whynot:["","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur.","Rester simple et pratique concerne la réduction de la complexité.","Partir de l'existant concerne l'évaluation de ce qui existe déjà."]},

{tag:"principes",q:"Quel est le bon ordre pour appliquer le principe 'Optimiser et automatiser' ?",
opts:["Optimiser d'abord les processus manuels, puis automatiser ce qui a été optimisé","Automatiser d'abord pour gagner du temps, puis optimiser les processus automatisés","Automatiser et optimiser simultanément pour maximiser l'efficacité","L'ordre n'a pas d'importance tant que l'objectif d'efficience est atteint"],
ans:0,why:"Il faut d'abord <strong>optimiser</strong> (simplifier, éliminer les étapes inutiles), puis <strong>automatiser</strong>. Automatiser un mauvais processus revient à faire plus vite quelque chose qui ne devrait pas être fait.",
whynot:["","Automatiser un processus non optimisé amplifie ses défauts.","Faire les deux simultanément sans ordre logique crée de la confusion.","L'ordre est crucial selon ITIL 4."]},

{tag:"principes",q:"Selon le principe 'Se concentrer sur la valeur', quelle est la toute première étape ?",
opts:["Déterminer qui est le consommateur du service dans chaque situation","Identifier les résultats que le service est censé faciliter","Recenser tous les fournisseurs et partenaires impliqués","Calculer le coût total de possession du service"],
ans:0,why:"La première étape est de <strong>déterminer qui est le consommateur du service</strong>. Sans savoir pour qui on crée de la valeur, il est impossible de définir ce que cette valeur signifie.",
whynot:["","Identifier les résultats vient après avoir identifié le consommateur.","Recenser les fournisseurs est une étape ultérieure.","Calculer les coûts est une étape d'analyse, pas la première."]},

{tag:"principes",q:"Quel principe directeur s'applique quand on essaie de créer une solution pour chaque exception ?",
opts:["Rester simple et pratique nous dit d'éviter de couvrir chaque exception — prévoir des règles générales","Collaborer et promouvoir la visibilité nous dit d'impliquer les experts de chaque exception","Progresser itérativement nous dit de traiter chaque exception dans une itération dédiée","Partir de l'existant nous dit de réutiliser les solutions d'exceptions passées"],
ans:0,why:"<strong>Rester simple et pratique</strong> stipule qu'essayer de couvrir chaque exception mène à la surcomplication. Il vaut mieux concevoir des règles générales capables de traiter les exceptions de façon cohérente.",
whynot:["","Collaborer ne concerne pas spécifiquement la gestion des exceptions.","Progresser itérativement concerne l'organisation générale du travail.","Partir de l'existant concerne l'évaluation de ce qui existe, pas les exceptions."]},

{tag:"principes",q:"Pourquoi ITIL 4 n'est-il pas un cadre prescriptif ?",
opts:["Parce que chaque organisation est unique et doit adapter les pratiques à son contexte, sa taille et ses objectifs","Pour des raisons de propriété intellectuelle protégeant les détails d'implémentation","Parce que les pratiques ITIL sont encore en cours de développement et d'évolution","Pour permettre aux consultants de facturer des prestations d'adaptation sur mesure"],
ans:0,why:"ITIL 4 n'est pas prescriptif car <strong>chaque organisation est unique</strong>. Les principes directeurs et les pratiques doivent être adaptés au contexte, aux objectifs, à la taille et à la maturité de chaque organisation.",
whynot:["","La propriété intellectuelle n'est pas la raison pour laquelle ITIL n'est pas prescriptif.","ITIL 4 est un cadre mature et finalisé.","L'adaptabilité n'est pas conçue pour les consultants mais pour les organisations."]},

{tag:"principes",q:"Quel principe directeur recommande de mesurer et évaluer avant d'agir plutôt que de supposer ?",
opts:["Partir de l'existant","Optimiser et automatiser","Rester simple et pratique","Se concentrer sur la valeur"],
ans:0,why:"<strong>Partir de l'existant</strong> insiste sur l'importance de <strong>mesurer et observer directement</strong> l'état actuel plutôt que de supposer ou de repartir de zéro. Les données réelles évitent les erreurs d'hypothèse.",
whynot:["","Optimiser et automatiser concerne l'amélioration de l'efficience des processus.","Rester simple et pratique concerne la réduction de la complexité.","Se concentrer sur la valeur concerne l'alignement sur les besoins du consommateur."]},

{tag:"principes",q:"Dans le principe 'Progresser itérativement', pourquoi utilise-t-on des retours (feedback) ?",
opts:["Pour détecter et corriger les erreurs rapidement avant qu'elles n'affectent la valeur finale","Pour valider que chaque itération a été approuvée par toutes les parties prenantes","Pour documenter chaque étape et satisfaire aux exigences réglementaires","Pour calculer le coût de chaque itération et ajuster le budget en conséquence"],
ans:0,why:"Les <strong>retours (feedback)</strong> permettent de <strong>détecter et corriger les erreurs rapidement</strong>, d'ajuster la direction si nécessaire et de maximiser la valeur finale en apprenant à chaque itération.",
whynot:["","L'approbation de toutes les parties prenantes n'est pas l'objectif du feedback — c'est la correction rapide.","La documentation est utile mais n'est pas l'objectif principal du feedback.","Calculer les coûts est une activité financière, pas l'objectif du feedback."]},

{tag:"principes",q:"Comment doit-on appliquer les principes directeurs selon ITIL 4 ?",
opts:["En appliquant tous les principes pertinents ensemble — ils se complètent et se renforcent mutuellement","En sélectionnant un seul principe directeur adapté au problème rencontré","En appliquant les principes dans l'ordre numéroté — 1 avant 2, 2 avant 3, etc.","En appliquant uniquement les principes approuvés par la direction de l'organisation"],
ans:0,why:"Les principes directeurs sont conçus pour être <strong>appliqués ensemble</strong>. Ils se complètent et se renforcent mutuellement — aucun principe ne s'applique isolément des autres.",
whynot:["","Sélectionner un seul principe n'est pas la recommandation d'ITIL 4.","Il n'y a pas d'ordre obligatoire d'application des principes.","Les principes ne nécessitent pas d'approbation de la direction pour être appliqués."]},

{tag:"principes",q:"Quel principe directeur est en jeu lorsqu'une équipe IT évite de créer des processus inutilement complexes ?",
opts:["Rester simple et pratique","Optimiser et automatiser","Partir de l'existant","Collaborer et promouvoir la visibilité"],
ans:0,why:"<strong>Rester simple et pratique</strong> est le principe qui guide vers la simplicité et l'élimination de la complexité inutile. Si une activité ou un processus ne contribue pas à la création de valeur, il faut le supprimer ou le simplifier.",
whynot:["","Optimiser et automatiser améliore l'efficience mais ne cherche pas spécifiquement à éviter la complexité.","Partir de l'existant évalue ce qui existe, pas la complexité des nouveaux processus.","Collaborer et promouvoir la visibilité concerne l'implication des parties prenantes."]},

{tag:"principes",q:"Quel principe directeur est directement lié à la réduction du travail manuel répétitif ?",
opts:["Optimiser et automatiser","Rester simple et pratique","Progresser itérativement avec des retours","Partir de l'existant"],
ans:0,why:"<strong>Optimiser et automatiser</strong> vise à maximiser l'efficacité des processus en réduisant le travail manuel répétitif grâce à l'automatisation — après avoir d'abord optimisé les processus concernés.",
whynot:["","Rester simple et pratique concerne la réduction de la complexité, pas nécessairement l'automatisation.","Progresser itérativement concerne l'organisation du travail, pas l'automatisation.","Partir de l'existant concerne l'évaluation de l'existant, pas l'automatisation."]},

/* ══════════════════════════════════════════════════
   QUATRE DIMENSIONS  (10 questions)
══════════════════════════════════════════════════ */
{tag:"dimensions",q:"Quelles sont les quatre dimensions de la gestion des services selon ITIL 4 ?",
opts:["Organisations et personnes ; Information et technologie ; Partenaires et fournisseurs ; Flux de valeur et processus","Stratégie, Conception, Transition, Exploitation continue des services","Personnes, Processus, Produits, Partenaires (les 4P d'ITIL v3)","Gouvernance, Amélioration continue, Chaîne de valeur, Pratiques de gestion"],
ans:0,why:"Les quatre dimensions : <strong>1. Organisations et personnes — 2. Information et technologie — 3. Partenaires et fournisseurs — 4. Flux de valeur et processus.</strong> Tout service doit être analysé sous ces quatre angles.",
whynot:["","Ce sont les étapes du cycle de vie ITIL v3.","Ce sont les 4P d'ITIL v3 — ITIL 4 utilise un modèle différent.","Ce sont des composants du SVS, pas les quatre dimensions."]},

{tag:"dimensions",q:"Quelle dimension se concentre sur les relations avec d'autres organisations dans le cadre de la fourniture de services ?",
opts:["Partenaires et fournisseurs","Organisations et personnes","Flux de valeur et processus","Information et technologie"],
ans:0,why:"La dimension <strong>Partenaires et fournisseurs</strong> couvre toutes les relations avec des organisations externes impliquées dans la conception, le développement, la fourniture et l'amélioration des services.",
whynot:["","Organisations et personnes couvre les rôles, responsabilités et culture internes.","Flux de valeur et processus couvre les activités et leur coordination.","Information et technologie couvre les outils, bases de connaissances et enjeux de sécurité."]},

{tag:"dimensions",q:"Pourquoi est-il essentiel de considérer les quatre dimensions ensemble ?",

{tag:"svs",q:"Quels sont les 5 composants du Système de Valeur des Services (SVS) d'ITIL 4 ?",
opts:["Principes directeurs, gouvernance, chaîne de valeur des services, pratiques et amélioration continue","Processus, fonctions, équipes, organisations et partenaires","Disponibilité, fiabilité, résilience, continuité et temps moyen de restauration","Gestion des incidents, des problèmes, des changements, du service desk et des mises en production"],
ans:0,why:"Le <strong>SVS</strong> comporte 5 composants : <strong>Principes directeurs — Gouvernance — Chaîne de valeur des services — Pratiques — Amélioration continue.</strong>",
whynot:["","Processus, fonctions et équipes sont des éléments opérationnels, pas les composants du SVS.","Ce sont des indicateurs de disponibilité, pas des composants du SVS.","Ce sont des pratiques ITIL 4, pas les composants du SVS lui-même."]},

{tag:"svs",q:"Parmi les éléments suivants, lequel n'est PAS un composant du SVS ?",
opts:["Les quatre dimensions de la gestion des services","L'amélioration continue","Les pratiques","Les principes directeurs"],
ans:0,why:"Les <strong>quatre dimensions</strong> ne sont pas un composant du SVS. Les 5 composants du SVS sont : principes directeurs, gouvernance, chaîne de valeur, pratiques et amélioration continue.",
whynot:["","L'amélioration continue EST un composant du SVS.","Les pratiques SONT un composant du SVS.","Les principes directeurs SONT un composant du SVS."]},

{tag:"svs",q:"Quel concept ITIL 4 comprend et décrit la gouvernance ?",
opts:["Le système de valeur des services (SVS)","Les principes directeurs","Les dimensions de la gestion des services","La chaîne de valeur des services"],
ans:0,why:"La <strong>gouvernance</strong> est un composant du <strong>Système de Valeur des Services (SVS)</strong>. Le SVS comprend : principes directeurs, gouvernance, chaîne de valeur des services, pratiques et amélioration continue.",
whynot:["","Les principes directeurs sont des recommandations — pas le concept qui décrit la gouvernance.","Les dimensions couvrent 4 aspects de la gestion des services, pas la gouvernance.","La chaîne de valeur est un autre composant du SVS, distinct de la gouvernance."]},

{tag:"svs",q:"Quel est le déclencheur (trigger) des activités du SVS ?",
opts:["Une opportunité ou une demande identifiée par l'organisation ou l'un de ses clients","Uniquement une demande de service soumise par un utilisateur via le portail","Un contrat signé avec un fournisseur tiers déclenchant une obligation de livraison","Uniquement une exigence de conformité réglementaire imposée par les autorités"],
ans:0,why:"Le <strong>déclencheur du SVS</strong> est une opportunité ou une demande. L'output du SVS est toujours de la <strong>valeur</strong> pour les parties prenantes.",
whynot:["","Une demande de service est un type de déclencheur, mais pas le seul — une opportunité peut aussi déclencher le SVS.","Un contrat fournisseur n'est pas le déclencheur du SVS.","Une exigence réglementaire peut être une opportunité, mais n'est pas le seul déclencheur."]},

{tag:"svs",q:"Quel est l'output (résultat produit) du SVS ?",
opts:["De la valeur pour les parties prenantes de l'organisation","Un rapport de performance des services pour le comité de direction","Un retour sur investissement calculé sur la durée de vie des services","La restauration du service après une interruption non planifiée"],
ans:0,why:"L'<strong>output du SVS est la valeur</strong> pour les parties prenantes de l'organisation — clients, utilisateurs, mais aussi l'organisation elle-même et ses autres parties prenantes.",
whynot:["","Un rapport de performance est un artefact, pas l'output du SVS.","Le ROI est une mesure financière, pas l'output du SVS.","La restauration du service est un résultat de la gestion des incidents, pas l'output global du SVS."]},

{tag:"svs",q:"Quelles sont les 6 activités de la chaîne de valeur des services ?",
opts:["Planifier, Améliorer, Engager, Concevoir et Transitionner, Obtenir/Construire, Fournir et Soutenir","Planifier, Implémenter, Exécuter, Documenter, Optimiser, Déployer","Préparer, Identifier, Évaluer, Décider, Opérer, Documenter","Stratégie, Conception, Transition, Exploitation, Amélioration, Gouvernance"],
ans:0,why:"Les 6 activités (<strong>mémo PIEDOD</strong>) : <strong>P</strong>lanifier — <strong>I</strong>mprove (Améliorer) — <strong>E</strong>ngager — <strong>D</strong>esign & Transition — <strong>O</strong>btain/Build — <strong>D</strong>eliver & Support.",
whynot:["","Ce ne sont pas les activités officielles de la chaîne de valeur ITIL 4.","Ce ne sont pas les activités officielles de la chaîne de valeur ITIL 4.","Ce sont les phases du cycle de vie ITIL v3."]},

{tag:"svs",q:"Quelle activité de la chaîne de valeur détermine l'état actuel des quatre dimensions ?",
opts:["Planifier","Engager","Fournir et soutenir","Améliorer"],
ans:0,why:"L'activité <strong>Planifier</strong> vise à garantir une compréhension commune de la vision, de l'état actuel et de la direction d'amélioration pour toutes les dimensions et tous les produits/services.",
whynot:["","Engager concerne les interactions avec les parties prenantes.","Fournir et soutenir concerne la livraison et le support des services.","Améliorer concerne l'amélioration continue des produits, services et pratiques."]},

{tag:"svs",q:"Quel est le rôle de la gouvernance dans le SVS ?",
opts:["Évaluer, diriger et surveiller les activités de l'organisation pour s'assurer qu'elles créent de la valeur","Gérer les incidents majeurs et coordonner les équipes d'intervention en cas de crise","Automatiser les processus répétitifs pour réduire les coûts opérationnels","Gérer les contrats fournisseurs et s'assurer de la conformité des SLA"],
ans:0,why:"La <strong>gouvernance</strong> dans le SVS comprend 3 activités : <strong>Évaluer</strong> les besoins et stratégies — <strong>Diriger</strong> via la planification et les politiques — <strong>Surveiller</strong> les performances et la conformité.",
whynot:["","Gérer les incidents majeurs est le rôle de la gestion des incidents.","L'automatisation est liée au principe 'Optimiser et automatiser', pas à la gouvernance.","Les contrats fournisseurs relèvent de la gestion des fournisseurs."]},

{tag:"svs",q:"Comment les activités de la chaîne de valeur transforment-elles les entrées en livrables ?",
opts:["En faisant appel à une combinaison de pratiques","En s'appuyant sur une équipe fonctionnelle unique et dédiée","En automatisant l'ensemble des processus de gestion","En identifiant et traitant les demandes de service des utilisateurs"],
ans:0,why:"Les activités de la chaîne de valeur transforment les entrées en livrables en <strong>faisant appel à une combinaison de pratiques</strong>. Aucune activité ne s'appuie sur une seule pratique.",
whynot:["","Une seule équipe fonctionnelle ne peut pas couvrir toutes les activités de la chaîne de valeur.","L'automatisation peut aider, mais n'est pas le mécanisme général de transformation.","Identifier les demandes de service est une activité spécifique, pas le mécanisme général."]},

{tag:"svs",q:"À quoi correspond l'ensemble des étapes permettant l'implémentation d'améliorations ?",
opts:["Le modèle d'amélioration continue","L'activité 'Améliorer' de la chaîne de valeur des services","Le registre d'amélioration continue (CIR)","L'activité 'Engager' de la chaîne de valeur des services"],
ans:0,why:"Le <strong>modèle d'amélioration continue</strong> est l'ensemble structuré des 7 étapes permettant l'implémentation d'améliorations : Quelle est la vision ? / Où en sommes-nous ? / Où voulons-nous être ? / Comment y arriver ? / Agir / Sommes-nous arrivés ? / Maintenir l'élan.",
whynot:["","L'activité 'Améliorer' est une des 6 activités de la chaîne de valeur — pas le modèle en 7 étapes.","Le registre CSI est l'outil de suivi des opportunités, pas le modèle d'implémentation.","L'activité 'Engager' concerne les interactions avec les parties prenantes."]},

{tag:"svs",q:"Quelle étape du modèle d'amélioration continue vient après 'Avons-nous atteint l'objectif ?' ?",
opts:["Maintenir l'élan (Conserver le momentum)","Combien cela a-t-il coûté ?","Où voulons-nous être ?","Passer à l'action"],
ans:0,why:"Après avoir vérifié si l'objectif est atteint, la 7e et dernière étape est de <strong>maintenir l'élan</strong> : consolider les gains, partager les apprentissages et s'assurer que les améliorations sont pérennisées.",
whynot:["","Le coût n'est pas une étape officielle du modèle d'amélioration continue ITIL 4.","'Où voulons-nous être ?' est la 3e étape, bien avant la vérification.","'Passer à l'action' est la 5e étape — elle vient avant la vérification."]},

{tag:"svs",q:"Quelle est la différence entre la chaîne de valeur des services et un flux de valeur de service ?",
opts:["La chaîne de valeur est le modèle générique à 6 activités ; un flux de valeur est une combinaison spécifique d'activités pour un scénario particulier","Ce sont deux termes strictement synonymes dans ITIL 4","La chaîne de valeur est plus détaillée et opérationnelle que les flux de valeur","Les flux de valeur s'appliquent uniquement aux services cloud et aux environnements DevOps"],
ans:0,why:"La <strong>chaîne de valeur</strong> est le modèle générique avec ses 6 activités. Un <strong>flux de valeur de service</strong> est une combinaison spécifique de ces activités et de pratiques, conçue pour un scénario particulier.",
whynot:["","Ces termes ont des significations distinctes dans ITIL 4 — ils ne sont pas synonymes.","C'est l'inverse : la chaîne de valeur est le modèle générique, les flux sont des instanciations spécifiques.","Les flux de valeur s'appliquent à tout type de service."]},
